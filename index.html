function contsOf(s,pid){ return MAP.conts.filter(c=>c.terr.every(t=>s.owner[t]===pid)).map(c=>c.id); }
function curPid(s){ return s.order[s.current]; }
function mover(s){ const pa=s.pendingAttack; return (pa && pa.stage==='def') ? pa.def : curPid(s); }
const SEA=new Set(MAP.routes.flatMap(r=>[r.a+'|'+r.b,r.b+'|'+r.a]));
const isSea=(a,b)=>SEA.has(a+'|'+b);
const EVENTS=['volunteers','desert','supply','storm','famine','trench','luck','spy','infiltrate','truce','market','gamble','kamikaze'];
const EV_CHOICE=['volunteers','trench','infiltrate','spy','market','kamikaze'];
function exOn(s,k){ return !!(s.settings.extras && s.settings.extras[k]); }
// dado con generale: 1-4 al 15,5%, 5 e 6 al 19%
function dieW(){ const r=rint(1000); return r<155?1:r<310?2:r<465?3:r<620?4:r<810?5:6; }
function rollG(n,gen){ return Array.from({length:n},()=>gen?dieW():1+rint(6)).sort((x,y)=>y-x); }
function genAt(s,tid){ const p=s.owner[tid]; const g=s.generals&&s.generals[p]; return g&&g.tid===tid ? g : null; }
function airOn(s){ return !!(s.settings.extras && s.settings.extras.air); }
function cardSym(s,c){ return c[0]==='J' ? 'J' : (airOn(s) ? T[c].card : T[c].card0); }
function touchesMine(s,pid,tid){ return T[tid].adj.some(x=>s.owner[x]===pid); }
function shielded(s,tid){ return s.shields && s.shields[tid] && s.shields[tid]===s.owner[tid]; }

function log(s,k,pids=[],v={}){ s.log.push({k,p:pids,v,n:s.seq}); if(s.log.length>90) s.log.splice(0,s.log.length-90); }

function newGame(settings, players){
  const used=new Set(); players=players.map(p=>{ let c=p.color; if(!COLOR[c]||used.has(c)) c=COLORS.find(x=>!used.has(x.id)).id; used.add(c); return {...p,color:c}; });
  const order = shuffle(players.map(p=>p.pid));
  const n = order.length;
  const s = {
    v:11, status:'playing', settings: clone(settings), seq:1,
    order, players: Object.fromEntries(players.map(p=>[p.pid,{color:p.color, name:p.name||''}])), v4:true,
    owner:{}, armies:{}, retired:{}, setupLeft:{}, eliminated:{}, hands:{}, powers:{}, shields:{}, autoDef:{}, evNext:{}, trench:{}, generals:{}, capitals:{}, pendingCapital:null, truce:null, marketGot:null, gamble:null, pendingGamble:null, capTaken:{}, missions:{}, rewardDue:{}, pendingReward:null, pearls:{}, chest:null, nextChest:2, bf:{mines:{},wire:{},smoke:{},sabo:{},tired:{},used:{}}, season:null, conqN:0, fortN:0, golden:null, lastGlobal:0, pearlWins:{}, pendingPearl:null, hospital:{}, pearlUsed:{}, ts:null, turnArm:null, lostSince:{}, lastLost:{}, attackedFrom:{}, defWins:{}, pendingEvent:null, lastEvent:null, storm:null, luck:null, spy:null,
    deck:[], discard:[], reshuffles:0, charge:null,
    current:0, round:1, phase:'setup', placed:0, pool:0, traded:false, conquered:false,
    pendingMove:null, pendingAttack:null, lastRoll:null, lastFx:null, undo:null, lastRound:null, tiebreak:null, winner:null, endAfterMove:null,
    startedAt: Date.now(), turnDeadline:null, log:[]
  };
  const terr = shuffle(TIDS);
  terr.forEach((t,i)=>{ const p=order[(i+1)%n]; s.owner[t]=p; s.armies[t]=1; });
  for (const p of order){ s.hands[p]=[]; s.powers[p]={}; s.evNext[p]=3+rint(4); s.setupLeft[p]=START_ARMIES[n]-ownedBy(s,p).length; }
  s.deck = shuffle([...TIDS,'J1','J2']);
  log(s,'start',[order[0]]);
  beginSetupTurn(s);
  return s;
}
function setDeadline(s){ const sec=+s.settings.turnSeconds||0; s.turnDeadline = sec ? Date.now()+sec*1000 : null; }
function beginSetupTurn(s){
  let guard=0;
  while (s.setupLeft[curPid(s)]<=0 && guard++<10) s.current=(s.current+1)%s.order.length;
  if (s.order.every(p=>s.setupLeft[p]<=0)) { s.current=0; s.round=1; startTurn(s); return; }
  s.placed=0; s.phase='setup'; s.undo={armies:clone(s.armies)}; setDeadline(s);
}
function setupLimit(s){ return Math.min(3, s.setupLeft[curPid(s)] + s.placed); }

function reinforcementsFor(s,pid){
  const terr=ownedBy(s,pid).length, base=Math.floor(terr/3);
  const cl=contsOf(s,pid), cont=cl.reduce((a,c)=>a+CONT[c].bonus,0)*((s.golden&&s.golden===s.round)?2:1);
  const extra=s.settings.bonusRule?1:0;
  const pearl=2*Object.entries(s.pearls||{}).filter(([t,p])=>p.type==='mine'&&s.owner[t]===pid).length;
  return {base, cont, conts:cl, extra, pearl, total:base+cont+extra+pearl};
}
function startTurn(s){
  const pid=curPid(s); const r=reinforcementsFor(s,pid);
  s.phase='reinforce'; s.pool=r.total; s.traded=false; s.conquered=false; s.pendingMove=null; s.pendingAttack=null;
  s.charge=null; s.autoDef={}; s.storm=null; s.luck=null; s.pendingEvent=null; s.truce=null; s.marketGot=null; s.pendingCapital=null; s.gamble=null; s.pendingGamble=null; if(s.spy&&s.spy.pid===pid) s.spy=null;
  for (const t in s.shields) if (s.shields[t]===pid) delete s.shields[t];
  for (const t in s.trench) if (s.trench[t]===pid) delete s.trench[t];
  log(s,'turn',[pid],{r:s.round,n:r.total,c:r.cont});
  if (exOn(s,'capitals') && (!s.capitals[pid] || s.owner[s.capitals[pid]]!==pid)) s.pendingCapital=pid;
  s.conqN=0; s.fortN=0;
  if (exOn(s,'battle')) bfStartTurn(s,pid);
  if (exOn(s,'seasons')) seasonsStartTurn(s,pid);
  if (exOn(s,'pearls')) pearlsStartTurn(s,pid);
  if (exOn(s,'missions')) missionsStartTurn(s,pid);
  if (exOn(s,'events')){ s.evNext[pid]=(s.evNext[pid]??(3+rint(4)))-1; if (s.evNext[pid]<=0){ s.evNext[pid]=3+rint(4); triggerEvent(s,pid); } }
  s.undo={armies:clone(s.armies), pool:s.pool}; setDeadline(s);
}

function busy(s){ if (s.pendingGamble) return 'pendingGamble'; if (s.pendingCapital) return 'pendingCapital'; if (s.pendingEvent) return 'pendingEvent'; if (s.pendingAttack) return 'pendingAttack'; if (s.pendingMove) return 'pendingMove'; return null; }
function myTurn(s,pid){ return curPid(s)===pid && s.status==='playing'; }

// ---------- schieramento e rinforzi ----------
function actPlace(s,pid,tid,n){
  if (!myTurn(s,pid)) return 'notTurn';
  if (s.owner[tid]!==pid) return 'ownOnly';
  if (s.phase==='setup'){ n=Math.min(n,setupLimit(s)-s.placed); if(n<=0) return 'setupDone';
    s.armies[tid]+=n; s.placed+=n; s.setupLeft[pid]-=n; s.seq++; return null; }
  if (s.phase==='reinforce'){ n=Math.min(n,s.pool); if(n<=0) return 'noArmies'; s.armies[tid]+=n; s.pool-=n; s.seq++; return null; }
  return 'notNow';
}
function actUndo(s,pid){
  if (!myTurn(s,pid) || !s.undo) return 'nothingUndo';
  if (s.phase==='setup'){ s.setupLeft[pid]+=s.placed; s.placed=0; s.armies=clone(s.undo.armies); s.seq++; return null; }
  if (s.phase==='reinforce'){ s.armies=clone(s.undo.armies); s.pool=s.undo.pool; s.seq++; return null; }
  return 'nothingUndo';
}
function actEndSetup(s,pid){
  if (!myTurn(s,pid) || s.phase!=='setup') return 'notNow';
  if (s.placed < setupLimit(s)) return 'placeAll';
  log(s,'placed',[pid],{n:s.placed});
  s.current=(s.current+1)%s.order.length; s.seq++; beginSetupTurn(s); return null;
}

// ---------- carte ----------
function tradeValue(s,pid,cards){
  if (!cards || cards.length!==3 || new Set(cards).size!==3) return null;
  if (!cards.every(c=>s.hands[pid].includes(c))) return null;
  const sy=cards.map(c=>cardSym(s,c)).sort().join('');
  let v=null;
  if (sy==='AAA') v=TRADE.AAA; else if (sy==='FFF') v=TRADE.FFF; else if (sy==='CCC') v=TRADE.CCC; else if (sy==='ACF') v=TRADE.ACF;
  else if (/^(AA|CC|FF)J$/.test(sy)) v=TRADE.JOKER;
  else if (airOn(s) && /^[ACF]{2}P$/.test(sy)) v=TRADE.PLANE;
  if (v===null) return null;
  const bonus=cards.filter(c=>c[0]!=='J' && s.owner[c]===pid).length*2;
  return {base:v, bonus, total:v+bonus};
}
function powerOf(s,pid,cards){
  if (!airOn(s)) return null;
  if (!cards || new Set(cards).size!==cards.length || !cards.every(c=>s.hands[pid].includes(c))) return null;
  const sy=cards.map(c=>cardSym(s,c)); if (sy.includes('J')) return null;
  for (const k in POWERS){
    const need=POWERS[k].need.split(''); if (need.length!==cards.length) continue;
    const rest=need.slice(); let ok=true;
    for (const x of sy){ if (x==='J') continue; const i=rest.indexOf(x); if(i<0){ok=false;break;} rest.splice(i,1); }
    if (ok) return k;
  }
  return null;
}
function actTrade(s,pid,cards){
  if (!myTurn(s,pid) || s.phase!=='reinforce') return 'tradeOnlyReinf';
  if (s.traded) return 'alreadyTraded';
  const v=tradeValue(s,pid,cards); if(!v) return 'badCombo';
  s.hands[pid]=s.hands[pid].filter(c=>!cards.includes(c)); s.discard.push(...cards);
  s.pool+=v.total; s.traded=true; s.undo={armies:clone(s.armies), pool:s.pool}; s.seq++;
  log(s,'trade',[pid],{n:v.total}); return null;
}
function canUsePowers(s,pid){ return airOn(s) && myTurn(s,pid) && (s.phase==='reinforce'||s.phase==='attack') && !busy(s); }
function actConvert(s,pid,cards){
  if (!airOn(s)) return 'badCombo';
  if (!myTurn(s,pid) || s.phase==='setup' || s.phase==='fortify' || busy(s)) return 'convertWhen';
  const k=powerOf(s,pid,cards); if(!k) return 'badCombo';
  s.hands[pid]=s.hands[pid].filter(c=>!cards.includes(c)); s.discard.push(...cards);
  s.powers[pid][k]=(s.powers[pid][k]||0)+1; s.seq++;
  log(s,'gotPower',[pid],{pw:k}); return null;
}
function powerTargets(s,pid,k){
  const ok=t=>{
    if (s.owner[t]===pid || shielded(s,t)) return false;
    const def=s.owner[t]; const last = s.round<=4 && ownedBy(s,def).length===1;
    if (k==='raid') return touchesMine(s,pid,t) && s.armies[t]>=2;
    if (k==='nuke') return !last;
    return false;
  };
  return TIDS.filter(ok);
}
function handleElimination(s,pid,def){
  if (ownedBy(s,def).length>0) return;
  s.eliminated[def]=pid; s.hands[pid].push(...s.hands[def]); s.hands[def]=[]; delete s.generals[def]; if(s.capitals) delete s.capitals[def];
  for (const k in s.powers[def]) s.powers[pid][k]=(s.powers[pid][k]||0)+s.powers[def][k];
  s.powers[def]={}; capHand(s,pid);
  log(s,'elim',[pid,def]);
  if (alive(s).length===1) s.endAfterMove='last';
  else if (s.settings.mode==='ta' && s.reshuffles>=1) s.endAfterMove='elim';
}
function actPower(s,pid,k,tid){
  if (!canUsePowers(s,pid)) return 'powerWhen';
  if (!(s.powers[pid][k]>0)) return 'noPower';
  if (!powerTargets(s,pid,k).includes(tid)) return 'badTarget';
  const fx={id:s.seq+'-'+rint(1e6), type:k, tid:tid||null, by:pid, def:tid?s.owner[tid]:null, killed:0};
  if (k==='raid'){ const n=s.armies[tid]; const kill=Math.min(n-1,Math.max(1,Math.floor(n/2))); s.armies[tid]-=kill; fx.killed=kill;
    log(s,'raid',[pid,fx.def],{t0:tid,n:kill}); }
  else { const def=s.owner[tid]; fx.killed=s.armies[tid];
    s.conqN++; if (exOn(s,'battle')){ delete s.bf.mines[tid]; delete s.bf.wire[tid]; delete s.bf.smoke[tid]; }
    if (genAt(s,tid)) delete s.generals[def]; if (exOn(s,'pearls')) pearlsOnConquest(s,pid,def,tid); if (exOn(s,'missions')) missionsOnConquest(s,pid,null,tid,def,false); delete s.trench[tid]; capitalFalls(s,pid,def,tid);
    s.owner[tid]=pid; s.armies[tid]=1; s.conquered=true; delete s.shields[tid];
    log(s,k,[pid,def],{t0:tid});
    handleElimination(s,pid,def); if (exOn(s,'missions')) checkMissions(s,pid); }
  s.powers[pid][k]--; s.lastFx=fx; s.seq++;
  if (s.endAfterMove){ const w=s.endAfterMove; s.endAfterMove=null; finishGame(s,w==='last'?'last':'points'); }
  return null;
}

// ---------- combattimento ----------
function actEndReinforce(s,pid){
  if (!myTurn(s,pid) || s.phase!=='reinforce') return 'notNow';
  if (s.pool>0) return 'placeAll';
  s.phase='attack'; s.undo=null; s.seq++; return null;
}
function attackBlock(s,pid,from,to){
  if (s.phase!=='attack') return 'notAttack';
  if (busy(s)) return busy(s);
  if (s.owner[from]!==pid) return 'ownFrom';
  if (s.owner[to]===pid) return 'alreadyYours';
  if (!T[from].adj.includes(to)) return 'notAdjacent';
  if (s.storm===pid && isSea(from,to)) return 'storm';
  if (s.truce && s.truce.pid===pid && s.truce.tid===to) return 'truce';
  if (exOn(s,'battle')){ if (TERRAIN[to]==='mtn' && s.armies[from]<3) return 'mtn3'; if (s.bf.tired[from]) return 'tired'; if (s.bf.sabo[routeKey(from,to)]) return 'sabotaged'; }
  if (s.armies[from]<2) return 'need2';
  if (s.round<=4 && ownedBy(s,s.owner[to]).length===1) return 'noElim4';
  return null;
}
function canAttack(s,pid,from,to){ return !attackBlock(s,pid,from,to); }
function actDeclare(s,pid,from,to,nd){
  if (!myTurn(s,pid)) return 'notTurn';
  const b=attackBlock(s,pid,from,to); if(b) return b;
  nd=Math.max(1,Math.min(maxDice(s,from,to),nd));
  const def=s.owner[to];
  if (s.ts){ s.ts.attacked=true; if(s.ts.underdog[to]===undefined) s.ts.underdog[to]=s.armies[from]<s.armies[to]; }
  s.attackedFrom[def]={tid:from,by:pid};
  if (s.settings.defense==='auto' || s.autoDef[def]){ resolveBattle(s,pid,from,to,nd,rollG(Math.min(3,s.armies[to]),!!genAt(s,to)),s.seq+'-'+rint(1e6)); return null; }
  s.pendingAttack={id:s.seq+'-'+rint(1e6), from, to, nd, att:pid, def, stage:'def', since:Date.now(), deadline:Date.now()+DEF_MS, d:null};
  s.seq++; return null;
}
function actDefend(s,pid,dd,auto){
  const pa=s.pendingAttack; if (!pa || pa.stage!=='def' || pa.def!==pid) return 'noDefense';
  dd=Math.max(1,Math.min(3,dd,s.armies[pa.to])); pa.d=rollG(dd,!!genAt(s,pa.to)); pa.stage='att';
  if (auto) s.autoDef[pid]=true;
  if (s.turnDeadline) s.turnDeadline += Date.now()-pa.since;
  log(s,'defend',[pid],{n:dd}); s.seq++; return null;
}
function autoDefend(s){
  const pa=s.pendingAttack; if (!pa || pa.stage!=='def') return;
  pa.d=rollG(Math.min(3,s.armies[pa.to]),!!genAt(s,pa.to)); pa.stage='att';
  if (s.turnDeadline) s.turnDeadline += Date.now()-pa.since;
  log(s,'autodef',[pa.def]); s.seq++;
}
function actRoll(s,pid){
  const pa=s.pendingAttack; if (!pa || pa.stage!=='att' || pa.att!==pid) return 'waitDefense';
  s.pendingAttack=null; resolveBattle(s,pid,pa.from,pa.to,pa.nd,pa.d,pa.id); return null;
}
function actCancelAttack(s,pid){
  const pa=s.pendingAttack; if (!pa || pa.att!==pid || pa.stage!=='def') return 'cantCancel';
  if (s.turnDeadline) s.turnDeadline += Date.now()-pa.since;
  s.pendingAttack=null; s.seq++; return null;
}
function battleDice(s,pid,from,to,a,d){
  const def=s.owner[to]; d=d.slice(); a=a.slice(); let aMod=false, dMod=false;
  if (s.charge===pid && a[0]<6){ a[0]++; aMod=true; a.sort((x,y)=>y-x); }
  if ((shielded(s,to) || s.trench[to]===def) && d[0]<6){ d[0]++; dMod=true; d.sort((x,y)=>y-x); }
  const capD = !!(s.capitals && s.capitals[def]===to); if (capD) d=d.map(x=>Math.min(6,x+1));
  const pf=s.pearls&&s.pearls[from], pt=s.pearls&&s.pearls[to];
  if (pf && pf.type==='banner' && a[0]<6){ a[0]++; aMod=true; a.sort((x,y)=>y-x); }
  if (pt && pt.type==='bastion' && d[0]<6){ d[0]++; dMod=true; d.sort((x,y)=>y-x); }
  return {a,d,aMod,dMod,capD};
}
function resolveBattle(s,pid,from,to,nd,d,id){
  const gA=genAt(s,from); let a=rollG(nd,!!gA); let luck=false;
  if (s.luck===pid){ const lo=a.length-1, nv=gA?dieW():1+rint(6); if(nv>a[lo]) a[lo]=nv; a.sort((x,y)=>y-x); s.luck=null; luck=true; }
  const raw={a:a.slice(), d:d.slice()};
  const B={pid,from,to,nd,id,raw,luck,...battleDice(s,pid,from,to,a,d)};
  // gioco d'azzardo: prima di applicare il risultato, chi attacca decide se tenerlo o rilanciare
  if (s.gamble===pid){ s.pendingGamble=B; s.seq++; return; }
  applyBattle(s,B,1);
}
function actGamble(s,pid,reroll,idx){
  const B=s.pendingGamble; if (!B || B.pid!==pid) return 'notNow';
  // si rilanciano solo i dadi scelti (indici sui dadi dell'attaccante, in ordine dal più alto)
  const pick=Array.isArray(idx) ? [...new Set(idx.filter(i=>i>=0&&i<B.raw.a.length))] : (reroll?B.raw.a.map((_,i)=>i):[]);
  s.pendingGamble=null;
  if (!reroll || !pick.length){ applyBattle(s,{...B,id:B.id+'k'},1); return null; }
  const g=!!genAt(s,B.from); const a=B.raw.a.slice(); for(const i of pick) a[i]=g?dieW():1+rint(6); a.sort((x,y)=>y-x);
  const D=battleDice(s,pid,B.from,B.to,a,B.raw.d);
  log(s,'gambleReroll',[pid],{n:pick.length});
  applyBattle(s,{...B,...D,raw:{a:a.slice(),d:B.raw.d},id:B.id+'r',rerolled:true,nRe:pick.length},2);
  return null;
}
function applyBattle(s,B,mult){
  const {pid,from,to,nd,id,a,d}=B; const def=s.owner[to];
  let lostDice=0,dL=0; const res=[];
  for (let i=0;i<Math.min(a.length,d.length);i++){ if(a[i]>d[i]){dL++;res.push('a');} else {lostDice++;res.push('d');} }
  const conquers = s.armies[to]-dL<=0 && !genAt(s,to);
  // con il rilancio ogni dado perso costa il doppio, ma resta sempre almeno 1 truppa (2 se conquisti, per poter entrare)
  let extra=0;
  if (exOn(s,'battle') && s.bf.wire[to]===def){ extra++; delete s.bf.wire[to]; B.wire=true; }
  if (exOn(s,'seasons') && s.season && s.season.i===3 && COLD.has(from) && lostDice>0){ extra++; B.frost=true; }
  let aL=lostDice*mult+extra; aL=Math.min(aL, s.armies[from]-(conquers?2:1)); aL=Math.max(aL, Math.min(lostDice, s.armies[from]-1));
  const defBefore=s.armies[to];
  s.armies[from]-=aL; s.armies[to]-=dL; s.seq++;
  if (s.pearls && s.pearls[to] && s.pearls[to].type==='hospital') s.hospital[to]=(s.hospital[to]||0)+dL;
  if (exOn(s,'missions')) missionsOnRoll(s,pid,def,from,to,nd,B.raw.a,aL,dL,defBefore);
  const roll={id, by:pid, def, from, to, a, d, raw:B.raw, aMod:B.aMod, dMod:B.dMod, res, aL, dL, conq:false, luck:B.luck, gen:!!genAt(s,from)||!!genAt(s,to), cap:B.capD, rerolled:!!B.rerolled, wire:!!B.wire, frost:!!B.frost};
  log(s,'attack',[pid,def],{t0:to,t1:from,a:aL,b:dL});
  const gD=genAt(s,to);
  if (s.armies[to]===0 && gD){ s.armies[to]=5; delete s.generals[def]; roll.genDead=gD.name; log(s,'genDead',[def],{g:gD.name,t0:to}); if(exOn(s,'missions')) missionsGeneralDown(s,pid,def); }
  if (s.armies[to]===0){
    if (exOn(s,'missions')) missionsOnConquest(s,pid,from,to,def,isSea(from,to));
    roll.conq=true; s.conqN++; if (exOn(s,'battle')){ delete s.bf.wire[to]; delete s.bf.smoke[to]; if (TERRAIN[to]==='jungle') s.bf.tired[to]=true; }
    delete s.trench[to]; capitalFalls(s,pid,def,to); if (exOn(s,'pearls')) pearlsOnConquest(s,pid,def,to); s.owner[to]=pid; s.conquered=true; delete s.shields[to];
    const max=s.armies[from]-1;
    s.pendingMove={from,to,min:Math.max(1,Math.min(nd-lostDice,max)),max};
    log(s,'conquer',[pid],{t0:to});
    handleElimination(s,pid,def);
  }
  s.lastRoll=roll;
  if (exOn(s,'missions')) checkMissions(s,pid);
}
function actMoveIn(s,pid,n){
  const m=s.pendingMove; if(!m || !myTurn(s,pid)) return 'notNow';
  n=Math.max(m.min,Math.min(m.max,n));
  s.armies[m.from]-=n; s.armies[m.to]+=n; s.pendingMove=null; s.seq++;
  if (exOn(s,'battle')) bfAfterEntry(s,pid,m.to);
  if (s.endAfterMove){ const w=s.endAfterMove; s.endAfterMove=null; finishGame(s,w==='last'?'last':'points'); }
  return null;
}
function capHand(s,pid){ if (s.settings.mode!=='ta') return; while (s.hands[pid].length>TA_HAND_MAX) s.discard.push(s.hands[pid].shift()); }

// ---------- spostamento e fine turno ----------
function actStartFortify(s,pid){ if (!myTurn(s,pid) || s.phase!=='attack' || busy(s)) return 'notNow'; s.phase='fortify'; s.seq++; return null; }
function actFortify(s,pid,from,to,n,withGen){
  if (!myTurn(s,pid) || (s.phase!=='attack'&&s.phase!=='fortify') || busy(s)) return 'notNow';
  if (s.owner[from]!==pid || s.owner[to]!==pid || !T[from].adj.includes(to)) return 'fortifyBoth';
  if (s.armies[from]<2) return 'leaveOne';
  n=Math.max(1,Math.min(n,s.armies[from]-1));
  s.armies[from]-=n; s.armies[to]+=n;
  if (withGen && genAt(s,from)) s.generals[pid].tid=to;
  log(s,'move',[pid],{n,t0:from,t1:to});
  s.fortN++;
  if (exOn(s,'seasons') && s.season && s.season.i===1 && s.fortN<2){ s.phase='fortify'; s.seq++; return null; }   // estate: seconda manovra
  return actEndTurn(s,pid,true);
}
function drawCard(s,pid){
  if (s.deck.length===0 && s.discard.length){ s.deck=shuffle(s.discard); s.discard=[]; s.reshuffles++; log(s,'reshuffle',[],{n:s.reshuffles}); }
  if (s.deck.length===0) return;
  const c=s.deck.shift(); s.hands[pid].push(c); capHand(s,pid);
  log(s,'draw',[pid]);
  if (s.settings.mode==='ta' && s.settings.taEnd==='deck' && s.deck.length===0 && s.reshuffles>=(+s.settings.taReshuffles||2) && !s.lastRound){
    s.lastRound={ender:pid, left:alive(s).length}; log(s,'lastRound',[pid]);
  }
}
function actEndTurn(s,pid,force){
  if (!force && (!myTurn(s,pid) || (s.phase!=='attack'&&s.phase!=='fortify'))) return 'notNow';
  if (!force && busy(s)) return busy(s);
  s.pendingAttack=null;
  if (exOn(s,'missions')) missionsEndTurn(s,curPid(s));
  if (exOn(s,'pearls')) pearlsEndTurn(s,curPid(s));
  if (s.lastRound){ s.lastRound.left--; if (s.lastRound.left<=0){ s.seq++; finishGame(s,'points'); return null; } }
  if (s.conquered) drawCard(s,pid);
  if (s.conquered && exOn(s,'seasons') && s.season && s.season.i===0 && s.conqN>=2) drawCard(s,pid);
  if (s.tiebreak){ s.tiebreak.left--; if (s.tiebreak.left<=0){ s.seq++; finishGame(s,'points'); return null; } }
  const n=s.order.length; let i=s.current, wrapped=false;

    if (s.eliminated[p]) continue; if (s.tiebreak && !s.tiebreak.pids.includes(p)) continue; break; }
  if (wrapped){
    s.round++;

  }
  s.current=i; s.seq++; startTurn(s); return null;
}
function scores(s){
  return alive(s).map(p=>({pid:p, vp:ownedBy(s,p).reduce((a,t)=>a+T[t].vp,0), armies:totalArmies(s,p), terr:ownedBy(s,p).length}))
    .sort((x,y)=>y.vp-x.vp || y.armies-x.armies);
}
function finishGame(s,why,obj){
  s.pendingAttack=null;
  if (why==='objective'){ s.status='finished'; s.winner={pids:[obj.pid],why,obj:obj.id}; log(s,'winObj',[obj.pid]); return; }
  if (why==='last'){ const p=alive(s)[0]; s.status='finished'; s.winner={pids:[p],why:'last'}; log(s,'winLast',[p]); return; }
  const sc=scores(s); const top=sc.filter(x=>x.vp===sc[0].vp && x.armies===sc[0].armies);
  if (top.length>1 && !s.tiebreak){
    s.tiebreak={pids:top.map(x=>x.pid), left:top.length}; s.lastRound=null;
    log(s,'tiebreak');
    s.current=s.order.findIndex(p=>s.tiebreak.pids.includes(p)); startTurn(s); return;
  }
  s.status='finished'; s.winner={pids:top.map(x=>x.pid),why:'points',scores:sc}; log(s,'winPoints');
}
// in 2 giocatori ognuno parte già con metà dei territori: gli obiettivi a numero si alzano di 8
function need(s,n){ return s.order.length===2 ? n+8 : n; }
function objectiveMet(s,pid,objId){
  const o=OBJ[objId]; if(!o) return false;
  const mine=ownedBy(s,pid), c26=()=>mine.length>=need(s,24);
  if (o.type==='count') return mine.length>=need(s,o.n);
  if (o.type==='count2') return mine.filter(t=>s.armies[t]>=2).length>=need(s,o.n);
  if (o.type==='conts'){ const cs=contsOf(s,pid); if(!o.c.every(c=>cs.includes(c))) return false; return !o.extra || cs.some(c=>!o.c.includes(c)); }
  if (o.type==='destroy'){ const tg=s.order.find(p=>s.players[p].color===o.color);
    if (!tg || tg===pid) return c26(); if (s.eliminated[tg]) return s.eliminated[tg]===pid ? true : c26(); return false; }
  if (o.type==='globe') return mine.length>=need(s,o.n) && MAP.conts.every(c=>c.terr.some(t=>s.owner[t]===pid));
  if (o.type==='south'){ const S=TIDS.filter(t=>T[t].hemi==='S'); const k=o.k||S.length; return S.filter(t=>s.owner[t]===pid).length>=k && mine.length>=k+need(s,o.m); }
  if (o.type==='north') return mine.filter(t=>T[t].hemi==='N').length>=need(s,o.n);
  if (o.type==='pearls'){ if(!exOn(s,'pearls')) return c26(); const w=(s.pearlWins||{})[pid]||0; return w>=o.n || (mine.length>=need(s,o.alt) && w>=o.altP); }
  if (o.type==='siege') return exOn(s,'capitals') ? ((s.capTaken||{})[pid]||0)>=o.n && mine.length>=need(s,o.t||0) : c26();
  if (o.type==='hitman'){ if (Object.values(s.eliminated).includes(pid)) return true; return s.round>o.r && c26(); }

}
// fine turno forzata (timer scaduto): deterministica
function forceEnd(s){
  const pid=curPid(s);
  const weakest=()=>ownedBy(s,pid).sort((a,b)=>s.armies[a]-s.armies[b]||(a<b?-1:1))[0];
  s.pendingAttack=null;
  if (s.pendingGamble){ const B=s.pendingGamble; s.pendingGamble=null; applyBattle(s,{...B,id:B.id+'k'},1); if(s.pendingMove){ const m=s.pendingMove; s.armies[m.from]-=m.min; s.armies[m.to]+=m.min; s.pendingMove=null; } if(s.status!=='playing') return; }
  if (s.pendingPearl && s.pendingPearl.pid===pid){ const f=ownedBy(s,pid).filter(t=>!s.pearls[t]).sort((a,b)=>s.armies[b]-s.armies[a])[0]; if(f) actPlacePearl(s,pid,f); else s.pendingPearl=null; }
  if (s.pendingReward){ const w=ownedBy(s,pid).sort((a,b)=>s.armies[a]-s.armies[b])[0]; actReward(s,pid,'troops',w); }
  if (s.pendingCapital){ actCapital(s,pid,ownedBy(s,pid).sort((a,b)=>s.armies[b]-s.armies[a])[0]); s.pendingCapital=null; }
  if (s.pendingEvent){ const t=eventTargets(s,pid,s.pendingEvent.type); actEventChoose(s,pid,t[0]); s.pendingEvent=null; }
  if (s.phase==='setup'){
    while (s.placed<setupLimit(s)){ const t=weakest(); s.armies[t]++; s.placed++; s.setupLeft[pid]--; }
    log(s,'timeoutSetup',[pid]);
    s.current=(s.current+1)%s.order.length; s.seq++; beginSetupTurn(s); return;
  }
  if (s.phase==='reinforce'){ while(s.pool>0){ s.armies[weakest()]++; s.pool--; } }
  if (s.pendingMove){ const m=s.pendingMove; s.armies[m.from]-=m.min; s.armies[m.to]+=m.min; s.pendingMove=null;
    if (s.endAfterMove){ const w=s.endAfterMove; s.endAfterMove=null; s.seq++; finishGame(s,w==='last'?'last':'points'); return; } }
  log(s,'timeout',[pid]);
  actEndTurn(s,pid,true);
}

// ---------- eventi casuali ----------
function eventTargets(s,pid,type){
  const mine=ownedBy(s,pid);
  if (type==='volunteers' || type==='trench') return mine;
  if (type==='spy' || type==='market') return alive(s).filter(p=>p!==pid && s.hands[p].length>0);
  if (type==='infiltrate') return TIDS.filter(t=>s.owner[t]!==pid && s.armies[t]>=2 && touchesMine(s,pid,t));
  // kamikaze: il bersaglio deve avere almeno 5 truppe (ne restano sempre almeno 2) e un tuo territorio vicino con almeno 2
  if (type==='kamikaze') return TIDS.filter(t=>s.owner[t]!==pid && s.armies[t]>=5 && T[t].adj.some(u=>s.owner[u]===pid && s.armies[u]>=2));
  return [];
}
function eventApplies(s,pid,type){
  const mine=ownedBy(s,pid);
  switch(type){
    case 'desert': return mine.some(t=>s.armies[t]>=4);
    case 'supply': return s.deck.length+s.discard.length>0;
    case 'storm': return mine.some(t=>T[t].adj.some(u=>isSea(t,u)&&s.owner[u]!==pid));
    case 'famine': return s.pool>=3;
    case 'spy': case 'infiltrate': case 'market': return eventTargets(s,pid,type).length>0;
    case 'kamikaze': return totalArmies(s,pid)>=4 && eventTargets(s,pid,type).length>0;
    case 'luck': case 'gamble': return mine.some(t=>s.armies[t]>=2 && T[t].adj.some(u=>s.owner[u]!==pid));
    case 'truce': return truceOptions(s,pid).length>0;
    default: return true;
  }
}
function triggerEvent(s,pid){
  const ok=EVENTS.filter(e=>eventApplies(s,pid,e)); if(!ok.length) return;
  const type=ok[rint(ok.length)];
  s.lastEvent={id:s.seq+'-'+rint(1e6), pid, type};
  log(s,'event',[pid],{ev:type});
  if (type==='kamikaze'){ s.pendingEvent={pid,type,stage:'ask'}; return; }   // il giocatore decide se tirare il dado
  if (EV_CHOICE.includes(type)){ s.pendingEvent={pid,type}; return; }
  if (type==='desert'){ const t=ownedBy(s,pid).sort((a,b)=>s.armies[b]-s.armies[a])[0]; s.armies[t]-=2; log(s,'evDesert',[pid],{t0:t}); }
  if (type==='supply'){ if (s.deck.length===0 && s.discard.length){ s.deck=shuffle(s.discard); s.discard=[]; s.reshuffles++; } if(s.deck.length){ s.hands[pid].push(s.deck.shift()); capHand(s,pid); } }
  if (type==='storm') s.storm=pid;
  if (type==='famine') s.pool=Math.max(0,s.pool-2);
  if (type==='luck') s.luck=pid;
  if (type==='gamble') s.gamble=pid;
  if (type==='truce'){ const o=truceOptions(s,pid); const tid=o[rint(o.length)]; s.truce={pid,tid}; log(s,'evTruce',[pid,s.owner[tid]],{t0:tid}); }
}
function truceOptions(s,pid){ return TIDS.filter(t=>s.owner[t]!==pid && touchesMine(s,pid,t)); }
function actEventChoose(s,pid,arg){
  const pe=s.pendingEvent; if (!pe || pe.pid!==pid) return 'notNow';
  if (pe.type==='kamikaze' && pe.stage!=='target') return 'notNow';
  if (!eventTargets(s,pid,pe.type).includes(arg)) return 'badTarget';
  if (pe.type==='volunteers'){ s.armies[arg]+=3; log(s,'evVolunteers',[pid],{t0:arg}); }
  if (pe.type==='trench'){ s.trench[arg]=pid; log(s,'evTrench',[pid],{t0:arg}); }
  if (pe.type==='spy'){ s.spy={pid, target:arg, cards:s.hands[arg].slice()}; log(s,'evSpy',[pid,arg]); }
  if (pe.type==='kamikaze'){
    const from=T[arg].adj.filter(u=>s.owner[u]===pid && s.armies[u]>=2).sort((a,b)=>s.armies[b]-s.armies[a])[0];
    const def=s.owner[arg]; s.armies[from]-=1; s.armies[arg]-=3;
    s.lastFx={id:s.seq+'-'+rint(1e6), type:'kamikaze', tid:arg, by:pid, def, killed:3};
    log(s,'kamikaze',[pid,def],{t0:arg,t1:from});
  }
  if (pe.type==='market'){ const h=s.hands[arg]; const c=h.splice(rint(h.length),1)[0]; s.hands[pid].push(c); capHand(s,pid); s.marketGot={pid,card:c,from:arg}; log(s,'evMarket',[pid,arg]); }
  if (pe.type==='infiltrate'){
    const k = s.armies[arg]===2 ? 1 : 2;   // ne restano sempre almeno 1
    const dest=T[arg].adj.filter(t=>s.owner[t]===pid).sort((a,b)=>s.armies[b]-s.armies[a])[0];
    const def=s.owner[arg]; s.armies[arg]-=k; s.armies[dest]+=k;
    s.lastFx={id:s.seq+'-'+rint(1e6), type:'infiltrate', tid:arg, by:pid, def, killed:k};
    log(s,'evInfiltrate',[pid,def],{t0:arg,t1:dest,n:k});
  }
  s.pendingEvent=null; if (s.phase==='reinforce') s.undo={armies:clone(s.armies), pool:s.pool}; s.seq++; return null;
}
// ---------- generale ----------
function actGeneral(s,pid,tid,name){
  if (!exOn(s,'generals')) return 'notNow';
  if (!myTurn(s,pid) || (s.phase!=='reinforce'&&s.phase!=='attack') || busy(s)) return 'notNow';
  if (s.generals[pid]) return 'genExists';
  if (s.owner[tid]!==pid || s.armies[tid]<7) return 'gen7';
  name=String(name||'').trim().slice(0,24) || 'Generale';
  s.armies[tid]-=6; s.generals[pid]={tid,name};
  if (s.phase==='reinforce') s.undo={armies:clone(s.armies), pool:s.pool};
  log(s,'genNew',[pid],{g:name,t0:tid}); s.seq++; return null;
}

// ---------- capitale ----------
function actCapital(s,pid,tid){
  if (s.pendingCapital!==pid) return 'notNow';
  if (s.owner[tid]!==pid) return 'ownOnly';
  s.capitals[pid]=tid; s.pendingCapital=null; log(s,'capNew',[pid],{t0:tid}); s.seq++; return null;
}
function capitalFalls(s,pid,def,tid){
  if (!s.capitals || s.capitals[def]!==tid) return;
  delete s.capitals[def]; if(!s.capTaken) s.capTaken={}; s.capTaken[pid]=(s.capTaken[pid]||0)+1;
  const h=s.hands[def]; let stolen=false;
  if (h.length){ s.hands[pid].push(h.splice(rint(h.length),1)[0]); capHand(s,pid); stolen=true; }
  log(s,'capFall',[pid,def],{t0:tid,n:stolen?1:0});
}

// ---------- missioni intermedie ----------
const MREWARD={E:{troops:2,cards:0},M:{troops:4,cards:1},H:{troops:8,cards:2}};
const MLEN={E:3,M:4,H:4};
const MTPL=['target','double','blitz','bridge','landing','dlanding','empire','corridor','encircle','purge','upset','qsiege','expand','vendetta','world','noloss','david','legend','capital','general','firewall','island','fort1','fort2','front','lastman','peace','balance','attrition','sniper','golden','rebel','counter'];
const DEF_TPL=['fort1','fort2','front'];
const pickR=a=>a[rint(a.length)];
function distFrom(s,pid){ // distanza (in passi) da tutti i tuoi territori
  const d={}; let q=ownedBy(s,pid); q.forEach(t=>d[t]=0);
  while(q.length){ const nq=[]; for(const t of q) for(const u of T[t].adj) if(d[u]===undefined){ d[u]=d[t]+1; nq.push(u); } q=nq; }
  return d;
}
function borderOwn(s,pid){ return ownedBy(s,pid).filter(t=>T[t].adj.some(u=>s.owner[u]!==pid)); }
function makeMission(s,pid,tpl){
  const mine=ownedBy(s,pid), en=TIDS.filter(t=>s.owner[t]!==pid), others=alive(s).filter(p=>p!==pid);
  const seaT=en.filter(t=>T[t].adj.some(u=>s.owner[u]===pid && isSea(u,t)));
  switch(tpl){
    case 'target': { const d=distFrom(s,pid); const c=en.filter(t=>d[t]===2||d[t]===3); return c.length?{diff:'E',p:{t0:pickR(c)}}:null; }
    case 'double': { const pairs=[]; for(const a of en) if(touchesMine(s,pid,a)) for(const b of T[a].adj) if(s.owner[b]!==pid && b!==a) pairs.push([a,b]); if(!pairs.length) return null; const [a,b]=pickR(pairs); return {diff:'M',p:{t0:a,t1:b}}; }
    case 'blitz': { const n=3+rint(3); return {diff:n===3?'E':n===4?'M':'H',p:{n}}; }
    case 'bridge': { const c=MAP.conts.filter(c=>!c.terr.some(t=>s.owner[t]===pid) && c.terr.some(t=>touchesMine(s,pid,t))); return c.length?{diff:'E',p:{c:pickR(c).id}}:null; }
    case 'landing': return seaT.length?{diff:'E',p:{}}:null;
    case 'dlanding': return seaT.length>=2?{diff:'M',p:{}}:null;
    case 'empire': { const o=[]; for(const c of MAP.conts){ const ow=s.owner[c.terr[0]]; if(ow!==pid && c.terr.every(t=>s.owner[t]===ow)) o.push([ow,c.id]); } if(!o.length) return null; const [p0,c]=pickR(o); return {diff:'M',p:{p0,c}}; }
    case 'corridor': { const a=pickR(mine); const d={[a]:0}; let q=[a]; while(q.length){ const nq=[]; for(const t of q) for(const u of T[t].adj) if(d[u]===undefined){ d[u]=d[t]+1; nq.push(u);} q=nq; }
      const c=TIDS.filter(t=>(d[t]===3||d[t]===4) && s.owner[t]!==pid); return c.length?{diff:'H',p:{t0:a,t1:pickR(c)}}:null; }
    case 'encircle': { const c=en.filter(t=>T[t].adj.length>=3 && T[t].adj.length<=5 && !T[t].adj.every(u=>s.owner[u]===pid)); return c.length?{diff:'H',p:{t0:pickR(c)}}:null; }
    case 'purge': { const o=[]; for(const p of others) for(const c of MAP.conts){ if(c.terr.filter(t=>s.owner[t]===p).length>=2) o.push([p,c.id]); } if(!o.length) return null; const [p0,c]=pickR(o); return {diff:'M',p:{p0,c}}; }
    case 'upset': return others.length?{diff:'E',p:{}}:null;
    case 'qsiege': { const n=6+rint(5); return en.some(t=>s.armies[t]>=n)?{diff:'H',p:{n}}:null; }
    case 'expand': return {diff:'M',p:{n:mine.length+3}};
    case 'vendetta': { const l=s.lastLost[pid]; return (s.lostSince[pid] && l && s.owner[l]!==pid)?{diff:'E',p:{t0:l}}:null; }
    case 'world': return {diff:'H',p:{}};
    case 'noloss': case 'david': case 'lastman': case 'firewall': case 'upsetX': return {diff:'M',p:{}};
    case 'legend': { const c=TIDS.filter(t=>['Borgo Halfnone','Giampopoli'].includes(T[t].name) && s.owner[t]!==pid); return c.length?{diff:'M',p:{t0:pickR(c)}}:null; }
    case 'capital': { if(!exOn(s,'capitals')) return null; const c=others.filter(p=>s.capitals[p] && s.owner[s.capitals[p]]===p); if(!c.length) return null; const p0=pickR(c); return {diff:'H',p:{p0,t0:s.capitals[p0]}}; }
    case 'general': { if(!exOn(s,'generals')) return null; const c=others.filter(p=>s.generals[p]); if(!c.length) return null; const p0=pickR(c); return {diff:'H',p:{p0,g:s.generals[p0].name}}; }
    case 'island': { const c=TIDS.filter(t=>['Johnny Davis Island','Filippine','Isole Britanniche','Atlantico del Nord'].includes(T[t].name) && s.owner[t]!==pid); return c.length?{diff:'E',p:{t0:pickR(c)}}:null; }
    case 'fort1': { const b=borderOwn(s,pid); return b.length?{diff:'M',p:{t0:pickR(b)}}:null; }
    case 'fort2': { const b=shuffle(borderOwn(s,pid)); return b.length>=2?{diff:'H',p:{t0:b[0],t1:b[1]}}:null; }
    case 'front': { const c=MAP.conts.filter(c=>c.terr.filter(t=>s.owner[t]===pid).length>=3 && c.terr.some(t=>s.owner[t]===pid && T[t].adj.some(u=>s.owner[u]!==pid))); return c.length?{diff:'H',p:{c:pickR(c).id}}:null; }
    case 'peace': return {diff:'E',p:{}};
    case 'balance': return mine.some(t=>s.armies[t]===1)?{diff:'M',p:{}}:null;
    case 'attrition': return {diff:'M',p:{n:8+rint(5)}};
    case 'sniper': case 'golden': return {diff:'H',p:{}};
    case 'rebel': return others.length?{diff:'E',p:{}}:null;
    case 'counter': { const a=s.attackedFrom[pid]; return (a && s.owner[a.tid]!==pid && s.lostSince['_att_'+pid])?{diff:'M',p:{t0:a.tid}}:null; }
  }
  return null;
}
function drawMission(s,pid){
  const opts=[]; for(const tpl of MTPL){ const m=makeMission(s,pid,tpl); if(m) opts.push({tpl,...m}); }
  if(!opts.length) return;
  const m=pickR(opts); m.id=s.seq+'-'+rint(1e6); m.left=MLEN[m.diff]; m.prog={};
  s.missions[pid]=m; if(m.tpl==='firewall'||m.tpl==='lastman') s.defWins[pid]=0;
}
function completeMission(s,pid){
  const m=s.missions[pid]; if(!m || m.done || m.failed) return;
  m.done=true;
  log(s,'missionDone',[pid],{m:m.tpl,mp:m.p,d:m.diff});
  if (curPid(s)===pid && s.status==='playing') s.pendingReward={pid,diff:m.diff,tpl:m.tpl}; else s.rewardDue[pid]={diff:m.diff,tpl:m.tpl};
}
function missionsStartTurn(s,pid){
  const m=s.missions[pid];
  if (m && !m.done && !m.failed){
    if (DEF_TPL.includes(m.tpl)){ m.prog.n=(m.prog.n||0)+1; if(m.prog.n>=2) completeMission(s,pid); }
    if (m.tpl==='peace' && m.prog.peaceOk && !s.lostSince[pid]) completeMission(s,pid);
  }
  if (m && !m.done && !m.failed && m.left<=0) m.failed=true;
  if (s.rewardDue[pid]){ s.pendingReward={pid,...s.rewardDue[pid]}; delete s.rewardDue[pid]; }

  if (!cur || cur.done || cur.failed){ delete s.missions[pid]; drawMission(s,pid); }
  s.lostSince[pid]=false; s.lostSince['_att_'+pid]=false;
  s.ts={conq:[], sea:0, killed:0, conts:{}, attacked:false, lossOn:{}, underdog:{}, multi:{}};
  s.turnArm=clone(s.armies);

}
function missionsEndTurn(s,pid){
  if (s.pendingReward && s.pendingReward.pid===pid){ const w=ownedBy(s,pid).sort((a,b)=>s.armies[a]-s.armies[b])[0]; actReward(s,pid,'troops',w); }
  const m=s.missions[pid]; if(!m || m.done) { if(m&&m.done) delete s.missions[pid]; return; }
  if (m.tpl==='balance' && !ownedBy(s,pid).some(t=>s.armies[t]===1)) completeMission(s,pid);
  if (m.tpl==='peace' && !m.done) m.prog.peaceOk = !(s.ts&&s.ts.attacked);
  if (m.done) return;
  m.left--; if (m.left<=0 && !(m.tpl==='peace' && m.prog.peaceOk) && !(DEF_TPL.includes(m.tpl) && (m.prog.n||0)>=1)) delete s.missions[pid];
}
function missionsOnRoll(s,pid,def,from,to,nd,rawA,aL,dL,defBefore){
  if (s.ts && curPid(s)===pid){ s.ts.killed+=dL; s.ts.lossOn[to]=(s.ts.lossOn[to]||0)+aL; if(nd>1) s.ts.multi[to]=true; }
  s.lostSince['_att_'+def]=true;
  const md=s.missions[def];
  if (md && !md.done && aL>dL){ s.defWins[def]=(s.defWins[def]||0)+1; if(md.tpl==='firewall' && s.defWins[def]>=3) completeMission(s,def); }
  if (md && !md.done && md.tpl==='lastman' && defBefore===1 && aL>=1) completeMission(s,def);
  const ma=s.missions[pid];
  if (ma && !ma.done && ma.tpl==='golden' && nd===3 && rawA.filter(x=>x===6).length===3) completeMission(s,pid);
  checkMissions(s,pid);
}
function missionsGeneralDown(s,pid,def){ const m=s.missions[pid]; if(m && !m.done && m.tpl==='general' && m.p.p0===def) completeMission(s,pid); }
function missionsOnConquest(s,pid,from,to,def,sea){
  s.lostSince[def]=true; s.lastLost[def]=to;
  const md=s.missions[def];
  if (md && !md.done){ if((md.tpl==='fort1'&&md.p.t0===to)||(md.tpl==='fort2'&&(md.p.t0===to||md.p.t1===to))||(md.tpl==='front'&&T[to].cont===md.p.c)) md.failed=true; }
  const m=s.missions[pid]; const ts=s.ts;
  if (ts && curPid(s)===pid){ ts.conq.push(to); if(sea) ts.sea++; ts.conts[T[to].cont]=1; }
  if (!m || m.done) return;
  const most=(f)=>alive(s).filter(p=>p!==pid).sort((a,b)=>f(b)-f(a))[0];
  switch(m.tpl){
    case 'empire': if(def===m.p.p0 && T[to].cont===m.p.c) completeMission(s,pid); break;
    case 'upset': if(def===most(p=>ownedBy(s,p).length)) completeMission(s,pid); break;
    case 'rebel': if(def===most(p=>totalArmies(s,p))) completeMission(s,pid); break;
    case 'qsiege': if(s.turnArm && s.turnArm[to]>=m.p.n) completeMission(s,pid); break;
    case 'noloss': if(ts && (ts.lossOn[to]||0)===0 && from) completeMission(s,pid); break;
    case 'david': if(ts && ts.underdog[to]) completeMission(s,pid); break;
    case 'sniper': if(ts && from && !ts.multi[to]) completeMission(s,pid); break;
    case 'capital': if(to===m.p.t0 && def===m.p.p0) completeMission(s,pid); break;

}
function checkMissions(s,pid){
  const m=s.missions[pid]; if(!m || m.done || m.failed) return;
  const own=t=>s.owner[t]===pid, ts=s.ts||{conq:[],sea:0,killed:0,conts:{}};
  let ok=false;
  switch(m.tpl){
    case 'target': case 'legend': case 'island': case 'vendetta': case 'counter': ok=own(m.p.t0); break;
    case 'double': ok=ts.conq.includes(m.p.t0)&&ts.conq.includes(m.p.t1); break;
    case 'blitz': ok=ts.conq.length>=m.p.n; break;
    case 'bridge': ok=CONT[m.p.c].terr.some(own); break;
    case 'landing': ok=ts.sea>=1; break;
    case 'dlanding': ok=ts.sea>=2; break;
    case 'corridor': { if(!own(m.p.t0)||!own(m.p.t1)) break; const seen=new Set([m.p.t0]); let q=[m.p.t0]; while(q.length){ const nq=[]; for(const t of q) for(const u of T[t].adj) if(own(u)&&!seen.has(u)){ seen.add(u); nq.push(u);} q=nq; } ok=seen.has(m.p.t1); break; }
    case 'encircle': ok=T[m.p.t0].adj.every(own); break;
    case 'purge': ok=!CONT[m.p.c].terr.some(t=>s.owner[t]===m.p.p0); break;
    case 'expand': ok=ownedBy(s,pid).length>=m.p.n; break;
    case 'world': ok=Object.keys(ts.conts).length>=3; break;
    case 'attrition': ok=ts.killed>=m.p.n; break;
  }
  if (ok) completeMission(s,pid);
}
function actReward(s,pid,kind,tid){
  const r=s.pendingReward; if(!r || r.pid!==pid) return 'notNow';
  const R=MREWARD[r.diff];
  if (kind==='cards' && R.cards){ for(let i=0;i<R.cards;i++){ if(s.deck.length===0 && s.discard.length){ s.deck=shuffle(s.discard); s.discard=[]; s.reshuffles++; } if(s.deck.length){ s.hands[pid].push(s.deck.shift()); capHand(s,pid);} } log(s,'missionCards',[pid],{n:R.cards}); }
  else { if(s.owner[tid]!==pid) return 'ownOnly'; s.armies[tid]+=R.troops; log(s,'missionTroops',[pid],{n:R.troops,t0:tid}); }
  s.pendingReward=null; if (s.phase==='reinforce') s.undo={armies:clone(s.armies), pool:s.pool}; s.seq++;
  if (s.missions[pid] && s.missions[pid].done) delete s.missions[pid];
  return null;
}

// ---------- perle rare e scrigni ----------
const PEARLS=['barracks','mine','banner','bastion','artillery','hospital','airlift'];
function pearlsStartTurn(s,pid){
  // effetti all'inizio del turno del proprietario
  for (const [t,p] of Object.entries(s.pearls)){
    if (s.owner[t]!==pid) continue;
    if (p.type==='barracks') s.armies[t]+=1;
    if (p.type==='hospital' && s.hospital[t]){ const h=Math.floor(s.hospital[t]/2); if(h){ s.armies[t]+=h; log(s,'hospital',[pid],{n:h,t0:t}); } s.hospital[t]=0; }
  }
  s.pearlUsed={};
  if (s.huntRound!==s.round){ s.huntRound=s.round; huntNewRound(s); }
  const c=s.chest;
  // dopo la rivelazione, chi possiede il territorio lo deve difendere per un giro intero
  if (c && c.stage>=3 && s.owner[c.tid]===pid && alive(s).every(p=>p===pid || c.turns.includes(p))){
    s.chest=null; s.nextChest=s.round+2;
    if (alive(s).length===2) s.pearlWins[pid]=(s.pearlWins[pid]||0)+1;
    givePearl(s,pid,c.type,c.tid,'kept');
  }
}
// caccia al tesoro: 1° giro il continente, 2° giro tre territori possibili, 3° giro il territorio esatto
function huntNewRound(s){
  const c=s.chest;
  if (c){
    if (c.stage===1){ c.stage=2; const others=shuffle(CONT[T[c.tid].cont].terr.filter(t=>t!==c.tid)).slice(0,2); c.cands=shuffle([c.tid,...others]); log(s,'huntClue2',[],{t0:c.cands[0],t1:c.cands[1]||c.cands[0],t2:c.cands[2]||c.cands[0]}); }
    else if (c.stage===2){ c.stage=3; c.turns=[]; log(s,'huntReveal',[s.owner[c.tid]],{t0:c.tid}); }
    return;
  }
  if (s.round>=s.nextChest){
    const opts=TIDS.filter(t=>!s.pearls[t]); if(!opts.length) return;
    const tid=opts[rint(opts.length)];
    s.chest={tid, type:PEARLS[rint(PEARLS.length)], stage:1, turns:[], cands:null};
    log(s,'huntStart',[],{c:T[tid].cont});
  }
}
function pearlsEndTurn(s,pid){
  if (s.chest && s.chest.stage>=3 && !s.chest.turns.includes(pid)) s.chest.turns.push(pid);
  if (s.pendingPearl && s.pendingPearl.pid===pid){ const f=ownedBy(s,pid).filter(t=>!s.pearls[t]).sort((a,b)=>s.armies[b]-s.armies[a])[0]; if(f) actPlacePearl(s,pid,f); else s.pendingPearl=null; }
}
function givePearl(s,pid,type,tid,how){
  log(s, how==='kept'?'pearlKept':'pearlWon', [pid], {t0:tid, pr:type});
  s.pendingPearl={pid,type};
}
function pearlsOnConquest(s,pid,def,tid){
  const p=s.pearls[tid];
  if (p){ delete s.pearls[tid]; delete s.hospital[tid]; log(s,'pearlBreak',[pid,def],{t0:tid,pr:p.type}); }
  const c=s.chest;
  if (c && c.tid===tid){ s.chest=null; s.nextChest=s.round+2; s.pearlWins[pid]=(s.pearlWins[pid]||0)+1; givePearl(s,pid,c.type,tid,'won'); }
}
function actPlacePearl(s,pid,tid){
  const pp=s.pendingPearl; if (!pp || pp.pid!==pid) return 'notNow';
  if (s.owner[tid]!==pid) return 'ownOnly'; if (s.pearls[tid]) return 'hasPearl';
  s.pearls[tid]={type:pp.type, owner:pid}; s.pendingPearl=null;
  log(s,'pearlPlaced',[pid],{t0:tid,pr:pp.type}); s.seq++; return null;
}
function pearlReady(s,pid,tid,type){ const p=s.pearls[tid]; return p && p.type===type && s.owner[tid]===pid && !s.pearlUsed[tid] && myTurn(s,pid) && s.phase!=='setup' && !busy(s); }
function artilleryTargets(s,pid,src){ return T[src].adj.filter(u=>s.owner[u]!==pid && s.armies[u]>=2); }
function actArtillery(s,pid,src,tgt){
  if (!pearlReady(s,pid,src,'artillery')) return 'notNow';
  if (!artilleryTargets(s,pid,src).includes(tgt)) return 'badTarget';
  s.armies[tgt]-=1; s.pearlUsed[src]=true;
  s.lastFx={id:s.seq+'-'+rint(1e6), type:'artillery', tid:tgt, by:pid, def:s.owner[tgt], killed:1};
  log(s,'artillery',[pid,s.owner[tgt]],{t0:tgt,t1:src}); s.seq++; return null;
}
function actAirlift(s,pid,src,dst,n){
  if (!pearlReady(s,pid,src,'airlift')) return 'notNow';
  if (s.owner[dst]!==pid || dst===src) return 'badTarget';
  n=Math.max(1,Math.min(n,s.armies[src]-1)); if (s.armies[src]<2) return 'leaveOne';
  s.armies[src]-=n; s.armies[dst]+=n; s.pearlUsed[src]=true;
  if (genAt(s,src) && false) {}
  log(s,'airlift',[pid],{n,t0:src,t1:dst}); s.seq++; return null;
}

// ---------- campo di battaglia: terreni e genio militare ----------
const TERRAIN=(()=>{ const m={}; const set=(names,k)=>names.forEach(n=>{ const t=TIDS.find(x=>T[x].name===n); if(t) m[t]=k; });
  set(['Ande','Altopiano','Tibet e Gobi','Anfanghistain','Persia','Canada Occidentale','Balcani','Italia e Adriatico'],'mtn');
  set(['Amazzonia','Borgo Halfnone','Indocina','Insulindia','Papuasia','Golfo di Guinea'],'jungle');
  set(['Maghreb','Sahel','Penisola Arabica','Outback','Valle del Nilo'],'desert');
  return m; })();
const COLD=new Set(['Beringia','Canada Occidentale','Canada Orientale','Atlantico del Nord','Bulowsvej','Moscovia','Giampopoli','Estremo Oriente'].map(n=>TIDS.find(x=>T[x].name===n)));
const routeKey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function maxDice(s,from,to){ let m=Math.min(3,s.armies[from]-1); if (exOn(s,'seasons') && s.season && s.season.i===2 && isSea(from,to)) m=Math.min(m,2); return Math.max(1,m); }
function bfStartTurn(s,pid){
  const b=s.bf; b.tired={}; b.used={};
  for (const k of ['wire','smoke']) for (const t in b[k]) if (b[k][t]===pid) delete b[k][t];
  for (const r in b.sabo) if (b.sabo[r]===pid) delete b.sabo[r];
}
function bfAfterEntry(s,pid,to){
  const b=s.bf, def=b.mines[to];
  if (def && def!==pid){ const k=Math.min(3,s.armies[to]-1); s.armies[to]-=k; delete b.mines[to];
    s.lastFx={id:s.seq+'-'+rint(1e6), type:'mine', tid:to, by:def, def:pid, killed:k}; log(s,'mineBoom',[pid,def],{t0:to,n:k}); }
  if (TERRAIN[to]==='desert' && s.armies[to]>=2){ s.armies[to]-=1; log(s,'thirst',[pid],{t0:to}); }
}
function bfReady(s,pid,act){ return myTurn(s,pid) && (s.phase==='reinforce'||s.phase==='attack') && !busy(s) && !s.bf.used[act]; }
function actMine(s,pid,tid){
  if (!bfReady(s,pid,'mine')) return 'notNow';
  if (s.owner[tid]!==pid || s.armies[tid]<3) return 'need3';
  if (s.bf.mines[tid]) return 'hasMine';
  if (Object.values(s.bf.mines).filter(p=>p===pid).length>=2) return 'twoMines';
  s.armies[tid]-=2; s.bf.mines[tid]=pid; s.bf.used.mine=true; s.seq++; log(s,'mineSet',[pid]); return null;
}
function actWire(s,pid,tid){
  if (!bfReady(s,pid,'wire')) return 'notNow';
  if (s.owner[tid]!==pid || s.armies[tid]<2) return 'need2';
  s.armies[tid]-=1; s.bf.wire[tid]=pid; s.bf.used.wire=true; s.seq++; log(s,'wireSet',[pid],{t0:tid}); return null;
}
function actSmoke(s,pid,tid){
  if (!bfReady(s,pid,'smoke')) return 'notNow';
  if (s.owner[tid]!==pid || s.armies[tid]<2) return 'need2';
  s.armies[tid]-=1; s.bf.smoke[tid]=pid; s.bf.used.smoke=true; s.seq++; log(s,'smokeSet',[pid],{t0:tid}); return null;
}
function saboTargets(s,pid,from){ return T[from].adj.filter(u=>isSea(from,u) && !s.bf.sabo[routeKey(from,u)]); }
function actSabotage(s,pid,from,to){
  if (!bfReady(s,pid,'sabo')) return 'notNow';
  if (s.owner[from]!==pid || s.armies[from]<4) return 'need4';
  if (!saboTargets(s,pid,from).includes(to)) return 'badTarget';
  s.armies[from]-=3; s.bf.sabo[routeKey(from,to)]=pid; s.bf.used.sabo=true; s.seq++; log(s,'saboSet',[pid],{t0:from,t1:to}); return null;
}
// ---------- stagioni ----------
const SEASONS=['spring','summer','autumn','winter'];
function seasonsStartTurn(s,pid){
  if (!s.season){ s.season={i:0, until:s.round+2+rint(3)}; s.seasonRound=s.round; log(s,'season',[],{se:'spring'}); }
  if (s.seasonRound===s.round) return;
  s.seasonRound=s.round;
  if (s.round>=s.season.until){ s.season.i=(s.season.i+1)%4; s.season.until=s.round+2+rint(3); log(s,'season',[],{se:SEASONS[s.season.i]}); }
  // eventi rari per tutti: al massimo uno ogni 6 giri
  if (s.round-(s.lastGlobal||0)>=8 && rint(100)<15){
    s.lastGlobal=s.round;
    if (rint(2)===0){ let tot=0; for (const t of TIDS) if (s.armies[t]>15){ const k=Math.floor(s.armies[t]*0.1); s.armies[t]-=k; tot+=k; } log(s,'epidemic',[],{n:tot}); s.lastFx={id:s.seq+'-'+rint(1e6),type:'epidemic',tid:null,by:null,killed:tot}; }
    else { s.golden=s.round; log(s,'golden',[]); s.lastFx={id:s.seq+'-'+rint(1e6),type:'golden',tid:null,by:null,killed:0}; }
  }
}

function actKamikaze(s,pid,go){
  const pe=s.pendingEvent; if (!pe || pe.pid!==pid || pe.type!=='kamikaze' || pe.stage!=='ask') return 'notNow';
  if (!go){ s.pendingEvent=null; log(s,'kamiSkip',[pid]); s.seq++; return null; }
  const d=1+rint(6); log(s,'kamiRoll',[pid],{n:d});
  s.lastEvent={id:s.seq+'-'+rint(1e6), pid, type:'kamikaze', die:d};
  if (d===6 && eventTargets(s,pid,'kamikaze').length) pe.stage='target'; else s.pendingEvent=null;
  s.seq++; return null;
}

// abbandono: il giocatore resta sulla mappa come esercito passivo, i suoi turni passano da soli
function actAbandon(s,pid,auto){
  if (s.status!=='playing' || !s.order.includes(pid) || s.eliminated[pid]) return 'notNow';
  s.retired=s.retired||{}; if (s.retired[pid]) return 'notNow';
  s.retired[pid]=true; log(s,auto?'autoAbandon':'abandon',[pid]);
  const pa=s.pendingAttack;
  if (pa && pa.att===pid && pa.stage==='def') s.pendingAttack=null;
  else if (pa && pa.def===pid && pa.stage==='def') autoDefend(s);
  const active=alive(s).filter(p=>!s.retired[p]);
  if (active.length===1){ s.status='finished'; s.winner={pids:[active[0]],why:'last'}; log(s,'winLast',[active[0]]); s.seq++; return null; }
  if (curPid(s)===pid && s.status==='playing') forceEnd(s);
  s.seq++; return null;
}
function isRetired(s,pid){ return !!(s.retired&&s.retired[pid]); }

function tokenSVG(n,c,lod,gen,cap,chest,pearl,mine,wire){

    <rect x="-18" y="-11" width="12" height="8" rx="3" fill="${C}" stroke="${K}" stroke-width="1.4"/><rect x="-7" y="-9" width="12" height="3.2" rx="1.4" fill="${C}" stroke="${K}" stroke-width="1"/>
    <circle cx="11" cy="-1" r="13" fill="${C}" stroke="${K}" stroke-width="1.8"/><text x="11" y="${-1+fs*0.36}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${c.ink}" font-family="'Big Shoulders Stencil Display',Impact,sans-serif">${n}</text>`;
  if(gen) s+=`<g transform="translate(-25,-15)"><circle r="7" fill="#f4c430" stroke="${K}" stroke-width="1.4"/><path d="M0 -4.2 L1.2 -1.3 L4.2 -1.3 L1.8 0.6 L2.6 3.6 L0 1.9 L-2.6 3.6 L-1.8 0.6 L-4.2 -1.3 L-1.2 -1.3 Z" fill="${K}"/></g>`;
  if(mine) s+=`<g transform="translate(-28,12)"><circle r="6" fill="#2a2a2a" stroke="#f4c430" stroke-width="1.5"/><path d="M-8 0 H8 M0 -8 V8" stroke="#2a2a2a" stroke-width="2"/></g>`;
  if(wire) s+=`<path transform="translate(-2,16)" d="M-16 0 L16 0 M-12 -4 L-8 4 M-8 -4 L-12 4 M-2 -4 L2 4 M2 -4 L-2 4 M8 -4 L12 4 M12 -4 L8 4" stroke="#b3261e" stroke-width="1.6" fill="none"/>`;
  if(chest) s+=`<g transform="translate(30,-14)"><rect x="-7" y="-4" width="14" height="10" rx="2" fill="#8a5a22" stroke="${K}" stroke-width="1.2"/><path d="M-7 -4 Q0 -10 7 -4 Z" fill="#f4c430" stroke="${K}" stroke-width="1.2"/><rect x="-1.5" y="-2" width="3" height="4" fill="#f4c430"/></g>`;
  if(pearl) s+=`<g transform="translate(-31,-2)"><circle r="9" fill="#efe7ff" stroke="#7b4fc2" stroke-width="2.4"/><circle r="5" fill="#d9c6ff"/><circle cx="-3" cy="-3" r="2.4" fill="#fff"/></g>`;
  if(cap) s+=`<path transform="translate(11,-19)" d="M-8 3 L-8 -4 L-4 -1 L0 -6 L4 -1 L8 -4 L8 3 Z" fill="#f4c430" stroke="${K}" stroke-width="1.3"/>`;

    const f=Math.min(4,Math.floor(n/10)), k=Math.min(5,n%10); const items=[...Array(f).fill('s'),...Array(k).fill('t')];
    const w=items.length*10-2; let x=-w/2;
    s+=items.map(it=>{ const g = it==='s'
      ? `<path transform="translate(${x+4},-23)" d="M0 -5 L1.5 -1.5 L5 -1.5 L2.2 0.8 L3.2 4.5 L0 2.4 L-3.2 4.5 L-2.2 0.8 L-5 -1.5 L-1.5 -1.5 Z" fill="${C}" stroke="${K}" stroke-width=".8"/>`

      x+=10; return g; }).join('');

const tokCache={};

function layoutMap(r){
  const z=r.width/vb.w, fz=r.width/fitW, rel=Math.log2(Math.max(1,z/fz));
  const playing=S && S.owner && S.status!=='lobby';
  const lod = rel>=1.3 ? 1 : 0; layoutState.lod=lod;
  const cfs=Math.max(24,14/z); const cg=$('#contlabels'); cg.style.display = rel>=2.3 ? 'none' : ''; cg.setAttribute('font-size',cfs); cg.setAttribute('stroke-width',4/z);
  const Wt=Math.min(64, 34+9*rel);                  // larghezza pedina sullo schermo, in px
  const s=Wt/(50*z);                                  // scala da unità pedina a unità mappa
  const toS=(x,y)=>({x:(x-vb.x)*z,y:(y-vb.y)*z});
  // 1. pedine con anti-sovrapposizione (spinte reciproche + richiamo verso il punto giusto)
  const items=[];
  for(const t of MAP.terr){
    const k=tokEl[t.id];
    if(!playing){ k.style.display='none'; continue; }
    const vp=viewerPid(), bf=S.bf||{}; const hid=!!(bf.smoke&&bf.smoke[t.id]&&S.owner[t.id]!==vp);
    const n=hid?'?':S.armies[t.id], c=pColor(S.owner[t.id]), gen=!!genAt(S,t.id), mn=!!(bf.mines&&bf.mines[t.id]&&bf.mines[t.id]===vp), wr=!!(bf.wire&&bf.wire[t.id]), cap=!!(S.capitals&&S.capitals[S.owner[t.id]]===t.id), ch=!!(S.chest&&S.chest.tid===t.id&&S.chest.stage>=3), pr=(S.pearls&&S.pearls[t.id])?S.pearls[t.id].type:''; const key=n+'|'+c.id+'|'+lod+'|'+gen+'|'+cap+'|'+ch+'|'+pr+'|'+mn+'|'+wr;
    if(tokCache[t.id]!==key){ k.innerHTML=tokenSVG(n,c,lod,gen,cap,ch,pr,mn,wr); tokCache[t.id]=key; }
    k.style.display='';
    const a=toS(t.lx,t.ly);
    items.push({id:t.id,ax:a.x,ay:a.y,x:a.x,y:a.y,r:Wt*(lod?0.62:0.52),vis:a.x>-80&&a.x<r.width+80&&a.y>-80&&a.y<r.height+80});
  }
  const vis=items.filter(i=>i.vis);
  for(let it=0;it<28;it++){
    for(let i=0;i<vis.length;i++) for(let j=i+1;j<vis.length;j++){
      const A=vis[i],B=vis[j]; let dx=B.x-A.x, dy=B.y-A.y; let d=Math.hypot(dx,dy); const m=A.r+B.r;
      if(d<m){ if(d<0.01){ dx=1; dy=0.3; d=1.04; } const p=(m-d)/2; A.x-=dx/d*p; A.y-=dy/d*p; B.x+=dx/d*p; B.y+=dy/d*p; }
    }
    for(const A of vis){ A.x+=(A.ax-A.x)*0.06; A.y+=(A.ay-A.y)*0.06; }
  }
  const leaders=$('#leaders'); leaders.innerHTML='';
  const rects=[];
  for(const A of items){
    const mx=vb.x+A.x/z, my=vb.y+A.y/z;
    tokEl[A.id].setAttribute('transform',`translate(${mx},${my}) scale(${s})`);
    if(A.vis && Math.hypot(A.x-A.ax,A.y-A.ay)>A.r*0.7){
      el('line',{x1:T[A.id].lx,y1:T[A.id].ly,x2:mx,y2:my,stroke:'var(--ink)','stroke-width':1.2,'vector-effect':'non-scaling-stroke',opacity:.55},leaders);
      el('circle',{cx:T[A.id].lx,cy:T[A.id].ly,r:2.2/z,fill:'var(--ink)',opacity:.6},leaders);
    }
    const hw=Wt*0.5, top=lod?Wt*0.6:Wt*0.3;
    rects.push({x1:A.x-hw,x2:A.x+hw,y1:A.y-top,y2:A.y+Wt*0.27,id:A.id});
  }
  // 2. nomi: posizionati solo dove c'è spazio, senza uscire dal territorio e senza coprire altro
  const fpx=MOBILE()?11.5:12, lh=fpx*1.15, placed=[];
  const pos=Object.fromEntries(items.map(i=>[i.id,i]));
  const order=MAP.terr.map(t=>t.id).sort((a,b)=>{ const pa=(a===ui.sel||a===ui.target)?1e9:0, pb=(b===ui.sel||b===ui.target)?1e9:0; return (pb+(tbox[b]?.w||0)*(tbox[b]?.h||0))-(pa+(tbox[a]?.w||0)*(tbox[a]?.h||0)); });
  const hit=(R)=>placed.some(P=>R.x1<P.x2&&R.x2>P.x1&&R.y1<P.y2&&R.y2>P.y1)||rects.some(P=>P.id!==R.id&&R.x1<P.x2&&R.x2>P.x1&&R.y1<P.y2&&R.y2>P.y1);
  for(const id of order){
    const L=labelEl[id]; const name=tn(id); const forced=id===ui.sel||id===ui.target;
    const tw=(tbox[id]?.w||40)*z;
    let lines=[name]; let w=textW(name,fpx);
    if(w>tw*1.15 && name.includes(' ')){ const words=name.split(' '); let best=null;
      for(let i=1;i<words.length;i++){ const l1=words.slice(0,i).join(' '), l2=words.slice(i).join(' '); const ww=Math.max(textW(l1,fpx),textW(l2,fpx)); if(!best||ww<best.w) best={w:ww,lines:[l1,l2]}; }
      if(best && best.w<w){ w=best.w; lines=best.lines; } }
    let ok=false, bx=0, by=0;
    const p=pos[id];
    if(p && p.vis && (forced || w<=tw*1.15+6)){
      const hgt=lines.length*lh; const tokTop=p.y-(lod?Wt*0.6:Wt*0.3), tokBot=p.y+Wt*0.27;
      for(const cy of [tokTop-3-hgt, tokBot+3]){

        if(R.y1<44||R.y2>r.height-4||R.x1<2||R.x2>r.width-2){ if(!forced) continue; }
        if(!forced && hit(R)) continue;
        placed.push(R); ok=true; bx=p.x; by=cy; break;
      }
    }
    if(!ok){ L.style.display='none'; continue; }
    L.style.display='';
    L.setAttribute('font-size',fpx/z); L.setAttribute('stroke-width',3.2/z);
    L.innerHTML=lines.map((ln,i)=>`<tspan x="${vb.x+bx/z}" y="${vb.y+(by+lh*(i+0.8))/z}">${esc(ln)}</tspan>`).join('');

function fit(){

function gZoom(px,py,f){

function gCommit(){ if(!gs) return; gs=null; if(vbRaf){ cancelAnimationFrame(vbRaf); vbRaf=0; } clampVB(); applyVB(); }
function setupPanZoom(){
  const ptrs=new Map(); let moved=0, downTid=null;
  svg.addEventListener('pointerdown',e=>{
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){ moved=0; downTid=e.target.closest?.('[data-tid]')?.dataset.tid||null; } else moved=99;
  });
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId)){ if(e.pointerType==='mouse') hoverTip(e); return; }
    const r=sr();
    if(ptrs.size===1){
      const p=ptrs.get(e.pointerId), dx=e.clientX-p.x, dy=e.clientY-p.y; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
      moved+=Math.abs(dx)+Math.abs(dy); if(moved>7){ svg.classList.add('dragging'); gPan(dx,dy); }
    } else if(ptrs.size===2){
      const [a0,b0]=[...ptrs.values()]; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); const [a1,b1]=[...ptrs.values()];
      const m0={x:(a0.x+b0.x)/2-r.left,y:(a0.y+b0.y)/2-r.top}, m1={x:(a1.x+b1.x)/2-r.left,y:(a1.y+b1.y)/2-r.top};
      const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1, d1=Math.hypot(a1.x-b1.x,a1.y-b1.y)||1;
      gPan(m1.x-m0.x,m1.y-m0.y); gZoom(m1.x,m1.y,d1/d0);
    }

  const up=e=>{
    if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
    if(ptrs.size===0){ svg.classList.remove('dragging'); gCommit(); if(moved<=7 && downTid) onTerr(downTid); downTid=null; }
  };
  svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
  svg.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') $('#tip').hidden=true; });
  svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=sr(); gZoom(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0018)); clearTimeout(commitTimer); commitTimer=setTimeout(gCommit,140); },{passive:false});

  $('#zout').onclick=()=>{const r=sr(); gZoom(r.width/2,r.height/2,1/1.6); gCommit();};
  $('#zfit').onclick=fit;
  let lastW=0,lastH=0;

}

function act(fn,...args){

  if(!canAct()) return false;
  const e=fn(S,actor(),...args);
  if(e){ err(e); return false; }
  if(mode==='online' && S.missed && S.missed[me.id]) S.missed[me.id]=0;   // ha giocato: i turni saltati ripartono da zero

}
function checkWin(){
  if(!S || S.status!=='playing' || S.phase==='setup' || S.pendingMove || S.pendingAttack) return;
  const pid=curPid(S); if(mode==='online' && pid!==me.id) return;
  const obj = mode==='local' ? S.localObj?.[pid] : myObj;
  if(obj && objectiveMet(S,pid,obj)){ S.seq++; finishGame(S,'objective',{pid,id:obj}); }
}

async function queueWrite(){

function actorOrMe(){ return mode==='local' ? curPid(S) : me.id; }
function saveExit(){
  if(S && S.status==='playing' && inGame()){ if(pauseGame()) commit(); }
  toast(t('toast.saved')); leaveGame();
}
function onTerr(tid){
  if(!S || S.status!=='playing') return;
  if(S.paused){ toast(t('toast.isPaused')); return; }
  if(!canAct()) return;
  const pid=actor();
  if(S.pendingAttack) return;
  if(ui.bfAct){ const a=ui.bfAct; const tg=targetsFor(); if(!tg.includes(tid)) return toast(t('toast.badTarget'));
    if(a.type==='sabo' && !a.src){ ui.bfAct={type:'sabo',src:tid}; render(); return; }
    ui.bfAct=null; if(a.type==='mine') act(actMine,tid); else if(a.type==='wire') act(actWire,tid); else if(a.type==='smoke') act(actSmoke,tid); else act(actSabotage,a.src,tid); return; }
  if(ui.rewardPick && S.pendingReward && S.pendingReward.pid===pid){ if(S.owner[tid]!==pid) return err('ownOnly'); ui.rewardPick=false; act(actReward,'troops',tid); return; }
  if(S.pendingCapital===pid){ if(S.owner[tid]!==pid) return err('ownOnly'); act(actCapital,tid); return; }
  const pe=S.pendingEvent;
  if(pe && pe.pid===pid){ if(['volunteers','trench','infiltrate'].includes(pe.type) || (pe.type==='kamikaze'&&pe.stage==='target')){ if(!eventTargets(S,pid,pe.type).includes(tid)) return toast(t('toast.badTarget')); act(actEventChoose,tid); } return; }
  if(S.pendingPearl && S.pendingPearl.pid===pid){ act(actPlacePearl,tid); return; }
  if(ui.pearlAct){ const pa=ui.pearlAct;
    if(pa.type==='artillery'){ if(!artilleryTargets(S,pid,pa.src).includes(tid)) return toast(t('toast.badTarget')); ui.pearlAct=null; act(actArtillery,pa.src,tid); return; }
    if(S.owner[tid]!==pid || tid===pa.src) return toast(t('toast.badTarget')); ui.pearlAct=null; askAirlift(pa.src,tid); return; }
  if(ui.genPick){ if(S.owner[tid]!==pid || S.armies[tid]<7) return err('gen7'); askGeneralName(tid); return; }
  if(ui.power){
    if(!powerTargets(S,pid,ui.power).includes(tid)) return toast(t('toast.badTarget'));
    const k=ui.power;
    if(k==='nuke'){ confirmBox(t('nuke.q',{t0:tn(tid)}),t('nuke.ok'),()=>{ ui.power=null; act(actPower,k,tid); }); return; }
    ui.power=null; act(actPower,k,tid); return;
  }
  if(S.phase==='setup'||S.phase==='reinforce'){
    if(S.owner[tid]!==pid) return err('ownOnly');
    const left=S.phase==='setup'? setupLimit(S)-S.placed : S.pool;
    act(actPlace,tid, ui.step==='all'? left : ui.step); return;
  }
  if(S.pendingMove) return;
  if(S.phase==='attack'){
    if(S.owner[tid]===pid){
      if(ui.sel===tid){ ui.sel=null; ui.target=null; }
      else if(S.armies[tid]<2){ toast(t('toast.need2')); return; }
      else { ui.sel=tid; ui.target=null; }
    } else if(ui.sel){
      const b=attackBlock(S,pid,ui.sel,tid); if(b){ err(b); return; }
      ui.target=tid; ui.dice=Math.min(3,S.armies[ui.sel]-1);
    } else { toast(t('toast.pickFirst')); return; }
    render(); return;
  }
  if(S.phase==='fortify'){
    if(S.owner[tid]!==pid) return toast(t('toast.ownMove'));
    if(ui.sel===tid){ ui.sel=null; ui.target=null; }
    else if(ui.sel && T[ui.sel].adj.includes(tid)){ ui.target=tid; ui.moveN=S.armies[ui.sel]-1; }
    else if(S.armies[tid]>=2){ ui.sel=tid; ui.target=null; }
    else { toast(t('toast.pick2')); return; }
    render();
  }
}
function afterBattle(){
  if(!ui.sel || S.pendingMove) return;
  if(S.armies[ui.sel]<2){ ui.sel=null; ui.target=null; }
  else if(ui.target && S.owner[ui.target]===actor()) ui.target=null;
  else ui.dice=Math.min(ui.dice,S.armies[ui.sel]-1);
}
function doDeclare(){ if(!ui.sel||!ui.target) return; if(act(actDeclare,ui.sel,ui.target,ui.dice)){ afterBattle(); render(); } }

// ---------------- rendering partita ----------------
function render(){
  if(!S){ renderMap(); for(const id of ['objDock','cardDock','battle']) $('#'+id).hidden=true; return; }
  if(S.status==='lobby'){ renderLobby(); renderMap(); return; }
  $('#screen').hidden=true; $('#shell').classList.remove('menu'); screenFn=null;
  if(mode==='online'){ refreshNames(S.order); if(S.status==='playing' && inGame() && !myObj) loadObjective(); if(inGame()) initChat(); }
  if(ui.sel && !S.pendingAttack && (!canAct() || S.owner[ui.sel]!==actor())){ ui.sel=null; ui.target=null; }
  if(ui.power && !canAct()) ui.power=null; if(ui.bfAct && !canAct()) ui.bfAct=null; if(ui.pearlAct && (!canAct()||!pearlReady(S,actor(),ui.pearlAct.src,ui.pearlAct.type))) ui.pearlAct=null; if(ui.rewardPick && !(S.pendingReward && S.pendingReward.pid===actor())) ui.rewardPick=false; if(ui.genPick && (!canAct()||S.pendingEvent)) ui.genPick=false;
  handleEffects();
  renderTop(); renderAction(); renderBattle(); renderDocks(); renderPanes(); renderMap(); renderModals();
}
function langSelect(id){ return `<select class="langsel" id="${id}" aria-label="Lingua / Language">${LANGS.map(l=>`<option value="${l}" ${l===LANG?'selected':''}>${l.toUpperCase()}  ${esc(LANG_META[l].n)}</option>`).join('')}</select>`; }
function bindLang(id){ const s=document.getElementById(id); if(s) s.onchange=()=>setLang(s.value); }
function renderTop(){
  const cp=curPid(S), c=pColor(cp);
  let timer='';
  if(S.status==='playing' && S.turnDeadline && !S.paused){ const ms=S.turnDeadline-Date.now(); timer=`<span class="timer ${ms<15000?'warn':''}" id="tmr">${fmtTime(ms)}</span>`; }
  let extra='';
  if(S.settings.mode==='ta'){
    if(S.settings.taEnd==='time'){ const ms=S.startedAt+S.settings.taMinutes*60000-Date.now(); extra=`<span class="chip">Time Attack <span class="timer" id="gtmr">${fmtTime(ms)}</span></span>`; }
    else extra=`<span class="chip">${S.deck.length} / ${S.reshuffles}·${S.settings.taReshuffles}</span>`;
  }
  const m=MOBILE(), canPause=inGame() && S.status==='playing';
  $('#topbar').innerHTML=`
    <div class="row" style="gap:6px;align-items:flex-start">
      ${m?'':`<span class="chip"><span class="stencil" style="font-size:20px">Borgo Fight</span><span style="color:var(--muted)">${esc(t('top.round',{r:S.round}))}</span></span>`}
      ${S.status==='playing'?`<span class="chip"><span class="dot" style="background:${c.hex}"></span>${pTag(cp)}<span style="color:var(--muted)">${esc(phaseName(S.phase))}${m?', '+esc(t('top.round',{r:S.round})):''}</span>${timer}</span>`:''}
      ${m?'':extra}
      ${exOn(S,'seasons')&&S.season?`<button class="chip seasonchip" id="bSeason" title="${esc(t('sed.'+SEASONS[S.season.i],{list:coldList()}))}">${SE_ICON[S.season.i]} ${m?'':esc(t('se.'+SEASONS[S.season.i]))}</button>`:''}
    </div>
    <div class="tb-btns">${langSelect('langTop')}
      ${m?`<button class="iconbtn" id="bMenu">Menu</button>`:`${canPause&&!S.paused?`<button class="iconbtn" id="bPause">${esc(t('b.pause'))}</button>`:''}<button class="iconbtn" id="bRules">${esc(t('b.rules'))}</button><button class="iconbtn" id="bSave">${esc(t(canPause?'b.saveExit':'b.exit'))}</button>${mode==='online'&&inGame()&&S.status==='playing'&&!S.eliminated[me.id]&&!isRetired(S,me.id)?`<button class="iconbtn" id="bQuit">${esc(t('b.abandon'))}</button>`:''}`}
    </div>`;
  bindLang('langTop');
  const on=(id,f)=>{ const e=document.getElementById(id); if(e) e.onclick=f; };
  on('bRules',showRules); on('bQuit',askQuit); on('bSeason',()=>{ const i=S.season.i; toast(t('season.now',{se:t('se.'+SEASONS[i])})+'. '+t('sed.'+SEASONS[i],{list:coldList()})); }); on('bSave',()=>canPause?saveExit():leaveGame());
  on('bPause',()=>{ if(pauseGame()){ commit(); toast(t('toast.paused')); } });
  on('bMenu',()=>{ modal(`<div class="col">${canPause&&!S.paused?`<button class="btn" id="mmPause">${esc(t('b.pause'))}</button>`:''}<button class="btn" id="mmRules">${esc(t('b.rules'))}</button>
      ${mode==='online'&&inGame()&&S.status==='playing'&&!S.eliminated[me.id]&&!isRetired(S,me.id)?`<button class="btn danger" id="mmQuit">${esc(t('b.abandon'))}</button>`:''}<button class="btn primary" id="mmSave">${esc(t(canPause?'b.saveExit':'b.exit'))}</button><button class="btn" id="mmClose">${esc(t('b.close'))}</button></div>`); modalKind='menu';
    on('mmClose',closeModal); on('mmRules',()=>{ closeModal(); showRules(); }); on('mmQuit',askQuit); on('mmSave',()=>{ closeModal(); canPause?saveExit():leaveGame(); });
    on('mmPause',()=>{ closeModal(); if(pauseGame()){ commit(); toast(t('toast.paused')); } }); });
}
function renderAction(){
  const box=$('#actionBox'); const cp=curPid(S), pid=actor();
  const mine=canAct() && cp===pid;
  let a='';
  if(S.status==='finished') a=`<p><b>${esc(t('act.finished'))}</b></p><button class="btn" id="bWin">${esc(t('act.seeResult'))}</button>`;
  else if(S.paused) a=`<p><b>${esc(t('pause.title'))}</b> ${t('pause.by',{p0:pTag(S.paused.by)})}</p>${inGame()?`<button class="btn primary" id="bResume">${esc(t('pause.resume'))}</button>`:''}`;
  else if(S.pendingAttack){ const pa=S.pendingAttack; a=`<p>${t('act.pending',{p0:pTag(pa.att),t0:esc(tn(pa.to)),p1:pTag(pa.def)})} ${esc(t(pa.stage==='def'?'act.pendingDef':'act.pendingAtt'))}</p>`; }
  else if(!mine){ const spect=mode==='online' && !inGame(); a=`<p>${spect?esc(t('act.watch'))+' ':''}${t('act.wait',{p0:pTag(cp),ph:esc(phaseName(S.phase))})}</p>`; }
  else if(S.pendingReward && S.pendingReward.pid===pid && !S.pendingCapital){ const r=S.pendingReward, R=MREWARD[r.diff];
    a = ui.rewardPick ? `<p>${esc(t('act.rewardPick',{n:R.troops}))}</p><button class="btn" id="bRwBack">${esc(t('b.back'))}</button>`
      : `<p><b>${esc(t('act.reward',{m:t('mn.'+(r.tpl||'target'))}))}</b></p><div class="row"><button class="btn primary" id="bRwT">${esc(t('act.rewardTroops',{n:R.troops}))}</button>${R.cards?`<button class="btn" id="bRwC">${esc(R.cards===1?t('act.rewardCard1'):t('act.rewardCards',{n:R.cards}))}</button>`:''}</div>`; }
  else if(S.pendingPearl && S.pendingPearl.pid===pid && !S.pendingCapital && !S.pendingEvent) a=`<p><b>◉ ${esc(t('pn.'+S.pendingPearl.type))}</b>: ${esc(t('pd.'+S.pendingPearl.type))}</p><p>${esc(t('pearl.place',{pr:t('pn.'+S.pendingPearl.type)}))}</p>`;
  else if(ui.bfAct) a=`<p><b>${esc(t('bf.'+ui.bfAct.type))}</b>: ${esc(t('bfd.'+ui.bfAct.type))}</p><p>${esc(ui.bfAct.type==='sabo'&&ui.bfAct.src?t('bf.pickRoute'):t('bf.pick',{n:ui.bfAct.type==='mine'?3:ui.bfAct.type==='sabo'?4:2}))}</p><button class="btn" id="bBfCancel">${esc(t('b.cancel'))}</button>`;
  else if(ui.pearlAct) a=`<p>${esc(t(ui.pearlAct.type==='artillery'?'act.artPick':'act.airPick',{t0:tn(ui.pearlAct.src)}))}</p><button class="btn" id="bPaCancel">${esc(t('b.cancel'))}</button>`;
  else if(S.pendingCapital===pid) a=`<p><b>♛ ${esc(t('act.capTitle'))}</b></p><p>${esc(t('act.capPick'))}</p><p class="note">${esc(t('ex.capitalsDesc'))}</p>`;
  else if(S.pendingEvent && S.pendingEvent.pid===pid){ const pe=S.pendingEvent;
    a=`<p><b>${esc(t('ev.choose',{ev:t('evn.'+pe.type)}))}</b></p><p>${esc(t('evd.'+pe.type))}</p>`+(pe.type==='kamikaze'&&pe.stage==='ask'?`<p>${esc(t('kami.ask'))}</p><div class="row"><button class="btn primary" id="bKamiGo">🎲 ${esc(t('kami.roll'))}</button><button class="btn" id="bKamiNo">${esc(t('kami.skip'))}</button></div>`:'')+(pe.type==='spy'||pe.type==='market'?`<p>${esc(t(pe.type==='spy'?'ev.pickSpy':'ev.pickMarket'))}</p><div class="row">${eventTargets(S,pid,pe.type).map(p=>`<button class="btn" data-spy="${p}"><span class="dot" style="background:${pColor(p).hex}"></span> ${esc(pName(p))}</button>`).join('')}</div>`:''); }
  else if(ui.genPick) a=`<p><b>${esc(t('act.gen'))}</b>: ${esc(t('act.genPick'))}</p><button class="btn" id="bGenCancel">${esc(t('b.cancel'))}</button>`;
  else if(ui.power) a=`<p><b>${esc(t('pw.'+ui.power))}</b>: ${esc(t('act.powerPick'))}</p><p style="font-size:13px;color:var(--muted)">${esc(t('pwd.'+ui.power))}</p><button class="btn" id="bPwCancel">${esc(t('b.cancel'))}</button>`;
  else if(S.phase==='setup'){
    const left=setupLimit(S)-S.placed;
    a=`<p>${esc(t('act.setup'))}</p><div class="row"><span class="big stencil">${left}</span><span>${esc(t('act.setupLeft'))}<br><small style="color:var(--muted)">${esc(t('act.setupTotal',{n:S.setupLeft[pid]}))}</small></span></div>
      <div class="row"><button class="btn" id="bUndo" ${S.placed?'':'disabled'}>${esc(t('b.undo'))}</button><button class="btn primary" id="bPass" ${left?'disabled':''}>${esc(t('act.pass'))}</button></div>`;
  } else if(S.phase==='reinforce'){
    const r=reinforcementsFor(S,pid);
    const parts=[t('act.fromTerr',{n:r.base})]; r.conts.forEach(c=>parts.push(t('act.fromCont',{n:CONT[c].bonus,c:cname(c)}))); if(r.pearl) parts.push(t('act.fromPearl',{n:r.pearl})); if(r.extra) parts.push(t('act.fromRule')); if(S.traded) parts.push(t('act.fromTrade'));
    a=`<p>${esc(t('act.reinf'))}</p><div class="row"><span class="big stencil">${S.pool}</span><span>${esc(t('act.toPlace'))}<br><small style="color:var(--muted)">${esc(parts.join(', '))}</small></span></div>
      <div class="row"><span>${esc(t('act.perTap'))}</span><div class="seg">${[1,5,'all'].map(v=>`<button data-step="${v}" aria-pressed="${ui.step==v}">${v==='all'?esc(t('act.all')):v}</button>`).join('')}</div></div>
      <div class="row"><button class="btn" id="bUndo">${esc(t('b.undo'))}</button><button class="btn primary" id="bToAtk" ${S.pool?'disabled':''}>${esc(t('act.toAttack'))}</button></div>${genBtn(pid)}${pearlBtns(pid)}${bfBtns(pid)}`;
  } else if(S.phase==='attack'){
    let mid=`<p>${esc(t('act.attackHint'))}</p>`;
    if(ui.sel && !ui.target) mid=`<p>${esc(t('act.fromSel',{t0:tn(ui.sel),n:S.armies[ui.sel]}))}</p>`;
    if(ui.sel && ui.target){
      const maxd=maxDice(S,ui.sel,ui.target); const manual=S.settings.defense!=='auto' && !S.autoDef[S.owner[ui.target]];
      mid=`<p>${t('act.vs',{t0:'<b>'+esc(tn(ui.sel))+'</b>',a:S.armies[ui.sel],t1:'<b>'+esc(tn(ui.target))+'</b>',b:S.armies[ui.target],p0:pTag(S.owner[ui.target])})}</p>
        <div class="row"><span>${esc(t('act.dice'))}</span><div class="seg">${[1,2,3].map(v=>`<button data-dice="${v}" aria-pressed="${ui.dice===v}" ${v>maxd?'disabled':''}>${v}</button>`).join('')}</div></div>
        <button class="btn primary" id="bDecl">${esc(t(manual?'act.declare':'act.roll'))}</button>`;
    }
    a=`${mid}${S.charge===pid?`<p style="font-size:13px"><b>${esc(t('act.chargeOn'))}</b></p>`:''}
      <div class="row"><button class="btn" id="bFort">${esc(t('act.fortify'))}</button><button class="btn" id="bEnd">${esc(t('act.endTurn'))}</button></div>${genBtn(pid)}${pearlBtns(pid)}${bfBtns(pid)}
      ${S.conquered?`<p style="font-size:13px;color:var(--muted)">${esc(t('act.drawNote'))}</p>`:''}`;
  } else if(S.phase==='fortify'){
    let mid=`<p>${esc(t('act.fortHint'))}</p>`;
    if(ui.sel && ui.target){
      const max=S.armies[ui.sel]-1; ui.moveN=Math.max(1,Math.min(ui.moveN,max));
      mid=`<p id="mvTxt">${esc(t('act.fortMove',{t0:tn(ui.sel),t1:tn(ui.target),n:ui.moveN}))}</p><input type="range" id="mvR" min="1" max="${max}" value="${ui.moveN}">${genAt(S,ui.sel)?`<label class="row" style="font-size:14px"><input type="checkbox" id="mvGen" ${ui.moveGen?'checked':''}> ★ ${esc(t('act.genMove',{g:genAt(S,ui.sel).name}))}</label>`:''}<button class="btn primary" id="bMove">${esc(t('act.fortGo'))}</button>`;
    } else if(ui.sel) mid=`<p>${esc(t('act.fortFrom',{t0:tn(ui.sel)}))}</p>`;
    a=`${mid}<button class="btn" id="bEnd">${esc(t('act.fortSkip'))}</button>`;
  }
  box.className='action'; box.innerHTML=a;
  const on=(id,f)=>{const e=box.querySelector('#'+id); if(e) e.onclick=f;};
  on('bUndo',()=>act(actUndo)); on('bPass',()=>act(actEndSetup)); on('bToAtk',()=>act(actEndReinforce));
  on('bDecl',doDeclare); on('bWin',()=>{ modalKind=null; renderModals(); }); on('bResume',resumeGame);
  on('bPwCancel',()=>{ ui.power=null; render(); });
  on('bFort',()=>{ ui.sel=null; ui.target=null; act(actStartFortify); });
  on('bEnd',()=>{ ui.sel=null; ui.target=null; act(actEndTurn); });
  on('bMove',()=>{ const s=ui.sel,tt=ui.target, wg=!!box.querySelector('#mvGen')?.checked; ui.sel=null; ui.target=null; ui.moveGen=false; act(actFortify,s,tt,ui.moveN,wg); });
  on('bKamiGo',()=>act(actKamikaze,true)); on('bKamiNo',()=>act(actKamikaze,false));
  on('bBfCancel',()=>{ ui.bfAct=null; render(); });
  box.querySelectorAll('[data-bf]').forEach(b=>b.onclick=()=>{ ui.bfAct={type:b.dataset.bf}; ui.sel=null; ui.target=null; render(); });
  on('bPaCancel',()=>{ ui.pearlAct=null; render(); });
  box.querySelectorAll('[data-pa]').forEach(b=>b.onclick=()=>{ const [type,src]=b.dataset.pa.split('|'); ui.pearlAct={type,src}; ui.sel=null; ui.target=null; render(); });
  on('bRwT',()=>{ ui.rewardPick=true; render(); }); on('bRwBack',()=>{ ui.rewardPick=false; render(); }); on('bRwC',()=>act(actReward,'cards'));
  on('bGen',()=>{ ui.genPick=true; ui.sel=null; ui.target=null; render(); }); on('bGenCancel',()=>{ ui.genPick=false; render(); });
  box.querySelectorAll('[data-spy]').forEach(b=>b.onclick=()=>act(actEventChoose,b.dataset.spy));
  const mg=box.querySelector('#mvGen'); if(mg) mg.onchange=()=>{ ui.moveGen=mg.checked; };
  box.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ ui.step=b.dataset.step==='all'?'all':+b.dataset.step; render(); });
  box.querySelectorAll('[data-dice]').forEach(b=>b.onclick=()=>{ ui.dice=+b.dataset.dice; render(); });
  const r=box.querySelector('#mvR'); if(r) r.oninput=()=>{ ui.moveN=+r.value; box.querySelector('#mvTxt').textContent=t('act.fortMove',{t0:tn(ui.sel),t1:tn(ui.target),n:ui.moveN}); };
}
function bfBtns(pid){ if(!exOn(S,'battle')) return ''; const b=[];
  for(const k of ['mine','wire','smoke','sabo']) if(!S.bf.used[k]) b.push(`<button class="btn sm" data-bf="${k}" title="${esc(t('bfd.'+k))}">${esc(t('bf.'+k))}</button>`);
  return b.length?`<div class="bfbox"><b>${esc(t('bf.title'))}</b><div class="row">${b.join('')}</div></div>`:''; }
function pearlBtns(pid){ if(!exOn(S,'pearls')) return ''; const b=[];
  for(const [tid,p] of Object.entries(S.pearls||{})){ if(S.owner[tid]!==pid || S.pearlUsed?.[tid]) continue;
    if(p.type==='artillery' && artilleryTargets(S,pid,tid).length) b.push(`<button class="btn" data-pa="artillery|${tid}">◉ ${esc(t('act.art',{t0:tn(tid)}))}</button>`);
    if(p.type==='airlift' && S.armies[tid]>=2) b.push(`<button class="btn" data-pa="airlift|${tid}">◉ ${esc(t('act.air',{t0:tn(tid)}))}</button>`); }
  return b.length?`<div class="row">${b.join('')}</div>`:''; }
function askAirlift(src,dst){ const max=S.armies[src]-1; let n=max;
  modal(`<h2>◉ ${esc(t('pn.airlift'))}</h2><p>${esc(t('air.q',{t0:tn(src),t1:tn(dst)}))}</p><p class="big stencil" id="alN">${n}</p><input type="range" id="alR" min="1" max="${max}" value="${max}"><div class="row"><button class="btn primary" id="alOk">${esc(t('air.ok'))}</button><button class="btn" id="alNo">${esc(t('b.cancel'))}</button></div>`);
  modalKind='confirm'; $('#alR').oninput=()=>{ n=+$('#alR').value; $('#alN').textContent=n; };
  $('#alNo').onclick=closeModal; $('#alOk').onclick=()=>{ closeModal(); act(actAirlift,src,dst,n); }; }
function bfListHTML(){ return ['mtn','jungle','desert'].map(k=>`<b>${esc(t('ter.'+k))}</b> (${Object.entries(TERRAIN).filter(([x,v])=>v===k).map(([x])=>esc(tn(x))).join(', ')}): ${esc(t('terd.'+k))}`).concat(['mine','wire','smoke','sabo'].map(k=>`<b>${esc(t('bf.'+k))}</b>: ${esc(t('bfd.'+k))}`)).join('<br>'); }
function seasonsListHTML(){ return SEASONS.map((s,i)=>`${SE_ICON[i]} <b>${esc(t('se.'+s))}</b>: ${esc(t('sed.'+s,{list:coldList()}))}`).join('<br>'); }
function genBtn(pid){ return exOn(S,'generals') && !S.generals?.[pid] && ownedBy(S,pid).some(x=>S.armies[x]>=7) ? `<button class="btn" id="bGen">★ ${esc(t('act.gen'))}</button>` : ''; }
function askGeneralName(tid){
  modal(`<h2>★ ${esc(t('gen.title'))}</h2><p>${esc(t('gen.q',{t0:tn(tid)}))}</p><input type="text" id="genName" maxlength="24" placeholder="${esc(t('gen.ph'))}"><div class="row"><button class="btn primary" id="genOk">${esc(t('gen.ok'))}</button><button class="btn" id="genNo">${esc(t('b.cancel'))}</button></div>`);
