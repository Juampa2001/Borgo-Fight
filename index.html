<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e2638">
<meta name="description" content="Borgo Fight: conquista il mondo territorio dopo territorio, con dadi, carte e un obiettivo segreto. Gioca con gli amici sullo stesso dispositivo o online.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Borgo Fight</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Stencil+Display:wght@700;800&display=swap" rel="stylesheet">
<style>:root{
  --ocean:#cfe1ea; --ocean-deep:#b9d3e0; --grid:#a8c3d2; --land:#b8b3a6; --ink:#13202b; --muted:#536473;
  --panel:#f6f8f9; --panel-2:#e8eef1; --line:#c5d1d8; --brass:#9a6a12; --brass-bg:#f1d9a6; --danger:#b3261e;
  --shadow:0 8px 24px rgba(15,35,55,.18); --border-terr:#24323d;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink);
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ocean:#0e2638; --ocean-deep:#0a1e2d; --grid:#1b3b54; --land:#34434d; --ink:#e6edf2; --muted:#93a6b4;
  --panel:#122130; --panel-2:#1a2e3e; --line:#294358; --brass:#e7b54f; --brass-bg:#3d2f12; --danger:#ff8a80;
  --shadow:0 10px 28px rgba(0,0,0,.45); --border-terr:#0c1822;}}
:root[data-theme="dark"]{--ocean:#0e2638; --ocean-deep:#0a1e2d; --grid:#1b3b54; --land:#34434d; --ink:#e6edf2; --muted:#93a6b4;
  --panel:#122130; --panel-2:#1a2e3e; --line:#294358; --brass:#e7b54f; --brass-bg:#3d2f12; --danger:#ff8a80; --shadow:0 10px 28px rgba(0,0,0,.45); --border-terr:#0c1822;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--ocean-deep);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
input,select{font-size:16px}
.stencil{font-family:'Big Shoulders Stencil Display','Big Shoulders Display',Impact,sans-serif;letter-spacing:.01em}
#shell{height:100%;display:grid;grid-template-columns:1fr 380px}
#shell.menu{grid-template-columns:1fr}
#shell.menu #side{display:none}
#stage{position:relative;overflow:hidden;background:var(--ocean);min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
#map.dragging{cursor:grabbing}
.terr{stroke:var(--border-terr);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.terr.hot{cursor:pointer}
@media (hover:hover){.terr.hot:hover{filter:brightness(1.12)}}
.selring{fill:none;stroke:var(--brass);stroke-width:3.5;vector-effect:non-scaling-stroke;pointer-events:none}
.tgtring{fill:rgba(255,255,255,.2);stroke:#fff;stroke-width:2.2;vector-effect:non-scaling-stroke;pointer-events:none;animation:pulse 1.1s ease-in-out infinite alternate}
.shieldring{fill:none;stroke:#7fd3ff;stroke-width:2.5;stroke-dasharray:3 4;vector-effect:non-scaling-stroke;pointer-events:none}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.route{stroke:var(--ink);opacity:.85;stroke-width:2;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;fill:none}
.routehalo{stroke:var(--ocean);opacity:.9;stroke-width:5;vector-effect:non-scaling-stroke;fill:none}
.contlabel{font-family:'Big Shoulders Stencil Display','Big Shoulders Display',Impact,sans-serif;font-weight:800;letter-spacing:.12em;text-anchor:middle;fill:var(--ink);opacity:.55;paint-order:stroke;stroke:var(--ocean);stroke-linejoin:round;pointer-events:none}
.tlabel{font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--ocean);stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.tok{pointer-events:none}
#topbar{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:4}
#topbar>*{pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 11px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(0,0,0,.35);flex:none;display:inline-block}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.warn{color:var(--danger)}
.tb-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);font-size:14px;min-height:38px}
#zoombar{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:3}
#zoombar button{width:42px;height:42px;border-radius:10px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-size:20px;line-height:1}
.dock{position:absolute;bottom:10px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:calc(100% - 140px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.dock[hidden]{display:none}
#objDock{left:10px;width:300px}
#cardDock{right:10px;width:340px}
.dock .dh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;width:100%;background:none;border:0;text-align:left;font-weight:700;font-size:14px}
.dock .db{padding:0 12px 12px;display:flex;flex-direction:column;gap:9px}
.dock.closed .db{display:none}
.dock p{margin:0;line-height:1.45}
#side{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 20px;display:flex;flex-direction:column;gap:12px;min-height:0}
.action{background:var(--panel-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.action p{margin:0;line-height:1.45}
.big{font-size:30px;line-height:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 13px;font-weight:700;font-size:15px;min-height:42px}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--panel)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 13px;font-weight:700;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:disabled{opacity:.35}
.tabs{display:flex;border-bottom:1px solid var(--line);gap:4px}
.tabs button{border:0;background:none;padding:9px 10px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;min-height:40px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.badge{background:var(--danger);color:#fff;border-radius:9px;padding:1px 6px;font-size:12px}
.badge[hidden]{display:none}
.pane[hidden]{display:none}
.plist{display:flex;flex-direction:column;gap:4px}
.pl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-radius:10px}
.pl.cur{background:var(--brass-bg)}
.pl.out{opacity:.45;text-decoration:line-through}
.stats{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.conts{display:flex;flex-direction:column;gap:3px;font-size:13px}
.conts div{display:flex;justify-content:space-between;gap:8px;padding:3px 9px}
h4{margin:6px 0 4px;font-size:13px;color:var(--muted)}
.cards{display:flex;gap:6px;flex-wrap:wrap}
.card{width:62px;height:82px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 3px;font-size:10.5px;text-align:center;line-height:1.1;overflow:hidden}
.card svg{width:28px;height:28px;flex:none}
.card.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.card.own{background:var(--brass-bg)}
.card.P{border-color:#5aa9e6}
.powers{display:flex;flex-direction:column;gap:6px}
.pw{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel-2);border-radius:10px;padding:7px 9px;font-size:14px}
.log{font-size:13px;line-height:1.4;display:flex;flex-direction:column-reverse;gap:4px}
.chattabs{display:flex;gap:6px;flex-wrap:wrap;padding-top:8px}
.chattabs button{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:5px 10px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;min-height:34px}
.chattabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:260px;min-height:120px;overflow-y:auto;padding:8px 2px;-webkit-overflow-scrolling:touch}
.msg{max-width:85%;padding:7px 10px;border-radius:12px;background:var(--panel-2);font-size:14px;line-height:1.35;word-wrap:break-word}
.msg.mine{align-self:flex-end;background:var(--brass-bg)}
.msg small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.chatform{display:flex;gap:6px}
.chatform input{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
#battle{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:8;background:var(--panel);border:2px solid var(--brass);border-radius:14px;box-shadow:var(--shadow);padding:11px 13px;width:min(420px,calc(100% - 20px));display:flex;flex-direction:column;gap:9px}
#battle[hidden]{display:none}
#battle p{margin:0;line-height:1.4}
.d2{display:inline-grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:26px;height:26px;border-radius:5px;padding:3px;vertical-align:middle;margin-right:3px}
.d2 i{width:4.5px;height:4.5px;border-radius:50%;background:#fff;place-self:center}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-start;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(90deg,color-mix(in srgb,var(--ocean-deep) 92%,transparent) 0%,color-mix(in srgb,var(--ocean-deep) 70%,transparent) 55%,transparent 100%);z-index:10}
#screen[hidden]{display:none}
.menucard{max-width:560px;width:100%;display:flex;flex-direction:column;gap:18px;margin:auto 0}
.title{font-size:clamp(60px,12vw,116px);line-height:.85;margin:0;color:var(--ink)}
.lede{font-size:18px;line-height:1.5;margin:0;max-width:42ch}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.box h2{margin:0;font-size:20px}
.note{font-size:14px;color:var(--muted);line-height:1.45;margin:0}
.games{display:flex;flex-direction:column;gap:6px}
.game{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:var(--panel-2)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.sw:disabled{opacity:.25}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700}
input[type=text],select{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brass)}
#modal{position:fixed;inset:0;background:rgba(5,15,25,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border-radius:18px;max-width:580px;width:100%;max-height:86dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.mbox h2{margin:0}
.mbox p{line-height:1.5;margin:0}
.rules h3{margin:16px 0 4px;font-size:17px}
.rules p{margin:4px 0}
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none}
.toast{background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:86vw}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;box-shadow:var(--shadow);z-index:6;line-height:1.35}
#tip[hidden],#dice[hidden]{display:none}
#dice{position:absolute;z-index:6;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:190px;transition:opacity .4s}
#dice.fade{opacity:0}
.drow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.drow .who{width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.die{width:34px;height:34px;perspective:240px;transition:opacity .3s;position:relative}
.die.lost{opacity:.3}
.die b{position:absolute;right:-6px;top:-8px;background:var(--brass);color:var(--panel);border-radius:8px;font-size:10px;padding:0 4px}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:7px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:5px;background:var(--dc);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.28);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face i{width:6px;height:6px;border-radius:50%;background:#fff;place-self:center}
.f1{transform:translateZ(17px)}.f6{transform:rotateY(180deg) translateZ(17px)}.f2{transform:rotateY(90deg) translateZ(17px)}.f5{transform:rotateY(-90deg) translateZ(17px)}.f3{transform:rotateX(90deg) translateZ(17px)}.f4{transform:rotateX(-90deg) translateZ(17px)}
.dres{font-size:14px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--brass);height:32px}
.handle{display:none;width:48px;height:6px;border-radius:3px;background:var(--line);margin:-4px auto 0;border:0;padding:0;flex:none}
@media (max-width:900px){
  #shell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;height:100dvh}
  #side{border-left:0;border-top:1px solid var(--line);max-height:42dvh;padding:10px 12px 12px;gap:10px}
  #side.collapsed{max-height:none}
  #side.collapsed>:not(#bHandle):not(#actionBox){display:none}
  .handle{display:block}
  #screen{background:color-mix(in srgb,var(--ocean-deep) 88%,transparent);align-items:flex-start;padding-left:14px;padding-right:14px}
  .chip{font-size:13px;padding:6px 9px}
  .iconbtn{font-size:13px;padding:6px 10px;min-height:36px}
  #topbar{left:6px;right:6px;top:6px}
  #zoombar{top:45%}
  #zoombar button{width:38px;height:38px}
  #objDock{left:6px;bottom:6px;width:min(300px,calc(50% - 9px))}
  #cardDock{right:6px;bottom:6px;width:min(340px,calc(100% - 12px))}
  #cardDock:not(.closed){left:6px;width:auto;bottom:50px;max-height:calc(100% - 150px)}
  #objDock:not(.closed){width:calc(100% - 12px);z-index:5;bottom:50px}
  .dock .dh{padding:8px 10px;font-size:13px}
  #battle{top:52px}
  #cardDock.closed{left:auto;width:min(200px,calc(50% - 9px))}
  .msgs{max-height:30dvh}
}
@media (prefers-reduced-motion:reduce){.tgtring{animation:none}.cube{transition:none!important}}
.langsel{font:inherit;font-size:14px;font-weight:700;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:var(--shadow);min-height:38px}
.screenlang{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:11}
.col{display:flex;flex-direction:column;gap:8px}
.exitem{display:flex;flex-direction:column;gap:8px;padding:4px 0 12px;border-bottom:1px solid var(--line)}
.exitem:last-of-type{border-bottom:0}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:17px}
.exitem details summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--brass)}
.switch{position:relative;display:inline-block;width:56px;height:32px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:16px;background:#b8c2ca;transition:background .2s}
.switch span::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+span{background:#2f6fe0}
.switch input:checked+span::after{transform:translateX(24px)}
.switch input:focus-visible+span{outline:3px solid var(--brass);outline-offset:2px}
.switch input:disabled+span{opacity:.5}
.objlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.45;font-size:14px}
.tok{cursor:pointer}

#shell.menu #zoombar{display:none}
#zoombar{z-index:6}
#zoombar button{display:flex;align-items:center;justify-content:center}
.codebox{display:flex;flex-direction:column;gap:2px;background:var(--brass-bg);border-radius:12px;padding:10px 12px}
.codebox .stencil{font-size:26px;letter-spacing:.06em}
.codebox small{color:var(--muted);font-size:13px}

.trucering{fill:rgba(255,255,255,.25);stroke:#ffffff;stroke-width:2.5;stroke-dasharray:2 5;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none}

.dpick{border:2px solid transparent;background:none;padding:2px;border-radius:8px;min-height:36px}
.dpick.on{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass-bg);transform:translateY(-3px)}
/* menu più compatti, per lasciare vedere la mappa */
#screen{background:linear-gradient(90deg,color-mix(in srgb,var(--ocean-deep) 82%,transparent) 0%,color-mix(in srgb,var(--ocean-deep) 40%,transparent) 32%,transparent 48%);padding:16px}
.menucard{max-width:380px;gap:10px}
.box{padding:12px;gap:8px;border-radius:14px}
.box h2{font-size:16px}
.box .note{font-size:12.5px}
.box .btn{min-height:36px;padding:7px 11px;font-size:14px}
.game{padding:6px 8px}
.game .btn{min-height:32px;padding:5px 9px;font-size:13px}
.box input[type=text],.box select{padding:6px 8px}
label.f{font-size:13px}
.exitem p.note{font-size:12.5px}
@media (max-width:900px){
  #screen{background:linear-gradient(180deg,color-mix(in srgb,var(--ocean-deep) 30%,transparent) 0%,color-mix(in srgb,var(--ocean-deep) 85%,transparent) 45%);align-items:flex-end;padding:12px}
  .menucard{max-width:none}
}
@media (max-width:900px){ .menucard{margin:auto 0 0} }

.menucard>.title{white-space:nowrap;width:max-content;max-width:none}
.menucard>.lede{width:min(42ch,calc(100vw - 32px));max-width:none}

.menucard>.title{text-shadow:0 0 2px var(--ocean),0 0 10px var(--ocean),0 0 22px var(--ocean),0 0 40px var(--ocean-deep);letter-spacing:.02em}
.menucard>.lede{text-shadow:0 0 6px var(--ocean),0 0 14px var(--ocean)}

.missionring{fill:none;stroke:#f4c430;stroke-width:3;stroke-dasharray:8 5;vector-effect:non-scaling-stroke;pointer-events:none}
.misbox{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.misbox h4{margin:0;color:var(--ink);font-size:14px}
.tag{font-size:11px;padding:1px 6px;border-radius:8px;font-weight:700;vertical-align:middle}
.tag.E{background:#cdeccd;color:#1d5e1d}.tag.M{background:#f6e3b0;color:#6b4b00}.tag.H{background:#f6c9c4;color:#7a1d14}

.equator{stroke:var(--ink);opacity:.22;stroke-width:1.2;stroke-dasharray:2 6;vector-effect:non-scaling-stroke;pointer-events:none}
.eqlabel{font-size:14px;fill:var(--ink);opacity:.35;font-style:italic;pointer-events:none}

.huntring{fill:rgba(244,196,48,.18);stroke:#c99a0e;stroke-width:2;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;pointer-events:none}
.huntring.sure{fill:rgba(244,196,48,.3);stroke-width:3;stroke-dasharray:none}
.huntbox{display:flex;flex-direction:column;gap:3px;background:var(--brass-bg);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.35}

#map.dragging .tlabel,#map.dragging #leaders{visibility:hidden}
#map{shape-rendering:geometricPrecision}
#map.dragging{shape-rendering:optimizeSpeed}

.langsel{max-width:96px}
.pbar{height:10px;border-radius:5px;background:var(--panel-2);overflow:hidden}.pbar i{display:block;height:100%;background:var(--brass);transition:width .3s}
[dir="rtl"] #screen{background:linear-gradient(270deg,color-mix(in srgb,var(--ocean-deep) 82%,transparent) 0%,color-mix(in srgb,var(--ocean-deep) 40%,transparent) 32%,transparent 48%)}
[dir="rtl"] .screenlang{right:auto;left:12px}

.mbox{position:relative}
.mclose{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:16px;line-height:1}
[dir="rtl"] .mclose{right:auto;left:10px}
.mbox h2{padding-right:40px}
textarea{font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);resize:vertical;width:100%}
.fbbox{border-top:1px solid var(--line);padding-top:10px}

.okchip{color:#1d6b2d;font-weight:700;box-shadow:none}

.saboline{stroke:#b3261e;stroke-width:3;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;pointer-events:none}
.saboX{stroke:#b3261e;stroke-width:3.5;fill:none;vector-effect:non-scaling-stroke;pointer-events:none}
.bfbox{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.seasonchip{cursor:pointer;font:inherit}

/* paragrafi giustificati in tutte le lingue */
.mbox p,.box p,.exitem p,#actionBox p,.dockbody p,.misbox p,.huntbox span,details p,.objlist li,.rules p,.lede{text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto}

.gbtns{display:flex;gap:6px;flex-shrink:0}
.btn.danger{background:#b3261e;color:#fff;border-color:#b3261e}
/* titolo e sottotitolo: spazio sufficiente per ogni alfabeto (giapponese, arabo, scritture indiane) */
.menucard>.title{line-height:1.05;padding-bottom:.08em}
.menucard>.lede{line-height:1.6;margin-top:.35em}
:lang(ja) .menucard>.lede,:lang(zh) .menucard>.lede,:lang(ko) .menucard>.lede{line-height:1.75}

.pl small.ret{color:var(--muted);font-weight:400;font-size:.8em}

.chatmod{white-space:nowrap}
.linkbtn{background:none;border:0;padding:0 2px;color:var(--accent,#d9a441);text-decoration:underline;cursor:pointer;font:inherit;font-size:.92em}
.legal{margin:.6em 0 0;font-size:.85em;text-align:center}.legal a{color:inherit;opacity:.8}
</style>
</head>

 'rules.title':'Regole di Borgo Fight',
 'rules.body':`<h3>Scopo</h3><p>Vince chi per primo raggiunge il proprio obiettivo segreto. Ognuno vede solo il suo, in basso a sinistra.</p>
<h3>Preparazione</h3><p>L'ordine di turno è casuale. I {nt} territori vengono distribuiti a caso, con una truppa ciascuno. Truppe iniziali: 35 in 3, 30 in 4, 25 in 5, 20 in 6 giocatori. A turno ognuno schiera 3 truppe alla volta sui propri territori, finché non le ha piazzate tutte.</p>
<h3>1. Rinforzi</h3><p>Ricevi una truppa ogni 3 territori (arrotondando per difetto). Se possiedi un continente intero ricevi anche il suo bonus: {bonus}.</p><p>Una volta per turno puoi cambiare una combinazione di carte in truppe: 3 fucili 4, 3 paracadutisti 6, 3 carri 8, paracadutista carro e fucile 10, asso con due carte uguali 12. Ogni carta della combinazione che raffigura un territorio tuo vale 2 truppe in più. Tutti i rinforzi vanno piazzati prima di attaccare.</p>
<h3>2. Attacchi</h3><p>Puoi attaccare un territorio nemico confinante, via terra o lungo le rotte tratteggiate (Beringia ed Estremo Oriente sono collegati attraverso il bordo della mappa). Non puoi attaccare da un territorio con una sola truppa.</p><p>L'attaccante sceglie fino a 3 dadi e dichiara l'attacco. Il difensore sceglie fino a 3 dadi e lancia; poi lancia l'attaccante. Si confrontano il dado più alto con il più alto, il secondo con il secondo e così via: chi ha il numero minore perde una truppa, e in caso di parità vince il difensore. Se il difensore non risponde entro 30 secondi difende in automatico con il massimo dei dadi.</p><p>Quando un territorio resta vuoto lo occupi, spostandovi almeno le truppe che hanno combattuto nell'ultimo lancio. Se in un turno conquisti almeno un territorio, a fine turno peschi una carta.</p>
<h3>3. Manovra finale</h3><p>Una volta per turno puoi spostare truppe tra due tuoi territori confinanti, lasciandone almeno una. Poi il turno finisce.</p>
<h3>Eliminazione</h3><p>Chi distrugge l'ultima truppa di un avversario prende le sue carte. Nessuno può essere eliminato prima della fine del quarto giro.</p>
<h3>Blitz (opzionale)</h3><p>A tempo: allo scadere si completa il giro. A carte: quando, dopo i rimescolamenti scelti, viene pescata l'ultima carta, parte l'ultimo giro che termina con chi l'ha pescata. Dopo il primo rimescolamento, un'eliminazione chiude la partita. Senza obiettivo raggiunto vince chi ha più punti prestigio (indicati su ogni territorio), poi chi ha più truppe, poi giro supplementare. Si tengono al massimo 7 carte.</p>
<h3>Regola speciale rinforzi (opzionale)</h3><p>Ogni turno ricevi una truppa in più.</p>
<h3>Salvare e riprendere</h3><p>Le partite online restano salvate da sole: con «Salva ed esci» le metti in pausa e le riprendete dall'elenco quando volete. Le partite su questo dispositivo si salvano a ogni mossa.</p>
<h3>Note</h3><p>Si può giocare anche in 2 (variante non ufficiale, 40 truppe a testa). Con il timer, allo scadere le truppe rimaste vanno sui territori più deboli e il turno passa. Online gli obiettivi sono pescati in privato da ciascuno, quindi due giocatori possono avere lo stesso. I messaggi privati in chat sono cifrati.</p>`,
 'rules.airTitle':'Regola extra attiva: aviazione e poteri','rules.airBody':'Nel mazzo ci sono 9 carte aereo. Con combinazioni che contengono aerei ottieni un potere, che resta tuo finché non lo usi, durante i rinforzi o gli attacchi del tuo turno. Il asso può sostituire una carta. Nessuno può essere eliminato con un potere prima della fine del quarto giro.',
 cont:{na:'America del Nord',sa:'America del Sud',eu:'Europa',af:'Africa',as:'Asia',oc:'Oceania'},
};

 'rules.body':`<h3>Goal</h3><p>The first to reach their secret objective wins. Each player sees only their own, at the bottom left.</p>
<h3>Setup</h3><p>Turn order is random. The {nt} territories are dealt at random, one troop each. Starting troops: 35 with 3, 30 with 4, 25 with 5, 20 with 6 players. In turn, each player deploys 3 troops at a time on their territories until all are placed.</p>
<h3>1. Reinforcements</h3><p>You get one troop for every 3 territories (rounded down). If you hold a whole continent you also get its bonus: {bonus}.</p><p>Once per turn you can trade a combo of cards for troops: 3 rifles 4, 3 paratroopers 6, 3 tanks 8, paratroopers tanks and rifle 10, a ace with two equal cards 12. Each card showing a territory you own is worth 2 more troops. All reinforcements must be placed before attacking.</p>
<h3>2. Attacks</h3><p>You can attack a bordering enemy territory, by land or along the dashed routes (Beringia and Far East are linked across the map edge). You cannot attack from a territory with a single troop.</p><p>The attacker picks up to 3 dice and declares the attack. The defender picks up to 3 dice and rolls; then the attacker rolls. Highest die is compared with highest, second with second and so on: the lower number loses an troop, and ties go to the defender. If the defender does not answer within 30 seconds they defend automatically with the most dice.</p><p>When a territory is emptied you occupy it, moving in at least the troops that fought in the last roll. If you conquer at least one territory in a turn, you draw a card at the end of it.</p>
<h3>3. Final move</h3><p>Once per turn you can move troops between two of your bordering territories, leaving at least one. Then your turn ends.</p>
<h3>Elimination</h3><p>Whoever destroys an opponent's last troop takes their cards. No one can be eliminated before the end of round 4.</p>
<h3>Blitz (optional)</h3><p>By time: when time runs out the round is completed. By cards: when the last card is drawn after the chosen reshuffles, a final round starts and ends with whoever drew it. After the first reshuffle an elimination ends the game. If no objective is reached, the most prestige points win (shown on each territory), then the most troops, then an extra round. You may hold at most 7 cards.</p>
<h3>Special reinforcement rule (optional)</h3><p>Every turn you get one extra troop.</p>
<h3>Saving and resuming</h3><p>Online games save themselves: with "Save and exit" you pause them and resume from the list whenever you like. Games on this device save at every move.</p>
<h3>Notes</h3><p>You can also play with 2 (unofficial variant, 40 troops each). With the timer, when time runs out the remaining troops go to the weakest territories and the turn passes. Online, objectives are drawn privately by each player, so two players may share one. Private chat messages are encrypted.</p>`,

 'rules.body':`<h3>Objetivo</h3><p>Gana quien cumple primero su objetivo secreto. Cada uno ve solo el suyo, abajo a la izquierda.</p>
<h3>Preparación</h3><p>El orden de turno es aleatorio. Los {nt} territorios se reparten al azar, con una tropa cada uno. Tropas iniciales: 35 con 3, 30 con 4, 25 con 5, 20 con 6 jugadores. Por turnos, cada uno despliega 3 tropas cada vez en sus territorios hasta colocarlos todos.</p>
<h3>1. Refuerzos</h3><p>Recibes una tropa por cada 3 territorios (redondeando hacia abajo). Si posees un continente entero recibes también su bonus: {bonus}.</p><p>Una vez por turno puedes cambiar una combinación de cartas por tropas: 3 fusiles 4, 3 paracaidistas 6, 3 tanques 8, paracaidista tanque y fusil 10, as con dos cartas iguales 12. Cada carta de la combinación que muestra un territorio tuyo vale 2 tropas más. Todos los refuerzos se colocan antes de atacar.</p>
<h3>2. Ataques</h3><p>Puedes atacar un territorio enemigo vecino, por tierra o por las rutas discontinuas (Beringia y Lejano Oriente están unidos a través del borde del mapa). No puedes atacar desde un territorio con una sola tropa.</p><p>El atacante elige hasta 3 dados y declara el ataque. El defensor elige hasta 3 dados y tira; después tira el atacante. Se compara el dado más alto con el más alto, el segundo con el segundo, y así sucesivamente: el número menor pierde una tropa, y en caso de empate gana el defensor. Si el defensor no responde en 30 segundos defiende automáticamente con el máximo de dados.</p><p>Cuando un territorio queda vacío lo ocupas, moviendo al menos las tropas que combatieron en la última tirada. Si en un turno conquistas al menos un territorio, al final robas una carta.</p>
<h3>3. Maniobra final</h3><p>Una vez por turno puedes mover tropas entre dos territorios tuyos vecinos, dejando al menos uno. Después el turno termina.</p>
<h3>Eliminación</h3><p>Quien destruye el último tropa de un rival se queda con sus cartas. Nadie puede ser eliminado antes del final de la cuarta ronda.</p>
<h3>Blitz (opcional)</h3><p>Por tiempo: al acabarse se completa la ronda. Por cartas: cuando, tras las barajadas elegidas, se roba la última carta, empieza la última ronda, que termina con quien la robó. Tras la primera barajada, una eliminación termina la partida. Si nadie cumple su objetivo gana quien tenga más puntos de prestigio (indicados en cada territorio), después quien tenga más tropas, después ronda extra. Se pueden tener como máximo 7 cartas.</p>
<h3>Regla especial de refuerzos (opcional)</h3><p>Cada turno recibes una tropa más.</p>
<h3>Guardar y reanudar</h3><p>Las partidas online se guardan solas: con «Guardar y salir» las pones en pausa y las reanudáis desde la lista cuando queráis. Las partidas en este dispositivo se guardan en cada jugada.</p>
<h3>Notas</h3><p>También se puede jugar con 2 (variante no oficial, 40 tropas cada uno). Con temporizador, al acabarse el tiempo las tropas restantes van a los territorios más débiles y el turno pasa. Online cada uno roba su objetivo en privado, así que dos jugadores pueden tener el mismo. Los mensajes privados del chat están cifrados.</p>`,

 cont:{na:'América del Norte',sa:'América del Sur',eu:'Europa',af:'África',as:'Asia',oc:'Oceanía'},
};

 'rules.title':'Règles de Borgo Fight',
 'rules.body':`<h3>But</h3><p>Le premier à atteindre son objectif secret gagne. Chacun ne voit que le sien, en bas à gauche.</p>
<h3>Préparation</h3><p>L’ordre de jeu est aléatoire. Les {nt} territoires sont distribués au hasard, avec une troupe chacun. Troupes de départ : 35 à 3, 30 à 4, 25 à 5, 20 à 6 joueurs. À tour de rôle, chacun déploie 3 troupes à la fois sur ses territoires jusqu’à les avoir toutes placées.</p>
<h3>1. Renforts</h3><p>Tu reçois une troupe par tranche de 3 territoires (arrondi à l’inférieur). Si tu possèdes un continent entier tu reçois aussi son bonus : {bonus}.</p><p>Une fois par tour tu peux échanger une combinaison de cartes contre des troupes : 3 fusils 4, 3 parachutistes 6, 3 chars 8, parachutiste char et fusil 10, as avec deux cartes identiques 12. Chaque carte de la combinaison qui montre un de tes territoires vaut 2 troupes de plus. Tous les renforts se placent avant d’attaquer.</p>
<h3>2. Attaques</h3><p>Tu peux attaquer un territoire ennemi voisin, par la terre ou par les routes en pointillés (Béringie et Extrême-Orient sont reliés par le bord de la carte). Tu ne peux pas attaquer depuis un territoire n’ayant qu’une troupe.</p><p>L’attaquant choisit jusqu’à 3 dés et déclare l’attaque. Le défenseur choisit jusqu’à 3 dés et lance ; puis l’attaquant lance. On compare le dé le plus haut avec le plus haut, le deuxième avec le deuxième, etc. : le plus petit nombre perd une troupe, et l’égalité profite au défenseur. Si le défenseur ne répond pas dans les 30 secondes il se défend automatiquement avec le maximum de dés.</p><p>Quand un territoire est vidé tu l’occupes, en y déplaçant au moins les troupes qui ont combattu au dernier lancer. Si tu conquiers au moins un territoire dans ton tour, tu pioches une carte à la fin.</p>
<h3>3. Manœuvre finale</h3><p>Une fois par tour tu peux déplacer des troupes entre deux de tes territoires voisins, en laissant au moins une. Ensuite ton tour se termine.</p>
<h3>Élimination</h3><p>Celui qui détruit la dernière troupe d’un adversaire prend ses cartes. Personne ne peut être éliminé avant la fin du quatrième tour.</p>
<h3>Blitz (optionnel)</h3><p>Au temps : à la fin du temps on termine le tour. Aux cartes : quand la dernière carte est piochée après les mélanges choisis, le dernier tour commence et se termine avec celui qui l’a piochée. Après le premier mélange, une élimination met fin à la partie. Sans objectif atteint, gagne celui qui a le plus de points de prestige (indiqués sur chaque territoire), puis le plus d’troupes, puis tour supplémentaire. On garde au maximum 7 cartes.</p>
<h3>Règle spéciale des renforts (optionnelle)</h3><p>Chaque tour tu reçois une troupe de plus.</p>
<h3>Sauvegarder et reprendre</h3><p>Les parties en ligne se sauvegardent seules : avec « Sauver et quitter » tu les mets en pause et vous les reprenez depuis la liste quand vous voulez. Les parties sur cet appareil se sauvegardent à chaque coup.</p>
<h3>Notes</h3><p>On peut aussi jouer à 2 (variante non officielle, 40 troupes chacun). Avec le minuteur, à la fin du temps les troupes restantes vont sur les territoires les plus faibles et le tour passe. En ligne chacun pioche son objectif en privé, donc deux joueurs peuvent avoir le même. Les messages privés du chat sont chiffrés.</p>`,
 'rules.airTitle':'Règle extra active : aviation et pouvoirs','rules.airBody':'Le paquet contient 9 cartes avion. Les combinaisons avec des avions te donnent un pouvoir, que tu gardes jusqu’à l’utiliser pendant les renforts ou les attaques de ton tour. Le as peut remplacer une carte. Personne ne peut être éliminé par un pouvoir avant la fin du quatrième tour.',
 cont:{na:'Amérique du Nord',sa:'Amérique du Sud',eu:'Europe',af:'Afrique',as:'Asie',oc:'Océanie'},
};

 'rules.title':'Regeln von Borgo Fight',
 'rules.body':`<h3>Ziel</h3><p>Wer zuerst seinen geheimen Auftrag erfüllt, gewinnt. Jeder sieht nur seinen eigenen, unten links.</p>
<h3>Vorbereitung</h3><p>Die Zugreihenfolge ist zufällig. Die {nt} Gebiete werden zufällig verteilt, mit je einer Truppe. Starttruppen: 35 zu dritt, 30 zu viert, 25 zu fünft, 20 zu sechst. Reihum stellt jeder 3 Truppen auf einmal auf seine Gebiete, bis alle gesetzt sind.</p>
<h3>1. Verstärkung</h3><p>Du erhältst eine Truppe für je 3 Gebiete (abgerundet). Besitzt du einen ganzen Kontinent, bekommst du auch seinen Bonus: {bonus}.</p><p>Einmal pro Zug kannst du ein Kartenkombination gegen Truppen tauschen: 3 Gewehre 4, 3 Fallschirmjäger 6, 3 Panzer 8, Fallschirmjäger Panzer und Gewehr 10, Ass mit zwei gleichen Karten 12. Jede Karte der Kombination, die ein eigenes Gebiet zeigt, bringt 2 Truppen mehr. Alle Verstärkungen werden vor dem Angriff gesetzt.</p>
<h3>2. Angriffe</h3><p>Du kannst ein angrenzendes feindliches Gebiet angreifen, über Land oder entlang der gestrichelten Routen (Beringia und Fernost sind über den Kartenrand verbunden). Von einem Gebiet mit nur einer Truppe kannst du nicht angreifen.</p><p>Der Angreifer wählt bis zu 3 Würfel und sagt den Angriff an. Der Verteidiger wählt bis zu 3 Würfel und würfelt; dann würfelt der Angreifer. Verglichen wird höchster mit höchstem Würfel, zweiter mit zweitem und so weiter: die niedrigere Zahl verliert eine Truppe, bei Gleichstand gewinnt der Verteidiger. Antwortet der Verteidiger nicht innerhalb von 30 Sekunden, verteidigt das Spiel automatisch mit den meisten Würfeln.</p><p>Ist ein Gebiet leer, besetzt du es und ziehst mindestens die Truppen nach, die im letzten Wurf gekämpft haben. Eroberst du in einem Zug mindestens ein Gebiet, ziehst du am Ende eine Karte.</p>
<h3>3. Schlussmanöver</h3><p>Einmal pro Zug kannst du Truppen zwischen zwei angrenzenden eigenen Gebieten verschieben und musst mindestens eine zurücklassen. Danach endet dein Zug.</p>
<h3>Ausscheiden</h3><p>Wer die letzte Truppe eines Gegners vernichtet, bekommt dessen Karten. Vor dem Ende der vierten Runde scheidet niemand aus.</p>
<h3>Blitz (optional)</h3><p>Nach Zeit: läuft die Zeit ab, wird die Runde beendet. Nach Karten: wird nach den gewählten Mischvorgängen die letzte Karte gezogen, beginnt die letzte Runde, die mit dieser Person endet. Nach dem ersten Mischen beendet ein Ausscheiden die Partie. Ohne erfüllten Auftrag gewinnt, wer die meisten Prestigepunkte hat (auf jedem Gebiet angegeben), dann wer die meisten Truppen hat, dann eine Zusatzrunde. Man hält höchstens 7 Karten.</p>
<h3>Sonderregel Verstärkung (optional)</h3><p>Jeden Zug erhältst du eine Truppe mehr.</p>
<h3>Speichern und fortsetzen</h3><p>Online-Partien speichern sich selbst: mit „Speichern und verlassen“ pausierst du sie und setzt sie später aus der Liste fort. Partien auf diesem Gerät werden bei jedem Zug gespeichert.</p>
<h3>Hinweise</h3><p>Man kann auch zu zweit spielen (inoffizielle Variante, je 40 Truppen). Mit Timer gehen bei Zeitablauf die restlichen Truppen auf die schwächsten Gebiete und der Zug geht weiter. Online zieht jeder seinen Auftrag privat, daher können zwei denselben haben. Private Chatnachrichten sind verschlüsselt.</p>`,
 'rules.airTitle':'Aktive Zusatzregel: Luftwaffe und Fähigkeiten','rules.airBody':'Der Stapel enthält 9 Flugzeugkarten. Kombinationen mit Flugzeugen geben dir eine Fähigkeit, die du behältst, bis du sie bei Verstärkung oder Angriffen in deinem Zug nutzt. Der Ass kann eine Karte ersetzen. Vor dem Ende der vierten Runde scheidet niemand durch eine Fähigkeit aus.',
 cont:{na:'Nordamerika',sa:'Südamerika',eu:'Europa',af:'Afrika',as:'Asien',oc:'Ozeanien'},
};

 'rules.title':'Regole di Borgo Fight',
 'rules.body':`<h3>Scopo</h3><p>Ognuno riceve un obiettivo segreto: vince chi lo completa per primo. Il tuo lo vedi solo tu, in basso a sinistra.</p>
<h3>Inizio</h3><p>Ognuno sceglie il nome della propria armata. L'ordine di gioco è casuale e i {nt} territori vengono divisi a caso, con una truppa in ciascuno. Truppe iniziali: 36 in 3, 32 in 4, 27 in 5, 24 in 6 giocatori. A turno ognuno ne schiera 3 alla volta sui propri territori, finché non le ha messe tutte.</p>
<h3>1. Rinforzi</h3><p>Ogni turno ricevi una truppa ogni 3 territori che controlli (arrotondato per difetto). Se controlli un continente intero ricevi anche il suo bonus: {bonus}.</p><p>Una volta per turno puoi cambiare 3 carte in truppe: 3 fucili 5, 3 paracadutisti 6, 3 carri armati 7, uno per tipo 10, asso e due carte uguali 12. Ogni carta che mostra un tuo territorio aggiunge 2 truppe. Tutti i rinforzi vanno messi prima di attaccare.</p>
<h3>2. Attacchi</h3><p>Puoi attaccare un territorio nemico che confina con uno dei tuoi, via terra o lungo le rotte tratteggiate (Beringia ed Estremo Oriente sono collegati attraverso il bordo della mappa). Da un territorio con una sola truppa non si attacca.</p><p>Chi attacca sceglie da 1 a 3 dadi. Chi difende sceglie da 1 a 3 dadi e lancia, poi lancia chi attacca. Si mettono in ordine i dadi e si confronta il più alto con il più alto, il secondo con il secondo e così via: per ogni coppia perde una truppa chi ha il numero più basso, e se c'è parità vince chi difende. Chi difende ha 30 secondi per rispondere, poi il gioco lancia per lui con più dadi possibile.</p><p>Se un territorio resta vuoto diventa tuo: ci sposti almeno le truppe che hanno combattuto nell'ultimo lancio. Se nel turno hai preso almeno un territorio, alla fine peschi una carta.</p>
<h3>3. Manovra finale</h3><p>Una volta per turno puoi spostare truppe da un tuo territorio a uno confinante, sempre tuo, lasciandone almeno una. Poi il turno finisce.</p>
<h3>Eliminazione</h3><p>Chi toglie l'ultima truppa a un giocatore prende le sue carte. Fino alla fine del quarto giro nessuno può essere eliminato.</p>

 'home.code':'Hast du einen Code?','home.codePh':'z. B. K7Q2M','home.join':'Beitreten','toast.codeNotFound':'Keine Partie mit diesem Code.','b.zoomFit':'Ganze Karte zeigen',
 'rules.title':'Regeln von Borgo Fight',
 'rules.body':`<h3>Ziel</h3><p>Jeder Spieler erhält einen geheimen Auftrag: wer ihn zuerst erfüllt, gewinnt. Deinen siehst nur du, unten links.</p>
<h3>Start</h3><p>Jeder wählt einen Namen für seine Armee. Die Reihenfolge ist zufällig, und die {nt} Gebiete werden zufällig verteilt, mit je einer Truppe. Starttruppen: 36 zu dritt, 32 zu viert, 27 zu fünft, 24 zu sechst. Reihum setzt jeder 3 auf einmal auf seine Gebiete, bis alle gesetzt sind.</p>
<h3>1. Verstärkung</h3><p>Jeden Zug bekommst du eine Truppe für je 3 gehaltene Gebiete (abgerundet). Hältst du einen ganzen Kontinent, bekommst du auch seinen Bonus: {bonus}.</p><p>Einmal pro Zug kannst du 3 Karten gegen Truppen tauschen: 3 Gewehre 5, 3 Fallschirmjäger 6, 3 Panzer 7, je einer 10, Ass und zwei gleiche Karten 12. Jede Karte, die ein eigenes Gebiet zeigt, bringt 2 Truppen mehr. Alle Verstärkungen werden vor dem Angriff gesetzt.</p>
<h3>2. Angriffe</h3><p>Du kannst ein feindliches Gebiet angreifen, das an eines deiner grenzt, über Land oder entlang der gestrichelten Routen (Beringia und Estremo Oriente sind über den Kartenrand verbunden). Von einem Gebiet mit nur einer Truppe greift man nicht an.</p><p>Der Angreifer wählt 1 bis 3 Würfel. Der Verteidiger wählt 1 bis 3 Würfel und würfelt, dann würfelt der Angreifer. Die Würfel werden sortiert und der höchste mit dem höchsten verglichen, der zweite mit dem zweiten und so weiter: in jedem Paar verliert die niedrigere Zahl eine Truppe, bei Gleichstand gewinnt der Verteidiger. Der Verteidiger hat 30 Sekunden, danach würfelt das Spiel für ihn mit möglichst vielen Würfeln.</p><p>Wird ein Gebiet leer, gehört es dir: du ziehst mindestens die Truppen nach, die im letzten Wurf gekämpft haben. Hast du in deinem Zug mindestens ein Gebiet genommen, ziehst du am Ende eine Karte.</p>
<h3>3. Schlussmanöver</h3><p>Einmal pro Zug kannst du Truppen von einem eigenen Gebiet in ein angrenzendes eigenes verschieben und musst mindestens eine zurücklassen. Danach endet dein Zug.</p>
<h3>Ausscheiden</h3><p>Wer einem Spieler die letzte Truppe nimmt, bekommt seine Karten. Vor dem Ende der vierten Runde scheidet niemand aus.</p>
<h3>Blitz (optional)</h3><p>Nach Zeit: ist die Zeit um, wird die Runde zu Ende gespielt. Nach Karten: wird nach den gewählten Mischvorgängen die letzte Karte gezogen, folgt eine letzte Runde, die mit dieser Person endet. Nach dem ersten Mischen beendet ein Ausscheiden die Partie. Hat niemand seinen Auftrag erfüllt, gewinnt, wer die meisten Prestigepunkte hat (auf jedem Gebiet), dann wer die meisten Truppen hat, dann eine Entscheidungsrunde. Man hält höchstens 7 Karten.</p>
<h3>Aushebungsbonus (optional)</h3><p>Jeden Zug bekommst du eine Truppe mehr.</p>
<h3>Speichern und fortsetzen</h3><p>Mit „Speichern und verlassen“ wird die Partie mit angehaltenem Timer pausiert. Online setzt ihr sie aus der Liste oder mit dem Code fort, auf diesem Gerät aus der Liste der gespeicherten Partien.</p>
<h3>Hinweise</h3><p>Man kann auch zu zweit spielen (je 42 Truppen). Mit Timer gehen bei Zeitablauf die restlichen Truppen auf die schwächsten Gebiete und der Zug geht weiter. Online zieht jeder seinen Auftrag privat, daher können zwei denselben haben. Private Chatnachrichten sind verschlüsselt.</p>`,
 'rules.airTitle':'Aktive Zusatzregel: Luftwaffe','rules.airBody':'Der Stapel hat 9 Flugzeugkarten. Ein Flugzeug mit zwei normalen Karten gibt 8 Truppen und zählt als Kombination des Zuges. 3 Flugzeuge werden ein Luftangriff, 5 Flugzeuge eine Atombombe: du behältst sie, bis du sie bei Verstärkung oder Angriffen in deinem Zug einsetzt. Vor dem Ende der vierten Runde scheidet niemand durch die Bombe aus.',
 'rules.objTitle':'Aktive Zusatzaufträge',
});

Object.assign(I18N.it,{"set.ta": "Guerra lampo", "set.bonus": "Bonus (+1 truppa a turno)", "act.fromRule": "1 dal bonus", "mn.blitz": "Avanzata rapida", "rules.body": "<h3>Scopo</h3><p>Ognuno riceve un obiettivo segreto: vince chi lo completa per primo. Il tuo lo vedi solo tu, in basso a sinistra.</p>\n<h3>Inizio</h3><p>Ognuno sceglie il nome della propria armata. L'ordine di gioco è casuale e i {nt} territori vengono divisi a caso, con una truppa in ciascuno. Truppe iniziali: 36 in 3, 32 in 4, 27 in 5, 24 in 6 giocatori. A turno ognuno ne schiera 3 alla volta sui propri territori, finché non le ha messe tutte.</p>\n<h3>1. Rinforzi</h3><p>Ogni turno ricevi una truppa ogni 3 territori che controlli (arrotondato per difetto). Se controlli un continente intero ricevi anche il suo bonus: {bonus}.</p><p>Una volta per turno puoi cambiare 3 carte in truppe: 3 fucili 5, 3 paracadutisti 6, 3 carri armati 7, uno per tipo 10, asso e due carte uguali 12. Ogni carta che mostra un tuo territorio aggiunge 2 truppe. Tutti i rinforzi vanno messi prima di attaccare.</p>\n<h3>2. Attacchi</h3><p>Puoi attaccare un territorio nemico che confina con uno dei tuoi, via terra o lungo le rotte tratteggiate (Beringia ed Estremo Oriente sono collegati attraverso il bordo della mappa). Da un territorio con una sola truppa non si attacca.</p><p>Chi attacca sceglie da 1 a 3 dadi. Chi difende sceglie da 1 a 3 dadi e lancia, poi lancia chi attacca. Si mettono in ordine i dadi e si confronta il più alto con il più alto, il secondo con il secondo e così via: per ogni coppia perde una truppa chi ha il numero più basso, e se c'è parità vince chi difende. Chi difende ha 30 secondi per rispondere, poi il gioco lancia per lui con più dadi possibile.</p><p>Se un territorio resta vuoto diventa tuo: ci sposti almeno le truppe che hanno combattuto nell'ultimo lancio. Se nel turno hai preso almeno un territorio, alla fine peschi una carta.</p>\n<h3>3. Manovra finale</h3><p>Una volta per turno puoi spostare truppe da un tuo territorio a uno confinante, sempre tuo, lasciandone almeno una. Poi il turno finisce.</p>\n<h3>Eliminazione</h3><p>Chi toglie l'ultima truppa a un giocatore prende le sue carte. Fino alla fine del quarto giro nessuno può essere eliminato.</p>\n<h3>Guerra lampo (opzionale)</h3><p>A tempo: quando scade il tempo si finisce il giro. A carte: quando, dopo i rimescolamenti scelti, viene pescata l'ultima carta, si gioca un ultimo giro che finisce con chi l'ha pescata. Dopo il primo rimescolamento, un'eliminazione chiude la partita. Se nessuno ha completato l'obiettivo vince chi ha più punti prestigio (scritti su ogni territorio), poi chi ha più truppe, poi si gioca un giro di spareggio. Si possono tenere al massimo 7 carte.</p>\n<h3>Bonus (opzionale)</h3><p>Ogni turno ricevi una truppa in più.</p>\n<h3>Salvare e riprendere</h3><p>Con «Salva ed esci» la partita va in pausa con il timer fermo. Online la riprendete dall'elenco o con il codice, sul dispositivo dalla lista delle partite salvate.</p>\n<h3>Note</h3><p>Si può giocare anche in 2 (42 truppe a testa). Con il timer, se il tempo finisce le truppe rimaste vanno sui territori più deboli e il turno passa. Online gli obiettivi sono pescati in privato da ciascuno, quindi due giocatori possono avere lo stesso. I messaggi privati in chat sono cifrati.</p>"});
Object.assign(I18N.en,{"set.ta": "Lightning war", "set.bonus": "Bonus (+1 troop per turn)", "act.fromRule": "1 from the bonus", "mn.blitz": "Rapid advance", "rules.body": "<h3>Goal</h3><p>Each player gets a secret objective: the first to complete it wins. Only you see yours, at the bottom left.</p>\n<h3>Start</h3><p>Each player chooses a name for their army. Turn order is random and the {nt} territories are shared out at random, with one troop in each. Starting troops: 36 with 3, 32 with 4, 27 with 5, 24 with 6 players. In turn, each player places 3 at a time on their territories until all are placed.</p>\n<h3>1. Reinforcements</h3><p>Each turn you get one troop for every 3 territories you hold (rounded down). If you hold a whole continent you also get its bonus: {bonus}.</p><p>Once per turn you can trade 3 cards for troops: 3 rifles 5, 3 paratroopers 6, 3 tanks 7, one of each 10, ace and two equal cards 12. Each card that shows one of your territories adds 2 troops. All reinforcements must be placed before attacking.</p>\n<h3>2. Attacks</h3><p>You can attack an enemy territory that borders one of yours, by land or along the dashed routes (Beringia and Far East are linked across the map edge). You cannot attack from a territory with one troop.</p><p>The attacker picks 1 to 3 dice. The defender picks 1 to 3 dice and rolls, then the attacker rolls. Dice are sorted and the highest is compared with the highest, the second with the second and so on: in each pair the lower number loses a troop, and a tie goes to the defender. The defender has 30 seconds to answer, then the game rolls for them with as many dice as possible.</p><p>If a territory is emptied it becomes yours: you move in at least the troops that fought in the last roll. If you took at least one territory in your turn, you draw a card at the end.</p>\n<h3>3. Final move</h3><p>Once per turn you can move troops from one of your territories to a bordering one of yours, leaving at least one. Then your turn ends.</p>\n<h3>Elimination</h3><p>Whoever removes a player's last troop takes their cards. No one can be eliminated before the end of round 4.</p>\n<h3>Lightning war (optional)</h3><p>By time: when time runs out the round is finished. By cards: when the last card is drawn after the chosen reshuffles, one last round is played, ending with whoever drew it. After the first reshuffle an elimination ends the game. If no one completed their objective, the most prestige points win (written on each territory), then the most troops, then a tie-break round. You may hold at most 7 cards.</p>\n<h3>Bonus (optional)</h3><p>Every turn you get one extra troop.</p>\n<h3>Saving and resuming</h3><p>With \"Save and exit\" the game is paused with the timer stopped. Online you resume it from the list or with the code, on this device from the list of saved games.</p>\n<h3>Notes</h3><p>You can also play with 2 (42 troops each). With the timer, if time runs out the remaining troops go to the weakest territories and the turn passes. Online each player draws their objective privately, so two players may have the same one. Private chat messages are encrypted.</p>"});
Object.assign(I18N.es,{"set.ta": "Guerra relámpago", "set.bonus": "Bonus (+1 tropa por turno)", "act.fromRule": "1 del bonus", "mn.blitz": "Avance rápido", "rules.body": "<h3>Objetivo</h3><p>Cada jugador recibe un objetivo secreto: gana quien lo cumple primero. El tuyo solo lo ves tú, abajo a la izquierda.</p>\n<h3>Inicio</h3><p>Cada uno elige el nombre de su ejército. El orden de juego es aleatorio y los {nt} territorios se reparten al azar, con una tropa en cada uno. Tropas iniciales: 36 con 3, 32 con 4, 27 con 5, 24 con 6 jugadores. Por turnos, cada uno coloca 3 cada vez en sus territorios hasta colocarlas todas.</p>\n<h3>1. Refuerzos</h3><p>Cada turno recibes una tropa por cada 3 territorios que controlas (redondeando hacia abajo). Si controlas un continente entero recibes también su bonus: {bonus}.</p><p>Una vez por turno puedes cambiar 3 cartas por tropas: 3 fusiles 5, 3 paracaidistas 6, 3 tanques 7, uno de cada 10, as y dos cartas iguales 12. Cada carta que muestra un territorio tuyo añade 2 tropas. Todos los refuerzos se colocan antes de atacar.</p>\n<h3>2. Ataques</h3><p>Puedes atacar un territorio enemigo vecino de uno tuyo, por tierra o por las rutas discontinuas (Beringia y Estremo Oriente están unidos a través del borde del mapa). No se ataca desde un territorio con una sola tropa.</p><p>Quien ataca elige de 1 a 3 dados. Quien defiende elige de 1 a 3 dados y tira, luego tira quien ataca. Se ordenan los dados y se compara el más alto con el más alto, el segundo con el segundo, y así: en cada pareja pierde una tropa quien tiene el número más bajo, y el empate gana quien defiende. Quien defiende tiene 30 segundos para responder; después el juego tira por él con el máximo de dados.</p><p>Si un territorio queda vacío pasa a ser tuyo: mueves al menos las tropas que combatieron en la última tirada. Si en tu turno tomaste al menos un territorio, al final robas una carta.</p>\n<h3>3. Maniobra final</h3><p>Una vez por turno puedes mover tropas de un territorio tuyo a otro tuyo vecino, dejando al menos una. Después el turno termina.</p>\n<h3>Eliminación</h3><p>Quien quita la última tropa a un jugador se queda con sus cartas. Nadie puede ser eliminado antes del final de la cuarta ronda.</p>\n<h3>Guerra relámpago (opcional)</h3><p>Por tiempo: al acabarse el tiempo se termina la ronda. Por cartas: cuando, tras las barajadas elegidas, se roba la última carta, se juega una última ronda que termina con quien la robó. Tras la primera barajada, una eliminación termina la partida. Si nadie cumplió su objetivo, gana quien tenga más puntos de prestigio (escritos en cada territorio), luego más tropas, luego una ronda de desempate. Se pueden tener como máximo 7 cartas.</p>\n<h3>Bonus (opcional)</h3><p>Cada turno recibes una tropa más.</p>\n<h3>Guardar y reanudar</h3><p>Con «Guardar y salir» la partida queda en pausa con el temporizador parado. Online la reanudáis desde la lista o con el código; en este dispositivo, desde la lista de partidas guardadas.</p>\n<h3>Notas</h3><p>También se puede jugar con 2 (42 tropas cada uno). Con temporizador, si se acaba el tiempo las tropas restantes van a los territorios más débiles y el turno pasa. Online cada uno roba su objetivo en privado, así que dos jugadores pueden tener el mismo. Los mensajes privados del chat están cifrados.</p>"});
Object.assign(I18N.fr,{"set.ta": "Guerre éclair", "set.bonus": "Bonus (+1 troupe par tour)", "act.fromRule": "1 du bonus", "mn.blitz": "Avancée rapide", "rules.body": "<h3>But</h3><p>Chaque joueur reçoit un objectif secret : le premier à l’atteindre gagne. Toi seul vois le tien, en bas à gauche.</p>\n<h3>Début</h3><p>Chacun choisit le nom de son armée. L’ordre de jeu est aléatoire et les {nt} territoires sont répartis au hasard, avec une troupe dans chacun. Troupes de départ : 36 à 3, 32 à 4, 27 à 5, 24 à 6 joueurs. À tour de rôle, chacun en place 3 à la fois sur ses territoires jusqu’à les avoir toutes posées.</p>\n<h3>1. Renforts</h3><p>Chaque tour tu reçois une troupe pour 3 territoires contrôlés (arrondi à l’inférieur). Si tu contrôles un continent entier tu reçois aussi son bonus : {bonus}.</p><p>Une fois par tour tu peux échanger 3 cartes contre des troupes : 3 fusils 5, 3 parachutistes 6, 3 chars 7, un de chaque 10, as et deux cartes identiques 12. Chaque carte qui montre un de tes territoires ajoute 2 troupes. Tous les renforts se placent avant d’attaquer.</p>\n<h3>2. Attaques</h3><p>Tu peux attaquer un territoire ennemi voisin d’un des tiens, par la terre ou par les routes en pointillés (Beringia et Estremo Oriente sont reliés par le bord de la carte). On n’attaque pas depuis un territoire avec une seule troupe.</p><p>L’attaquant choisit de 1 à 3 dés. Le défenseur choisit de 1 à 3 dés et lance, puis l’attaquant lance. On trie les dés et on compare le plus haut avec le plus haut, le deuxième avec le deuxième, etc. : dans chaque paire le plus petit nombre perd une troupe, et l’égalité profite au défenseur. Le défenseur a 30 secondes pour répondre, ensuite le jeu lance pour lui avec le maximum de dés.</p><p>Si un territoire est vidé il devient à toi : tu y déplaces au moins les troupes qui ont combattu au dernier lancer. Si tu as pris au moins un territoire pendant ton tour, tu pioches une carte à la fin.</p>\n<h3>3. Manœuvre finale</h3><p>Une fois par tour tu peux déplacer des troupes d’un de tes territoires vers un voisin qui est aussi à toi, en en laissant au moins une. Ensuite ton tour se termine.</p>\n<h3>Élimination</h3><p>Celui qui retire la dernière troupe d’un joueur prend ses cartes. Personne ne peut être éliminé avant la fin du quatrième tour.</p>\n<h3>Guerre éclair (facultatif)</h3><p>Au temps : quand le temps est écoulé on termine le tour. Aux cartes : quand la dernière carte est piochée après les mélanges choisis, on joue un dernier tour qui finit avec celui qui l’a piochée. Après le premier mélange, une élimination termine la partie. Si personne n’a atteint son objectif, gagne celui qui a le plus de points de prestige (écrits sur chaque territoire), puis le plus de troupes, puis un tour de départage. On garde au maximum 7 cartes.</p>\n<h3>Bonus (facultatif)</h3><p>Chaque tour tu reçois une troupe de plus.</p>\n<h3>Sauvegarder et reprendre</h3><p>Avec « Sauver et quitter » la partie est en pause avec le minuteur arrêté. En ligne vous la reprenez depuis la liste ou avec le code ; sur cet appareil, depuis la liste des parties sauvegardées.</p>\n<h3>Notes</h3><p>On peut aussi jouer à 2 (42 troupes chacun). Avec le minuteur, si le temps est écoulé les troupes restantes vont sur les territoires les plus faibles et le tour passe. En ligne chacun pioche son objectif en privé, donc deux joueurs peuvent avoir le même. Les messages privés du chat sont chiffrés.</p>"});
Object.assign(I18N.de,{"set.ta": "Blitzkrieg", "set.bonus": "Bonus (+1 Truppe pro Zug)", "act.fromRule": "1 vom Bonus", "mn.blitz": "Schneller Vorstoß", "rules.body": "<h3>Ziel</h3><p>Jeder Spieler erhält einen geheimen Auftrag: wer ihn zuerst erfüllt, gewinnt. Deinen siehst nur du, unten links.</p>\n<h3>Start</h3><p>Jeder wählt einen Namen für seine Armee. Die Reihenfolge ist zufällig, und die {nt} Gebiete werden zufällig verteilt, mit je einer Truppe. Starttruppen: 36 zu dritt, 32 zu viert, 27 zu fünft, 24 zu sechst. Reihum setzt jeder 3 auf einmal auf seine Gebiete, bis alle gesetzt sind.</p>\n<h3>1. Verstärkung</h3><p>Jeden Zug bekommst du eine Truppe für je 3 gehaltene Gebiete (abgerundet). Hältst du einen ganzen Kontinent, bekommst du auch seinen Bonus: {bonus}.</p><p>Einmal pro Zug kannst du 3 Karten gegen Truppen tauschen: 3 Gewehre 5, 3 Fallschirmjäger 6, 3 Panzer 7, je einer 10, Ass und zwei gleiche Karten 12. Jede Karte, die ein eigenes Gebiet zeigt, bringt 2 Truppen mehr. Alle Verstärkungen werden vor dem Angriff gesetzt.</p>\n<h3>2. Angriffe</h3><p>Du kannst ein feindliches Gebiet angreifen, das an eines deiner grenzt, über Land oder entlang der gestrichelten Routen (Beringia und Estremo Oriente sind über den Kartenrand verbunden). Von einem Gebiet mit nur einer Truppe greift man nicht an.</p><p>Der Angreifer wählt 1 bis 3 Würfel. Der Verteidiger wählt 1 bis 3 Würfel und würfelt, dann würfelt der Angreifer. Die Würfel werden sortiert und der höchste mit dem höchsten verglichen, der zweite mit dem zweiten und so weiter: in jedem Paar verliert die niedrigere Zahl eine Truppe, bei Gleichstand gewinnt der Verteidiger. Der Verteidiger hat 30 Sekunden, danach würfelt das Spiel für ihn mit möglichst vielen Würfeln.</p><p>Wird ein Gebiet leer, gehört es dir: du ziehst mindestens die Truppen nach, die im letzten Wurf gekämpft haben. Hast du in deinem Zug mindestens ein Gebiet genommen, ziehst du am Ende eine Karte.</p>\n<h3>3. Schlussmanöver</h3><p>Einmal pro Zug kannst du Truppen von einem eigenen Gebiet in ein angrenzendes eigenes verschieben und musst mindestens eine zurücklassen. Danach endet dein Zug.</p>\n<h3>Ausscheiden</h3><p>Wer einem Spieler die letzte Truppe nimmt, bekommt seine Karten. Vor dem Ende der vierten Runde scheidet niemand aus.</p>\n<h3>Blitzkrieg (optional)</h3><p>Nach Zeit: ist die Zeit um, wird die Runde zu Ende gespielt. Nach Karten: wird nach den gewählten Mischvorgängen die letzte Karte gezogen, folgt eine letzte Runde, die mit dieser Person endet. Nach dem ersten Mischen beendet ein Ausscheiden die Partie. Hat niemand seinen Auftrag erfüllt, gewinnt, wer die meisten Prestigepunkte hat (auf jedem Gebiet), dann wer die meisten Truppen hat, dann eine Entscheidungsrunde. Man hält höchstens 7 Karten.</p>\n<h3>Bonus (optional)</h3><p>Jeden Zug bekommst du eine Truppe mehr.</p>\n<h3>Speichern und fortsetzen</h3><p>Mit „Speichern und verlassen“ wird die Partie mit angehaltenem Timer pausiert. Online setzt ihr sie aus der Liste oder mit dem Code fort, auf diesem Gerät aus der Liste der gespeicherten Partien.</p>\n<h3>Hinweise</h3><p>Man kann auch zu zweit spielen (je 42 Truppen). Mit Timer gehen bei Zeitablauf die restlichen Truppen auf die schwächsten Gebiete und der Zug geht weiter. Online zieht jeder seinen Auftrag privat, daher können zwei denselben haben. Private Chatnachrichten sind verschlüsselt.</p>"});

Object.assign(I18N.it,{"obj.siege": "Assedio: conquista {n} capitali nemiche e tieni almeno {t} territori. Se le capitali non sono attive, l'obiettivo diventa tenere {k} territori.", "ex.objSiegeDesc": "Obiettivo: conquistare 3 capitali nemiche e tenere almeno 18 territori (vale anche lo stesso avversario più volte, dopo che ha scelto una nuova capitale). Se la regola Capitali è spenta, diventa tenere 24 territori.", "obj.south": "Emisfero Sud: tieni almeno {k} dei {s} territori sotto l'equatore e altri {m} territori.", "ex.objSouthDesc": "Obiettivo: tenere almeno 10 dei 12 territori sotto la linea dell'equatore e altri 4 territori ovunque. Sud: {list}.", "b.abandon": "Abbandona partita", "abandon.q": "Vuoi davvero abbandonare la partita? Il tuo esercito resta sulla mappa ma non gioca più, e non potrai più giocare questa partita.", "log.abandon": "{p0} ha abbandonato la partita: il suo esercito resta fermo sulla mappa.", "pl.retired": "(ha abbandonato)", "pl.offline": "(non collegato)", "log.away": "{p0} non è collegato da più di 10 minuti: il suo turno passa.", "log.idle": "{p0} è fermo da 40 minuti: il suo turno passa."});
