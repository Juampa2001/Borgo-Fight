function renderBattle(){
  const b=$('#battle'); const pa=S.pendingAttack, pg=S.pendingGamble;
  if(pg && S.status==='playing' && !S.paused){
    const mineG=canAct() && actor()===pg.pid; ui.gPick=ui.gPick&&ui.gPick.id===pg.id?ui.gPick:{id:pg.id,sel:[]};
    const key='g'+pg.id+mineG+LANG+ui.gPick.sel.join(','); if(b.dataset.k===key) return; b.dataset.k=key; b.hidden=false;
    let lost=0,won=0; for(let i=0;i<Math.min(pg.a.length,pg.d.length);i++){ if(pg.a[i]>pg.d[i]) won++; else lost++; }
    const att = mineG ? pg.raw.a.map((v,i)=>`<button class="dpick ${ui.gPick.sel.includes(i)?'on':''}" data-gd="${i}" aria-pressed="${ui.gPick.sel.includes(i)}">${d2(v,RED)}</button>`).join('') : pg.a.map(v=>d2(v,RED)).join('');
    const dice=`<p class="row" style="gap:4px">${att} &nbsp; ${pg.d.map(v=>d2(v,BLUE)).join('')}</p><p>${esc(t('gamble.now',{a:lost,b:won}))}</p>`;
    const n=ui.gPick.sel.length;
    b.innerHTML = mineG ? `<p><b>${esc(t('evn.gamble'))}</b></p>${dice}<p>${esc(t('gamble.q'))}</p><div class="row"><button class="btn" id="gKeep">${esc(t('gamble.keep'))}</button><button class="btn primary" id="gRoll" ${n?'':'disabled'}>${esc(n===1?t('gamble.reroll1'):n?t('gamble.rerollN',{n}):t('gamble.pickFirst'))}</button></div>`
      : `${dice}<p>${t('gamble.wait',{p0:pTag(pg.pid)})}</p>`;
    b.querySelectorAll('[data-gd]').forEach(x=>x.onclick=()=>{ const i=+x.dataset.gd; const sel=ui.gPick.sel; ui.gPick.sel = sel.includes(i)?sel.filter(j=>j!==i):[...sel,i]; renderBattle(); });
    const k1=b.querySelector('#gKeep'), k2=b.querySelector('#gRoll');
    if(k1) k1.onclick=()=>{ if(act(actGamble,false)){ afterBattle(); render(); } };
    if(k2) k2.onclick=()=>{ const sel=ui.gPick.sel.slice(); if(act(actGamble,true,sel)){ afterBattle(); render(); } };
    return;
  }
  if(!pa || S.status!=='playing' || S.paused){ b.hidden=true; b.dataset.k=''; return; }
  const iDef=canAct() && actor()===pa.def && pa.stage==='def';
  const iAtt=(mode==='local'||me.id===pa.att) && pa.stage==='att' && actor()===pa.att;
  const key=pa.id+pa.stage+iDef+iAtt+LANG;
  if(b.dataset.k===key) return; b.dataset.k=key; b.hidden=false;
  const head=`<p>${t('bat.head',{p0:pTag(pa.att),t0:'<b>'+esc(tn(pa.to))+'</b>',n:S.armies[pa.to],t1:'<b>'+esc(tn(pa.from))+'</b>',d:pa.nd})}</p>`;
  const tm=`<span class="timer" id="defTmr">${fmtTime(pa.deadline-Date.now())}</span>`;
  if(iDef){
    if(MOBILE()){ ui.objOpen=false; ui.cardsOpen=false; renderDocks(); }
    const max=Math.min(3,S.armies[pa.to]); ui.defDice=Math.min(ui.defDice||3,max)||max;
    b.innerHTML=`${mode==='local'?`<p><b>${t('bat.pass',{p0:esc(pName(pa.def))})}</b></p>`:''}${head}<p>${t('bat.defend',{tm})}</p>
      <div class="row"><div class="seg">${[1,2,3].map(v=>`<button data-dd="${v}" aria-pressed="${ui.defDice===v}" ${v>max?'disabled':''}>${v}</button>`).join('')}</div>
      <button class="btn primary" id="bDef">${esc(t('bat.defBtn'))}</button></div>
      <label class="row" style="font-size:13px"><input type="checkbox" id="bDefAuto"> ${esc(t('bat.auto'))}</label>`;
    b.querySelectorAll('[data-dd]').forEach(x=>x.onclick=()=>{ ui.defDice=+x.dataset.dd; b.querySelectorAll('[data-dd]').forEach(y=>y.setAttribute('aria-pressed',y===x)); });
    b.querySelector('#bDef').onclick=()=>act(actDefend,ui.defDice,b.querySelector('#bDefAuto').checked);
  } else if(pa.stage==='def'){
    const iAmAtt=(mode==='online'&&me.id===pa.att);
    b.innerHTML=`${head}<p>${t('bat.waiting',{p0:pTag(pa.def),tm})}</p>${iAmAtt?`<button class="btn" id="bCancelAtk">${esc(t('bat.cancel'))}</button>`:''}`;
    const c=b.querySelector('#bCancelAtk'); if(c) c.onclick=()=>{ const e=actCancelAttack(S,me.id); if(e) err(e); else commit(); };
  } else {
    const dd=pa.d.map(v=>d2(v,BLUE)).join('');
    if(iAtt){
      b.innerHTML=`${mode==='local'?`<p><b>${t('bat.back',{p0:esc(pName(pa.att))})}</b></p>`:''}${head}<p>${esc(t('bat.defRolled'))} ${dd}</p><button class="btn primary" id="bRoll">${esc(t('bat.rollYours',{n:pa.nd}))}</button>`;
      b.querySelector('#bRoll').onclick=()=>{ if(act(actRoll)){ afterBattle(); render(); } };
    } else b.innerHTML=`${head}<p>${esc(t('bat.defRolled'))} ${dd} ${t('bat.nowAtt',{p0:pTag(pa.att)})}</p>`;
  }
}

  if(sym==='C') return '<svg viewBox="0 0 34 34"><rect x="3" y="22" width="28" height="7" rx="3.5" fill="currentColor"/><rect x="6" y="15" width="22" height="8" rx="2" fill="currentColor"/><rect x="11" y="9" width="11" height="7" rx="2.5" fill="currentColor"/><rect x="21" y="11" width="11" height="2.6" rx="1.2" fill="currentColor"/></svg>';
  if(sym==='A') return '<svg viewBox="0 0 34 34"><path d="M3 22 L22 12 L31 7 L32 9 L24 14 L25 16 L21 18 L19 17 L12 21 L13 25 L9 27 L7 24 L4 25 Z" fill="currentColor"/></svg>';
  if(sym==='P') return '<svg viewBox="0 0 34 34"><path d="M17 3 C18.5 3 19 5 19 7 L19 13 L31 20 L31 23 L19 19 L19 26 L23 29 L23 31 L17 29.5 L11 31 L11 29 L15 26 L15 19 L3 23 L3 20 L15 13 L15 7 C15 5 15.5 3 17 3 Z" fill="#3c8fd6"/></svg>';
  return '<svg viewBox="0 0 34 34"><rect x="6" y="3" width="22" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><text x="17" y="24" text-anchor="middle" font-size="17" font-weight="800" fill="currentColor" font-family="Georgia,serif">A</text></svg>';

function renderDocks(){
  const od=$('#objDock'), cd=$('#cardDock');
  if(!S || !inGame() || S.status==='lobby'){ od.hidden=true; cd.hidden=true; return; }
  const cp=curPid(S);
  if(mode==='local' && ui.objFor && ui.objFor!==cp) ui.objFor=null;
  let ob='';
  if(mode==='local'){
    const o=S.localObj?.[cp];
    ob = ui.objFor===cp && o ? `<p>${esc(objText(o))}</p><p class="note">${esc(objProgress(cp,o))}</p><button class="btn sm" id="oHide">${esc(t('dock.hide'))}</button>`
      : `<p class="note">${esc(t('dock.onlyLook',{p0:pName(cp)}))}</p><button class="btn sm primary" id="oShow">${esc(t('dock.show',{p0:pName(cp)}))}</button>`;
  } else ob = myObj ? `<p>${esc(objText(myObj))}</p><p class="note">${esc(objProgress(me.id,myObj))}</p>` : `<p class="note">${esc(t('dock.loading'))}</p>`;
  const mpid = mode==='local' ? (ui.objFor===cp?cp:null) : me.id;
  if(mpid && exOn(S,'missions')){ const ms=S.missions?.[mpid];
    ob += ms && !ms.done ? `<div class="misbox"><h4>${esc(t('dock.mission'))}: ${esc(t('mn.'+ms.tpl))} <span class="tag ${ms.diff}">${esc(t('diff.'+ms.diff))}</span></h4><p>${missionDesc(ms.tpl,ms.p,false)}</p>
      <p class="note">${esc(t('dock.missionLeft',{n:ms.left}))}. ${esc(t('dock.reward',{r:t('rw.'+ms.diff)}))}${['fort1','fort2','front'].includes(ms.tpl)?'. '+esc(t('dock.defProg',{n:ms.prog.n||0})):''}</p></div>`
      : `<div class="misbox"><p class="note">${esc(t('dock.noMission'))}</p></div>`; }
  od.hidden=false; od.classList.toggle('closed',!ui.objOpen);
  od.innerHTML=`<button class="dh" id="oTog" aria-expanded="${ui.objOpen}"><span>${esc(mode==='local'?t('dock.objOf',{p0:pName(cp)}):t('dock.obj'))}</span><span>${ui.objOpen?'▾':'▸'}</span></button><div class="db">${ob}</div>`;
  od.querySelector('#oTog').onclick=()=>{ ui.objOpen=!ui.objOpen; if(ui.objOpen&&MOBILE()) ui.cardsOpen=false; renderDocks(); };
  od.querySelector('#oShow')&&(od.querySelector('#oShow').onclick=()=>{ ui.objFor=cp; renderDocks(); });
  od.querySelector('#oHide')&&(od.querySelector('#oHide').onclick=()=>{ ui.objFor=null; renderDocks(); });
  const hp = mode==='local' ? cp : me.id, air=airOn(S);
  const h=S.hands[hp]||[]; ui.cards=ui.cards.filter(c=>h.includes(c));
  const pw=S.powers?.[hp]||{}; const npw=air?Object.values(pw).reduce((a,b)=>a+b,0):0;
  const mine=canAct() && actor()===hp && curPid(S)===hp;
  const tv = ui.cards.length===3 ? tradeValue(S,hp,ui.cards) : null;
  const pk = powerOf(S,hp,ui.cards);
  const canTrade = mine && S.phase==='reinforce' && !S.traded && !S.pendingAttack && !S.pendingMove;
  const canConv = mine && (S.phase==='reinforce'||S.phase==='attack') && !S.pendingAttack && !S.pendingMove;
  const canUse = mine && canUsePowers(S,hp);
  let btns='';
  if(ui.cards.length){
    if(tv) btns+=`<button class="btn sm primary" id="cTrade" ${canTrade?'':'disabled'}>${esc(t('dock.trade',{n:tv.total}))}</button>`;
    if(pk) btns+=`<button class="btn sm primary" id="cConv" ${canConv?'':'disabled'}>${esc(t('dock.convert',{pw:t('pw.'+pk)}))}</button>`;
    if(!tv && !pk) btns+=`<span class="note">${esc(t('dock.noCombo',{n:ui.cards.length}))}</span>`;
    if(tv && !canTrade) btns+=`<span class="note">${esc(t('dock.tradeWhen'))}</span>`;
  }
  const cards=h.map(c=>{ const sy=cardSym(S,c), j=sy==='J', own=!j&&S.owner[c]===hp;
    return `<button class="card ${sy} ${ui.cards.includes(c)?'sel':''} ${own?'own':''}" data-card="${c}" title="${j?esc(t('sym.J')):esc(tn(c))+(own?', '+esc(t('dock.own')):'')}">${cardSVG(sy)}<span>${j?esc(t('sym.J')):esc(tn(c))}</span><small>${esc(t('sym.'+sy))}</small></button>`; }).join('');
  const powers=air?Object.keys(POWERS).filter(k=>pw[k]>0).map(k=>`<div class="pw"><span><b>${esc(t('pw.'+k))}</b>${pw[k]>1?' x'+pw[k]:''}</span><button class="btn sm" data-use="${k}" ${canUse&&!(k==='charge'&&S.charge===hp)?'':'disabled'}>${esc(t(k==='charge'&&S.charge===hp?'dock.active':'dock.use'))}</button></div>`).join(''):'';
  cd.hidden=false; cd.classList.toggle('closed',!ui.cardsOpen);
  const head=(mode==='local'?t('dock.cardsOf',{p0:pName(hp),n:h.length}):t('dock.cards',{n:h.length}))+(npw?', '+t('dock.powersN',{n:npw}):'');
  cd.innerHTML=`<button class="dh" id="cTog" aria-expanded="${ui.cardsOpen}"><span>${esc(head)}</span><span>${ui.cardsOpen?'▾':'▸'}</span></button>
    <div class="db">
      ${h.length?`<div class="cards">${cards}</div>`:`<p class="note">${esc(t('dock.noCards'))}</p>`}
      ${btns?`<div class="row">${btns}</div>`:''}
      ${powers?`<h4>${esc(t('dock.powers'))}</h4><div class="powers">${powers}</div>`:''}
      <button class="btn sm" id="cHelp" style="align-self:flex-start">${esc(t(ui.combos?'dock.combosHide':'dock.combos'))}</button>
      ${ui.combos?combosHTML():''}
    </div>`;
  cd.querySelector('#cTog').onclick=()=>{ ui.cardsOpen=!ui.cardsOpen; if(ui.cardsOpen&&MOBILE()) ui.objOpen=false; renderDocks(); };
  cd.querySelector('#cHelp').onclick=()=>{ ui.combos=!ui.combos; renderDocks(); };
  cd.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{ const c=b.dataset.card; ui.cards=ui.cards.includes(c)?ui.cards.filter(x=>x!==c):[...ui.cards,c].slice(-5); renderDocks(); });
  const ct=cd.querySelector('#cTrade'); if(ct) ct.onclick=()=>{ const cs=ui.cards; ui.cards=[]; act(actTrade,cs); };
  const cc=cd.querySelector('#cConv'); if(cc) cc.onclick=()=>{ const cs=ui.cards; ui.cards=[]; act(actConvert,cs); };
  cd.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{ const k=b.dataset.use;
    if(k==='charge'){ act(actPower,'charge',null); return; }
    if(!powerTargets(S,hp,k).length) return toast(t('toast.noTargets',{pw:t('pw.'+k)}));
    ui.power=k; ui.sel=null; ui.target=null; if(MOBILE()) ui.cardsOpen=false; render(); });
}
function powersListHTML(){ return Object.keys(POWERS).map(k=>`<b>${esc(t('pw.'+k))}</b> (${POWERS[k].need.split('').map(x=>t('sym.'+x).toLowerCase()).join(', ')}): ${esc(t('pwd.'+k))}`).join('<br>'); }
function combosHTML(){ return `<div class="note" style="line-height:1.5">${esc(t('combo.armies'))}${airOn(S)?`<br><br>${esc(t('combo.powers'))}<br>${powersListHTML()}`:''}</div>`; }
function objProgress(pid,objId){
  const o=OBJ[objId]; const mine=ownedBy(S,pid);
  const k=need(S,24);
  if(o.type==='count') return t('prog.count',{n:mine.length,m:need(S,o.n)});
  if(o.type==='count2') return t('prog.count2',{n:mine.filter(x=>S.armies[x]>=2).length,m:need(S,o.n)});
  if(o.type==='conts') return o.c.map(c=>t('prog.cont',{c:cname(c),n:CONT[c].terr.filter(x=>S.owner[x]===pid).length,m:CONT[c].terr.length})).join(', ')+'.';
  if(o.type==='globe') return t('prog.globe',{c:MAP.conts.filter(c=>c.terr.some(x=>S.owner[x]===pid)).length,n:mine.length,m:need(S,o.n)});
  if(o.type==='south'){ const SO=TIDS.filter(x=>T[x].hemi==='S'), miss=SO.filter(x=>S.owner[x]!==pid), kk=o.k||SO.length; return t('prog.south',{a:SO.length-miss.length,b:kk,n:mine.length,m:kk+need(S,o.m)})+(miss.length&&miss.length<=6?' '+t('prog.southMiss',{list:miss.map(tn).join(', ')}):''); }
  if(o.type==='north') return t('prog.north',{n:mine.filter(x=>T[x].hemi==='N').length,m:need(S,o.n)});
  if(o.type==='pearls') return exOn(S,'pearls') ? t('prog.pearls',{w:(S.pearlWins||{})[pid]||0,n:o.n,t:mine.length}) : t('prog.pearlsOff',{k,n:mine.length});
  if(o.type==='siege') return exOn(S,'capitals') ? t('prog.siege',{c:(S.capTaken||{})[pid]||0,n:o.n})+' '+t('prog.count',{n:mine.length,m:need(S,o.t||0)}) : t('prog.siegeOff',{k,n:mine.length});
  if(o.type==='hitman') return S.round<=o.r ? t('prog.hitman',{r:S.round,m:o.r,n:mine.length}) : t('prog.hitmanLate',{n:mine.length,k});
  const tg=S.order.find(p=>S.players[p].color===o.color);
  if(!tg||tg===pid) return t('prog.notEnemy',{n:mine.length,k});
  if(S.eliminated[tg] && S.eliminated[tg]!==pid) return t('prog.elimOther',{n:mine.length,k});
  return t('prog.destroy',{c:armyName(tg),n:ownedBy(S,tg).length});
}
function renderPanes(){
  const cp=curPid(S);
  document.querySelectorAll('[data-tab]').forEach(b=>{ const k=b.dataset.tab; b.firstChild.nodeValue=t('tab.'+k)+(k==='chat'?' ':''); b.setAttribute('aria-selected',k===ui.tab); });
  const pl=S.order.map(p=>{ const c=pColor(p), out=S.eliminated[p];
    return `<div class="pl ${p===cp&&S.status==='playing'?'cur':''} ${out?'out':''}"><span class="dot" style="background:${c.hex}"></span><span>${pTag(p)}${isRetired(S,p)?` <small class="ret">${esc(t('pl.retired'))}</small>`:(mode==='online'&&!out&&p!==me.id&&Date.now()-seenOf(p)>120000?` <small class="ret">${esc(t('pl.offline'))}</small>`:'')}</span>
      <span class="stats">${esc(t('stats',{t:ownedBy(S,p).length,a:totalArmies(S,p),c:S.hands[p].length}))}</span></div>`; }).join('');
  const meP=mode==='local'?cp:me.id;
  const ct=MAP.conts.map(c=>{ const own=c.terr.every(x=>S.owner[x]===S.owner[c.terr[0]]) ? S.owner[c.terr[0]] : null; const n=c.terr.filter(x=>S.owner[x]===meP).length;
    return `<div><span>${own?`<span class="dot" style="background:${pColor(own).hex}"></span> `:''}${esc(cname(c.id))} <span style="color:var(--muted)">+${c.bonus}</span></span><span style="color:var(--muted)">${esc(inGame()?t('conts.yours',{n,m:c.terr.length}):t('conts.count',{m:c.terr.length}))}</span></div>`; }).join('');
  let hunt=''; if(exOn(S,'pearls')){ const c=S.chest;
    hunt = !c ? `<div class="huntbox"><b>${esc(t('hunt.title'))}</b><span>${esc(t(S.round<2&&!S.pearlWins?'hunt.none':'hunt.next',{r:S.nextChest||2}))}</span></div>`
      : `<div class="huntbox"><b>${esc(t('hunt.title'))}</b><span>${esc(c.stage===1?t('hunt.c1',{c:cname(T[c.tid].cont)}):c.stage===2?t('hunt.c2',{list:c.cands.map(tn).join(', ')}):t('hunt.c3',{t0:tn(c.tid),p0:pName(S.owner[c.tid])}))}</span><span class="note">${esc(t('hunt.prize',{pr:t('pn.'+c.type)}))}</span></div>`; }
  $('#pane-players').innerHTML=`${hunt}<div class="plist">${pl}</div><h4>${esc(t('conts.title'))}</h4><div class="conts">${ct}</div>`;
  $('#pane-log').innerHTML=S.log.slice(-60).map(l=>`<div>${l.k?logLine(l):esc(l.t||'')}</div>`).join('');
  const chatTab=document.querySelector('[data-tab="chat"]'); const chatOn=mode==='online' && inGame();
  chatTab.hidden=!chatOn; if(!chatOn && ui.tab==='chat') ui.tab='players';
  for(const k of ['players','chat','log']) $('#pane-'+k).hidden = ui.tab!==k;
  $('#side').classList.toggle('collapsed',ui.collapsed);
  $('#chatForm button').textContent=t('chat.send');
  if(chatOn) renderChat();
}

let modalKind=null;
function modal(html){ const m=$('#modal'); m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><button class="mclose" aria-label="${esc(t('b.close'))}">✕</button>${html}</div>`; m.hidden=false;
  m.querySelector('.mclose').onclick=dismissModal; return m; }
// chiusura con la X, con Esc o toccando fuori: mai per le scelte obbligatorie (spostamento dopo conquista)
function dismissModal(){ if(modalKind&&String(modalKind).startsWith('move:')) return; const k=modalKind; closeModal(); if(k==='win') modalKind='winClosed'; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#modal').hidden) dismissModal(); });
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') dismissModal(); });
function showFeedback(){
  const prev=modalKind; let type='bug';
  modal(`<h2>${esc(t('fb.title'))}</h2><div class="seg"><button data-fb="bug" aria-pressed="true">${esc(t('fb.bug'))}</button><button data-fb="idea" aria-pressed="false">${esc(t('fb.idea'))}</button></div>
    <textarea id="fbText" rows="5" maxlength="2000" placeholder="${esc(t('fb.ph'))}"></textarea><div class="row"><button class="btn primary" id="fbSend">${esc(t('fb.send'))}</button><button class="btn" id="fbNo">${esc(t('b.close'))}</button></div>`);
  modalKind='feedback';
  document.querySelectorAll('[data-fb]').forEach(b=>b.onclick=()=>{ type=b.dataset.fb; document.querySelectorAll('[data-fb]').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
  $('#fbNo').onclick=()=>{ closeModal(); if(prev==='win') modalKind='winClosed'; };
  $('#fbSend').onclick=async()=>{ const text=$('#fbText').value.trim(); if(!text) return toast(t('fb.empty'));
    const body={type,text,lang:LANG,at:Date.now(),version:BORGO_CONFIG.version,mode:mode||'menu',round:S?.round||0,ua:navigator.userAgent.slice(0,160)};
    let ok=false;
    if(db){ try{ await db.collection('feedback').doc(Date.now().toString(36)+rint(1e6).toString(36)).set(body); ok=true; }catch(e){} }

// ---------------- chat (privata e cifrata) ----------------
const chat={gid:null, peer:'all', msgs:{}, seen:{}, keys:{}, priv:null, subs:[], decCache:{}};
try{ chat.seen=JSON.parse(localStorage.getItem('borgofight-seen')||'{}'); }catch(e){}
const EC={name:'ECDH',namedCurve:'P-256'};
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ensureKeys(){
  if(!window.crypto?.subtle||!db||!me.id) return;
  try{
    const ref=db.doc('data/users/'+me.id+'/keys'); const snap=await ref.get(); let pubJwk;
    if(snap.exists){ const d=clone(snap.data()); chat.priv=await crypto.subtle.importKey('jwk',d.priv,EC,false,['deriveKey']); pubJwk=d.pub; }
    else { const kp=await crypto.subtle.generateKey(EC,true,['deriveKey']); const privJwk=await crypto.subtle.exportKey('jwk',kp.privateKey);
      pubJwk=await crypto.subtle.exportKey('jwk',kp.publicKey); await ref.set({priv:privJwk,pub:pubJwk}); chat.priv=kp.privateKey; }
    const pref=db.doc('pubkeys/'+me.id); const ps=await pref.get();
    if(!ps.exists || ps.data().jwk?.x!==pubJwk.x) await pref.set({jwk:pubJwk});
  }catch(e){ chat.priv=null; }
}
async function peerKey(pid){
  if(chat.keys[pid]) return chat.keys[pid]; if(!chat.priv) return null;
  try{ const s=await db.doc('pubkeys/'+pid).get(); if(!s.exists) return null;
    const pub=await crypto.subtle.importKey('jwk',clone(s.data().jwk),EC,false,[]);
    const k=await crypto.subtle.deriveKey({name:'ECDH',public:pub},chat.priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    chat.keys[pid]=k; return k; }catch(e){ return null; }
}
const pairKey=p=>[me.id,p].sort().join('__');
const chanPath=peer=>`games/${gameId}/chat/${peer==='all'?'all':pairKey(peer)}/m`;
function initChat(){
  if(chat.gid===gameId) return;
  chat.subs.forEach(u=>u()); chat.subs=[]; chat.msgs={}; chat.gid=gameId; chat.peer='all';
  for(const peer of ['all',...S.order.filter(p=>p!==me.id)]){
    chat.msgs[peer]=[];
    chat.subs.push(db.collection(chanPath(peer)).orderBy('t','desc').limit(80).onSnapshot(async q=>{
      const out=[];
      for(const d of q.docs){ if(!d.exists) continue; const m=d.data(); let txt=m.txt;
        if(peer!=='all'){
          if(chat.decCache[d.id]!==undefined) txt=chat.decCache[d.id];
          else { txt=null; const k=await peerKey(peer);
            if(k){ try{ const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.iv),additionalData:new TextEncoder().encode(pairKey(peer))},k,unb64(m.ct)); txt=new TextDecoder().decode(pt); chat.decCache[d.id]=txt; }catch(e){} } }
        }
        out.push({id:d.id,f:m.f,t:m.t,txt});
      }
      chat.msgs[peer]=out.reverse(); renderChat();
    },e=>{}));
  }
  $('#chatForm').onsubmit=async e=>{ e.preventDefault(); const inp=$('#chatInput'); const txt=inp.value.trim(); if(!txt) return; inp.value=''; await sendChat(txt); };
}
async function sendChat(txt){
  const peer=chat.peer; txt=txt.slice(0,400);
  if(findBad(txt).bad){ toast(t('chat.blocked')); $('#chatInput').value=txt; return; }
  try{
    const ref=db.collection(chanPath(peer)).doc(Date.now().toString(36)+rint(1e6).toString(36));
    if(peer==='all') await ref.set({f:me.id,t:Date.now(),txt});
    else { const k=await peerKey(peer); if(!k){ toast(t('chat.noKey',{p0:pName(peer)})); return; }
      const iv=crypto.getRandomValues(new Uint8Array(12));
      const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:new TextEncoder().encode(pairKey(peer))},k,new TextEncoder().encode(txt));
      chat.decCache[ref.id]=txt; await ref.set({f:me.id,t:Date.now(),iv:b64(iv),ct:b64(ct)}); }
  }catch(e){ dbError(e); }
}
function unread(peer){ const seen=chat.seen[gameId+'|'+peer]||0; return (chat.msgs[peer]||[]).filter(m=>m.f!==me.id && m.t>seen).length; }
// blocca e segnala: chi è bloccato non si vede più in chat su questo dispositivo
function blockedSet(){ try{ return new Set(JSON.parse(localStorage.getItem('bf-blocked')||'[]')); }catch(e){ return new Set(); } }
function isBlocked(p){ return p!==me.id && blockedSet().has(p); }
function setBlocked(p,on){ const s=blockedSet(); on?s.add(p):s.delete(p); try{ localStorage.setItem('bf-blocked',JSON.stringify([...s])); }catch(e){} }
async function reportPlayer(p){
  const msgs=[]; for(const k in chat.msgs) for(const m of chat.msgs[k]) if(m.f===p && m.txt!=null) msgs.push({t:m.t,txt:String(m.txt).slice(0,400),ch:k==='all'?'all':'priv'});
  msgs.sort((a,b)=>a.t-b.t);
  try{ await db.collection('reports').doc(Date.now().toString(36)+rint(1e6).toString(36)).set({by:me.id,who:p,game:gameId||'',at:Date.now(),name:pName(p),msgs:msgs.slice(-20)}); toast(t('chat.reported')); }catch(e){ dbError(e); }
}
function renderChat(){
  if(chat.gid!==gameId || !S) return;
  const viewing = ui.tab==='chat' && !ui.collapsed;
  if(viewing){ const last=(chat.msgs[chat.peer]||[]).slice(-1)[0]; if(last){ const k=gameId+'|'+chat.peer; if((chat.seen[k]||0)<last.t){ chat.seen[k]=last.t; try{ localStorage.setItem('borgofight-seen',JSON.stringify(chat.seen)); }catch(e){} } } }
  const peers=['all',...S.order.filter(p=>p!==me.id)];
  let total=0; peers.forEach(p=>total+=unread(p));
  const bd=$('#chatBadge'); bd.hidden=!total; bd.textContent=total;
  $('#chatTabs').innerHTML=peers.map(p=>{ const u=unread(p);
    return `<button data-peer="${p}" aria-pressed="${chat.peer===p}">${p==='all'?esc(t('chat.all')):`<span class="dot" style="background:${pColor(p).hex}"></span>${esc(pName(p))}`}${u?` <span class="badge">${u}</span>`:''}</button>`; }).join('');
  $('#chatTabs').querySelectorAll('[data-peer]').forEach(b=>b.onclick=()=>{ chat.peer=b.dataset.peer; renderChat(); });
  const box=$('#chatMsgs'); const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<40;
  const ms=(chat.msgs[chat.peer]||[]).filter(m=>!isBlocked(m.f));
  box.innerHTML = ms.length ? ms.map(m=>`<div class="msg ${m.f===me.id?'mine':''}"><small>${esc(pName(m.f))}, ${new Date(m.t).toLocaleTimeString(LANG,{hour:'2-digit',minute:'2-digit'})}</small>${esc(m.txt==null?t('chat.unreadable'):cleanText(m.txt))}</div>`).join('')
    : `<p class="note">${esc(t(chat.peer==='all'?'chat.emptyAll':'chat.emptyPriv'))}</p>`;
  if(atBottom||viewing) box.scrollTop=box.scrollHeight;
  const pe=chat.peer, note = pe==='all' ? t('chat.noteAll') : isBlocked(pe) ? t('chat.blockedNote',{p0:pName(pe)}) : (chat.priv ? t('chat.notePriv',{p0:pName(pe)}) : t('chat.noCrypto'));
  $('#chatNote').innerHTML = esc(note) + (pe!=='all' ? ` <span class="chatmod"><button class="linkbtn" id="cBlock">${esc(t(isBlocked(pe)?'chat.unblock':'chat.block'))}</button> <button class="linkbtn" id="cReport">${esc(t('chat.report'))}</button></span>` : '');
  $('#cBlock')&&($('#cBlock').onclick=()=>{ setBlocked(pe,!isBlocked(pe)); renderChat(); });
  $('#cReport')&&($('#cReport').onclick=()=>askYesNo(t('chat.reportQ',{p0:pName(pe)}),()=>reportPlayer(pe)));
  $('#chatInput').placeholder = chat.peer==='all' ? t('chat.phAll') : t('chat.phTo',{p0:pName(chat.peer)});
}

const OBJ_DEPS={objSiege:'capitals', objPearls:'pearls'};
function depOk(ex,id){ return !OBJ_DEPS[id] || !!ex[OBJ_DEPS[id]]; }
function setExtra(ex,id,val){
  if(val && !depOk(ex,id)){ toast(t('ex.needs',{r:t('ex.'+OBJ_DEPS[id])})); return false; }
  ex[id]=val;
  if(!val) for(const o in OBJ_DEPS) if(OBJ_DEPS[o]===id) ex[o]=false;   // spegnendo una regola si spengono gli obiettivi collegati
  return true;
}
function groupIds(g){ return (g==='rules'?EXTRAS:EXTRA_OBJ).map(e=>e.id); }

async function ensureLang(l){

  const en={}; for(const k in I18N.en) if(typeof I18N.en[k]==='string' && !['langName'].includes(k)) en[k]=I18N.en[k]; for(const c in I18N.en.cont) en['cont:'+c]=I18N.en.cont[c];
  if(I18N[l] && I18N[l].__pack) return true;
  if(location.protocol.startsWith('http')){ try{ const r=await fetch('lang/'+l+'.json'); if(r.ok){ installLang(l,await r.json()); I18N[l].__pack=1; return true; } }catch(e){} }
  let d={}; try{ const c=JSON.parse(localStorage.getItem('bf-i18n-'+l)||'null'); if(c&&c.d) d=c.d; }catch(e){}
  if(db && Object.keys(d).length<Object.keys(en).length){ try{ const sn=await db.doc('i18n/'+l).get(); if(sn.exists && sn.data().d) d={...sn.data().d,...d}; }catch(e){} }
  let missing=Object.keys(en).filter(k=>typeof d[k]!=='string');
  if(!missing.length){ installLang(l,d); try{ localStorage.setItem('bf-i18n-'+l,JSON.stringify({d})); }catch(e){} return true; }
  const sample=await getSample();
  if(!sample){ if(Object.keys(d).length){ installLang(l,d); return true; } toast(t('lang.unavailable')); return false; }
  const chunks=[]; let cur={}, size=0; for(const k of missing){ const v=en[k]; if(size+v.length>2600 && size){ chunks.push(cur); cur={}; size=0; } cur[k]=v; size+=v.length; } if(size) chunks.push(cur);
  const name=LANG_META[l].n;
  modal(`<h2>${esc(name)}</h2><p id="lgP">${esc(t('lang.preparing',{l:name,p:0}))}</p><div class="pbar"><i id="lgB" style="width:0%"></i></div><p class="note">${esc(t('lang.once'))}</p>`); modalKind='confirm';
  try{
    for(let i=0;i<chunks.length;i++){
      const prompt=`You translate the user interface of a strategy board game called Borgo Fight into ${LANG_META[l].e}.\nRules:\n- Translate only the values of the JSON object below and keep every key exactly the same.\n- Keep every placeholder in curly braces exactly as it is, for example {p0}, {n}, {t0}.\n- Keep the HTML tags <h3>, <p>, <b>, <br> exactly as they are.\n- Do not translate these names: Borgo Fight, Mare Nostrum, Blitz, and Italian place names like Giampopoli or Borgo Halfnone.\n- Use simple, common, friendly words, short and clear like in a mobile game.\n- Answer with only the JSON object.\nJSON:\n${JSON.stringify(chunks[i])}`;
      const out=await sample.json(prompt,{modelTier:'default'});
      for(const k in chunks[i]){ const v=out&&out[k]; if(typeof v==='string' && v.trim() && phs(v)===phs(en[k])) d[k]=v; }
      try{ localStorage.setItem('bf-i18n-'+l,JSON.stringify({d})); }catch(e){}
      const p=Math.round((i+1)/chunks.length*100); const P=$('#lgP'), B=$('#lgB'); if(P) P.textContent=t('lang.preparing',{l:name,p}); if(B) B.style.width=p+'%';
    }
  }catch(e){ closeModal(); toast(t('lang.failed')); if(!Object.keys(d).length) return false; }
  closeModal();
  if(db && canWrite!==false){ try{ await db.doc('i18n/'+l).set({d,at:Date.now()}); }catch(e){} }
  installLang(l,d); return true;
}
async function setLang(l){
  if(!LANG_META[l]) return;
  if(!I18N[l] || (!['it','en','es','fr','de'].includes(l) && !I18N[l].__pack)){ const ok=await ensureLang(l); if(!ok){ document.querySelectorAll('.langsel').forEach(s=>s.value=LANG); return; } }
  LANG=l; document.documentElement.dir=LANG_META[l].rtl?'rtl':'ltr'; try{ localStorage.setItem('bf-lang',l); }catch(e){} document.documentElement.lang=l;
  const wasRules=modalKind==='rules';
  if(['menu','confirm','rules'].includes(modalKind)) closeModal();
  $('#battle').dataset.k='';
  if(S && S.status!=='lobby' && $('#screen').hidden){ if(modalKind&&modalKind.startsWith('move:')) closeModal(); if(modalKind==='win') modalKind=null; render(); }
  else if(screenFn) screenFn(); else renderHome();
  if(wasRules) showRules();
}

// ---------------- timer ----------------
setInterval(()=>{
  if(!S || S.status!=='playing' || S.paused) return;
  const now=Date.now(), pa=S.pendingAttack;
  const tm=$('#tmr'); if(tm && S.turnDeadline){ const ms=S.turnDeadline-now; tm.textContent=fmtTime(pa&&pa.stage==='def'?S.turnDeadline-pa.since:ms); tm.classList.toggle('warn',ms<15000); }
  const g=$('#gtmr'); if(g){ const ms=S.startedAt+S.settings.taMinutes*60000-now; g.textContent=fmtTime(ms); }
  const dt=$('#defTmr'); if(dt&&pa) dt.textContent=fmtTime(pa.deadline-now);
  if(readOnly || !(mode==='local'||inGame())) return;
  // partita ripresa dopo tanto tempo: si riparte con un turno fresco invece di saltare i turni di tutti
  if(S.turnDeadline && now-S.turnDeadline>90000 && (!pa||pa.stage!=='def')){ S.turnDeadline=now+(+S.settings.turnSeconds||0)*1000; S.seq++; commit(); return; }
  if(pa && pa.stage==='def'){
    if(mode==='online' && isRetired(S,pa.def) && forcedDef!==pa.id){ forcedDef=pa.id; autoDefend(S); commit(); return; }
    if(now-pa.deadline>90000){ pa.deadline=now+DEF_MS; pa.since=now; S.seq++; commit(); return; }
    if(now<pa.deadline || forcedDef===pa.id) return;
    if(mode==='local' || me.id===pa.att || me.id===pa.def || now>pa.deadline+10000){ forcedDef=pa.id; autoDefend(S); commit(); }
    return;
  }
  if(mode==='online' && !pa && forcedSeq!==S.seq && !S.eliminated[me.id] && !isRetired(S,me.id)){
    const cur=curPid(S), idle=now-(S.at||now); let why=null;
    if(isRetired(S,cur)) why='retired';
    else if(!S.turnDeadline && cur!==me.id){
      if(now-seenOf(cur)>10*60000 && idle>60000) why='away';      // non è più sulla pagina o si è disconnesso
      else if(idle>40*60000) why='idle';                           // collegato ma fermo
    }
    if(why){
      // lo fa il primo giocatore attivo collegato; se non c'è, chiunque dopo 2 minuti
      const execs=S.order.filter(p=>p!==cur&&!S.eliminated[p]&&!isRetired(S,p)&&(p===me.id||now-seenOf(p)<120000));
      if(execs[0]===me.id || idle>120000+(why==='retired'?0:why==='away'?10*60000:40*60000)){
        forcedSeq=S.seq; ui.sel=null; ui.target=null; ui.power=null;
        if(why!=='retired') log(S,why,[cur]);
        forceEnd(S); commit(); return;
      }
    }
  }
  if(!S.turnDeadline || now<S.turnDeadline || forcedSeq===S.seq) return;
  let may=false;
  if(mode==='local' || curPid(S)===me.id) may=true;
  else if(!S.eliminated[me.id]){ const al=S.order.filter(p=>!S.eliminated[p]); const k=((al.indexOf(me.id)-al.indexOf(curPid(S)))+al.length)%al.length; if(now>S.turnDeadline+10000*k) may=true; }
  if(!may) return;
  forcedSeq=S.seq; ui.sel=null; ui.target=null; ui.power=null; if(modalKind&&modalKind.startsWith('move:')) closeModal();
  const cur=curPid(S), prevMiss=(S.missed||{})[cur]||0;
  forceEnd(S);
  // timer scaduto: il turno passa e basta; al terzo turno saltato di fila diventa un abbandono
  if(mode==='online' && S.status==='playing' && !isRetired(S,cur)){ S.missed=S.missed||{}; S.missed[cur]=prevMiss+1; if(S.missed[cur]>=3) actAbandon(S,cur,true); }
  commit(); toast(t('toast.timeout'));
},500);

// ---------------- avvio ----------------
$('#bHandle').onclick=()=>{ ui.collapsed=!ui.collapsed; if(S&&S.status!=='lobby') renderPanes(); };
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ ui.tab=b.dataset.tab; if(ui.collapsed) ui.collapsed=false; if(S) renderPanes(); });
try{ localStorage.removeItem('borgofight-local'); }catch(e){}
buildMap(); requestAnimationFrame(fit);
renderHome();
(async()=>{
  const C=window.claude;
  if(C && typeof C.use==='function'){
    try{ [db,userApi]=await Promise.all([C.use('db'),C.use('user')]); }catch(e){}
    if(userApi){ try{ me=await userApi.me(); canWrite=await userApi.can('data.write'); }catch(e){} }
    onlineReady=!!(db && me && me.id);
    if(onlineReady){ subscribeGames(); ensureKeys(); }
    if(!S && screenFn===renderHome) renderHome();
  }
})();
</script>
